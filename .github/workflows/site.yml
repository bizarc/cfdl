name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "packs/**"
      - "examples/**"
      - "benchmarks/**"
      - "distribution/install-configure.md"
      - "editors/vscode/syntaxes/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "packs/**"
      - "examples/**"
      - "benchmarks/**"
      - "distribution/install-configure.md"
      - "editors/vscode/syntaxes/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# Build-only. Deployment happens on Vercel; cfdl.dev DNS is a human-approved
# launch step.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the Vercel build image so CI can't pass where deploys fail.
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Generated content is in sync with canonical sources
        working-directory: site
        run: npm run sync:check

      - name: Design-system token guard
        working-directory: site
        run: npm run check:tokens

      - name: Internal link check
        working-directory: site
        run: npm run check:links

      # The wasm bundle is committed because Vercel's build image has no Rust
      # toolchain; make sure an engine change can't ship without a rebuild.
      - name: Committed wasm bundle is fresh
        if: github.event_name == 'pull_request'
        working-directory: site
        run: node scripts/check-wasm-fresh.mjs origin/${{ github.base_ref }}

      - name: Lint
        working-directory: site
        run: npm run lint

      - name: Build
        working-directory: site
        run: npm run build
