name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "packs/**"
      # Engine sources are compiled into the committed wasm bundle, so a
      # change here can stale it. Without this the freshness gate never runs.
      - "crates/**"
      - "Cargo.toml"
      - "examples/**"
      - "benchmarks/**"
      - "distribution/install-configure.md"
      - "editors/vscode/syntaxes/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "packs/**"
      # Engine sources are compiled into the committed wasm bundle, so a
      # change here can stale it. Without this the freshness gate never runs.
      - "crates/**"
      - "Cargo.toml"
      - "examples/**"
      - "benchmarks/**"
      - "distribution/install-configure.md"
      - "editors/vscode/syntaxes/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# Build-only. Deployment happens on Vercel; cfdl.dev DNS is a human-approved
# launch step.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The freshness gates diff against a base ref; the default
          # shallow clone does not contain it and they now fail hard
          # rather than skipping.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Match the Vercel build image so CI can't pass where deploys fail.
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      # One step calling one make target, rather than six inlined `npm run`s.
      # The makefile is the single definition of what the gates are; restating
      # them here made a second list, and a gate present in one list and absent
      # from the other silently stops running. That has bitten in both
      # directions — see the note in ci.yml.
      #
      # The freshness gates are not in here because they need a base ref, which
      # differs between a PR and a push; they keep their own steps below.
      - name: Site gates
        run: make verify-site-nofresh

      # The committed wasm bundle and notebook pages must match the sources they
      # were generated from. Both are committed because neither Vercel nor this
      # runner can regenerate them — the bundle needs Rust, the notebooks need
      # Python plus the compiled extension.
      #
      # `make verify-site-fresh` is the same target a developer runs locally;
      # only BASE_REF differs. On a PR that is the base branch, on a push the
      # commit before it, so a direct-to-main change cannot ship a stale engine.
      - name: Committed artefacts are fresh
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            make verify-site-fresh BASE_REF="origin/${{ github.base_ref }}"
          else
            make verify-site-fresh BASE_REF="${{ github.event.before }}"
          fi

      - name: Lint
        working-directory: site
        run: npm run lint

      - name: Build
        working-directory: site
        run: npm run build

      - name: Build Storybook
        working-directory: site
        run: npm run build-storybook

  # Build the wasm bundle and hand Vercel a finished artefact.
  #
  # This job exists because Vercel's build image has no Rust toolchain, which is
  # the whole reason the bundle has been committed. Building it here means it can
  # stop being committed: a bundle built from the current sources is fresh by
  # construction, so the stamp and freshness gates become unnecessary rather than
  # merely satisfied.
  #
  # Runs alongside Vercel's own Git integration until that is disconnected —
  # deliberately, so the new path can be proven on a real preview URL before the
  # old one is turned off. See site/DEPLOY.md.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    # OFF until the token is widened to Team scope, because it cannot succeed
    # before then and a job that always fails teaches people to ignore red.
    #
    # Turn it on with a repository variable — Settings -> Secrets and variables
    # -> Actions -> Variables -> ENABLE_CI_DEPLOY = true. A variable rather than
    # deleting this line so enabling it is one click and reversible, and so the
    # workflow is reviewed and in main rather than living on a branch.
    if: vars.ENABLE_CI_DEPLOY == 'true'
    # These are required after all, and the token must be TEAM-scoped.
    #
    # `--scope` is passed explicitly as well. The project lives under the
    # `bizarcs-projects` team — visible in any deployment URL — and naming it
    # removes the CLI's need to infer which account a bare token belongs to.
    # That inference is what fails when a token is scoped to a personal account
    # while the project is owned by a team: the lookup succeeds against the
    # wrong owner and reports the project as unreadable rather than as
    # belonging to someone else.
    #
    # Override with a repository variable VERCEL_TEAM_SLUG if the team is ever
    # renamed, rather than editing this file.
    #
    # Three attempts established it, and the failures are worth keeping because
    # each one looks like a different problem:
    #
    #   with these vars     -> "Could not retrieve Project Settings"  (team-level lookup denied)
    #   without them        -> "Loading teams... User not found"      (user-level lookup denied)
    #   skip `vercel pull`  -> "No Project Settings found locally"    (build needs what pull fetches)
    #
    # So `vercel build` requires the settings only `vercel pull` provides, and
    # `pull` requires a user/team resolution that a PROJECT-scoped token refuses
    # by design — it "denies any request to another project, to a user-level
    # resource, or to a team-level resource". The tight scope and this workflow
    # are incompatible; there is no third spelling.
    #
    # Team scope is still far narrower than Full Account, which reaches every
    # team the owner belongs to.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Pinned deliberately; see the note in site/scripts/build-wasm.sh.
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - uses: actions/setup-node@v4
        with:
          # Match the Vercel build image so CI cannot pass where deploys fail.
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      # WHY THE PROJECT LINK IS WRITTEN RATHER THAN PULLED.
      #
      # `vercel pull` fetches project settings, and to do that it first resolves
      # the token to a user and then to a team. A PROJECT-SCOPED token cannot do
      # either — that is the point of the scope — so `pull` fails at the first
      # step with "Not able to load user ... User not found (404)", before the
      # project is ever consulted.
      #
      # Vercel requires choosing a project when issuing a token, so a
      # project-scoped token is what is available. It CAN deploy to its own
      # project; it just cannot answer "who am I".
      #
      # `vercel build` does not need the lookup — it needs the settings that
      # `pull` would have written to `.vercel/project.json`. We already hold
      # those: they are the two secrets, taken from the repository's own link
      # file. Writing them directly skips the lookup entirely.
      #
      # The `settings` block is required too, not just the ids: `vercel build`
      # rejects a link without it, again with "No Project Settings found
      # locally". They are the project's own build settings, and null means
      # "use the framework default" — which is what this project does, since
      # the build command lives in site/package.json rather than in Vercel.
      - name: Write the Vercel project link
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<JSON
          {
            "projectId": "${{ secrets.VERCEL_PROJECT_ID }}",
            "orgId": "${{ secrets.VERCEL_ORG_ID }}",
            "settings": {
              "framework": "nextjs",
              "devCommand": null,
              "installCommand": null,
              "buildCommand": null,
              "outputDirectory": null,
              "rootDirectory": "site",
              "nodeVersion": "24.x"
            }
          }
          JSON

      # BEFORE `vercel build`. That runs `next build`, which copies public/ as it
      # finds it — build the bundle after and the deploy ships without an engine.
      - name: Build the wasm bundle
        working-directory: site
        run: npm run build:wasm

      # THE ONLY PLACE THE BUNDLE IS CHECKED, because it is the only place one
      # exists. It is not committed, so a developer's machine and the build job
      # have nothing to inspect — and a bundle built from the current sources a
      # step ago is fresh by construction, which is what the retired stamp and
      # freshness gates were approximating.
      #
      # What remains is what freshness never covered: that it reports the engine
      # version it was built from, and that it runs.
      #
      # SIZE IS CHECKED BY THE BUILD STEP ABOVE, not here. `check-wasm-budget`
      # existed to catch a COMMITTED bundle drifting from the budget between
      # rebuilds; no bundle is committed now, so it was re-checking the bytes
      # build-wasm.sh had just checked, one step earlier, in the same job.
      - name: Check the bundle
        working-directory: site
        run: |
          node scripts/check-wasm-version.mjs
          node scripts/check-wasm-smoke.mjs

      # From the REPO ROOT, not site/. The Vercel project sets rootDirectory to
      # `site` in its own settings, so running from site/ makes the CLI resolve
      # `site/site` and fail on a path that does not exist.
      - name: Build
        run: >
          npx vercel@latest build
          ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
          --token=${{ secrets.VERCEL_TOKEN }}

      # `--archive=tgz` uploads ONE archive instead of one API request per
      # file. Vercel caps file-upload requests at 40,000 a day, and a ~46 MB
      # static site is thousands of files per deploy — a day of ordinary merges
      # exhausts it and every later deploy fails with
      # `code: "api-upload-paid"`, which is what Vercel's own error tells you
      # to fix this way.
      - name: Deploy
        run: >
          npx vercel@latest deploy --prebuilt --archive=tgz
          ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
          --token=${{ secrets.VERCEL_TOKEN }}
