name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "editors/vscode/syntaxes/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "editors/vscode/syntaxes/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# Build-only. Deployment happens on Vercel (preview per PR; production and
# the cfdl.dev domain are human-approved launch steps).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Design-system token guard
        working-directory: site
        run: ./scripts/check-tokens.sh

      - name: Lint
        working-directory: site
        run: npm run lint

      - name: Build
        working-directory: site
        run: npm run build
