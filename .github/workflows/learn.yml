name: learn

on:
  push:
    branches: [main]
    paths:
      - "learn/**"
      - "training/**"
      # The design system is mirrored from site/; a change there must re-run
      # the drift gate here.
      - "site/app/tokens.css"
      - "site/app/globals.css"
      - "site/components/Logo.tsx"
      - "site/components/ThemeToggle.tsx"
      - "site/components/Providers.tsx"
      - "site/components/ds/**"
      - "site/lib/cn.ts"
      - "site/lib/shiki.ts"
      - "site/public/favicon.svg"
      - "editors/vscode/syntaxes/**"
      - ".github/workflows/learn.yml"
  pull_request:
    paths:
      - "learn/**"
      - "training/**"
      - "site/app/tokens.css"
      - "site/app/globals.css"
      - "site/components/Logo.tsx"
      - "site/components/ThemeToggle.tsx"
      - "site/components/Providers.tsx"
      - "site/components/ds/**"
      - "site/lib/cn.ts"
      - "site/lib/shiki.ts"
      - "site/public/favicon.svg"
      - "editors/vscode/syntaxes/**"
      - ".github/workflows/learn.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the Vercel build image so CI can't pass where deploys fail.
          node-version: "24"
          cache: npm
          cache-dependency-path: learn/package-lock.json

      - name: Install
        working-directory: learn
        run: npm ci

      # One step calling one make target; the makefile is the single
      # definition of what the gates are. Same convention as site.yml.
      - name: Learn gates
        run: make verify-learn-nofresh

      - name: Lint
        working-directory: learn
        run: npm run lint

      - name: Build
        working-directory: learn
        run: npm run build

  # Mirrors the site deploy job (see site.yml for the full rationale on the
  # hand-written project link and token scoping). OFF until the learn Vercel
  # project exists and its id is stored — enable with repository variable
  # ENABLE_LEARN_CI_DEPLOY = true and secret VERCEL_LEARN_PROJECT_ID.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: vars.ENABLE_LEARN_CI_DEPLOY == 'true'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_LEARN_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: learn/package-lock.json

      - name: Install
        working-directory: learn
        run: npm ci

      - name: Write the Vercel project link
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<JSON
          {
            "projectId": "${{ secrets.VERCEL_LEARN_PROJECT_ID }}",
            "orgId": "${{ secrets.VERCEL_ORG_ID }}",
            "settings": {
              "framework": "nextjs",
              "devCommand": null,
              "installCommand": null,
              "buildCommand": null,
              "outputDirectory": null,
              "rootDirectory": "learn",
              "nodeVersion": "24.x"
            }
          }
          JSON

      - name: Build
        run: >
          npx vercel@latest build
          ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
          --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: >
          npx vercel@latest deploy --prebuilt
          ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
          --token=${{ secrets.VERCEL_TOKEN }}
