name: learn

on:
  push:
    branches: [main]
    paths:
      - "learn/**"
      - "training/**"
      # The design system is mirrored from site/; a change there must re-run
      # the drift gate here.
      - "site/app/tokens.css"
      - "site/app/globals.css"
      - "site/components/Logo.tsx"
      - "site/components/ThemeToggle.tsx"
      - "site/components/Providers.tsx"
      - "site/components/ds/**"
      - "site/lib/cn.ts"
      - "site/lib/shiki.ts"
      - "site/lib/toc.ts"
      - "site/lib/playground/protocol.ts"
      - "site/lib/playground/share.ts"
      - "site/components/docs/**"
      - "site/public/favicon.svg"
      - "editors/vscode/syntaxes/**"
      - ".github/workflows/learn.yml"
  pull_request:
    paths:
      - "learn/**"
      - "training/**"
      - "site/app/tokens.css"
      - "site/app/globals.css"
      - "site/components/Logo.tsx"
      - "site/components/ThemeToggle.tsx"
      - "site/components/Providers.tsx"
      - "site/components/ds/**"
      - "site/lib/cn.ts"
      - "site/lib/shiki.ts"
      - "site/lib/toc.ts"
      - "site/lib/playground/protocol.ts"
      - "site/lib/playground/share.ts"
      - "site/components/docs/**"
      - "site/public/favicon.svg"
      - "editors/vscode/syntaxes/**"
      - ".github/workflows/learn.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the Vercel build image so CI can't pass where deploys fail.
          node-version: "24"
          cache: npm
          cache-dependency-path: learn/package-lock.json

      - name: Install
        working-directory: learn
        run: npm ci

      # One step calling one make target; the makefile is the single
      # definition of what the gates are. Same convention as site.yml.
      - name: Learn gates
        run: make verify-learn-nofresh

      - name: Lint
        working-directory: learn
        run: npm run lint

      - name: Build
        working-directory: learn
        run: npm run build

  # Mirrors the site deploy job (see site.yml for the full rationale on the
  # hand-written project link and token scoping). OFF until the learn Vercel
  # project exists and its id is stored — enable with repository variable
  # ENABLE_LEARN_CI_DEPLOY = true and secret VERCEL_LEARN_PROJECT_ID.
  # The token: VERCEL_LEARN_TOKEN, project-scoped to cfdl-learn (falls back to
  # VERCEL_TOKEN for a future team-scoped one; the cfdl-only token cannot see
  # this project and fails with "Project not found").
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: vars.ENABLE_LEARN_CI_DEPLOY == 'true'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_LEARN_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Pinned deliberately; see the note in site/scripts/build-wasm.sh.
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: learn/package-lock.json

      - name: Install
        working-directory: learn
        run: npm ci

      # BEFORE `vercel build`, which copies public/ as it finds it. The same
      # script the site deploy uses, pointed at learn's public dir — one
      # bundle recipe, two consumers.
      - name: Build the wasm bundle
        run: OUT_DIR="$GITHUB_WORKSPACE/learn/public/wasm" ./site/scripts/build-wasm.sh

      - name: Write the Vercel project link
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<JSON
          {
            "projectId": "${{ secrets.VERCEL_LEARN_PROJECT_ID }}",
            "orgId": "${{ secrets.VERCEL_ORG_ID }}",
            "settings": {
              "framework": "nextjs",
              "devCommand": null,
              "installCommand": null,
              "buildCommand": null,
              "outputDirectory": null,
              "rootDirectory": "learn",
              "nodeVersion": "24.x"
            }
          }
          JSON

      - name: Build
        run: >
          npx vercel@latest build
          ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
          --token=${{ secrets.VERCEL_LEARN_TOKEN || secrets.VERCEL_TOKEN }}

      # `--archive=tgz` uploads ONE archive instead of one API request per
      # file. Vercel caps file-upload requests at 40,000 a day, and a ~46 MB
      # static site is thousands of files per deploy — a day of ordinary merges
      # exhausts it and every later deploy fails with
      # `code: "api-upload-paid"`, which is what Vercel's own error tells you
      # to fix this way.
      - name: Deploy
        run: >
          npx vercel@latest deploy --prebuilt --archive=tgz
          ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
          --token=${{ secrets.VERCEL_LEARN_TOKEN || secrets.VERCEL_TOKEN }}
