name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # Before any cargo build: pyo3 (cfdl-py) resolves the interpreter from
      # PATH, and runner-default Python can be newer than pyo3 supports.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Format
        if: runner.os == 'Linux'
        run: make fmt-check

      - name: Lint (clippy)
        if: runner.os == 'Linux'
        run: make lint

      - name: Tests
        run: cargo test --all --all-features

      - name: Golden suite
        shell: bash
        run: |
          chmod +x ./tools/golden-runner
          ./tools/golden-runner run

      # cargo test --all only builds cfdl-wasm for the HOST, so a break specific
      # to wasm32 reached main undetected. The functional smoke test of the
      # shipped bundle lives in site.yml, where Node is already set up.
      - name: WebAssembly target builds
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p cfdl-wasm --release --target wasm32-unknown-unknown

      # Guards the examples a reader meets first: they must compile, run, and
      # actually exercise the features their prose advertises.
      - name: Documentation examples
        run: |
          cargo build -p cfdl-cli
          python3 tools/check-doc-examples.py

      # `make ci` ran five gates that this workflow did not, so every one of
      # them only fired when someone remembered to run it locally. That is how
      # a 23% error in weighted average life survived: the identity that
      # catches it is in analytic-checks, which CI never executed.
      - name: Benchmarks, identities, cadence parity and the published schemas
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema
          cargo build -p cfdl-cli

          # PEP 597: make any text I/O that relies on the platform default
          # encoding a hard error. Windows decodes as cp1252, so a `read_text()`
          # with no encoding crashes there and nowhere else the moment the file
          # it reads grows a curly quote — which is exactly how this step broke
          # on windows-latest alone. Enforced on Linux so a regression surfaces
          # in the fast job rather than three platforms later.
          #
          # Exported here rather than as a step `env:` so it covers our own
          # gates and nothing else. The runner enables UTF-8 Mode, and pip
          # calls locale.getpreferredencoding() during config load, which is
          # itself an EncodingWarning under that mode — a step-level env fails
          # on `pip install` before reaching a single gate.
          if [ "$RUNNER_OS" = "Linux" ]; then
            export PYTHONWARNDEFAULTENCODING=1 PYTHONWARNINGS=error::EncodingWarning
          fi

          python3 tools/benchmark-runner.py
          python3 tools/analytic-checks.py
          python3 tools/cadence-parity.py
          CFDL_REQUIRE_SCHEMA_GATE=1 python3 tools/check-ir-schema.py
          CFDL_REQUIRE_SCHEMA_GATE=1 python3 tools/check-results-schema.py
          python3 tools/check-pack-validations.py

      - name: Install Python test tooling
        run: python -m pip install --upgrade pip

      - name: Install Python package (with dev + viz extras)
        run: python -m pip install -e "python/[dev,viz]"

      # `make verify-python`, not an inlined pytest. The makefile is the single
      # definition of what the gates are; a workflow that restates them is a
      # second list that drifts, which is how a 23% WAL error once survived (see
      # below) and how four gates later fired only after a push.
      #
      # py-check is skipped: it compares the committed native extension against
      # the engine sources, and CI has just built the extension from those
      # sources, so it can only ever pass here. It is a local-drift gate.
      - name: Python SDK tests
        run: python -m pytest -q python/tests

      - name: Execute example notebooks
        if: runner.os == 'Linux'
        run: |
          python -m pip install -e "python/[notebooks]"
          for nb in examples/notebooks/*.ipynb; do
            echo "executing $nb"
            MPLBACKEND=Agg jupyter nbconvert --to notebook --execute --stdout "$nb" > /dev/null
          done
