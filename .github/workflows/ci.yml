name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

env:
  # The makefile lets a missing `jsonschema` skip the three schema gates so a
  # local loop is not blocked by a Python dependency. In CI a skip is a failure:
  # the whole point of the gate is that the published schemas are a contract.
  CFDL_REQUIRE_SCHEMA_GATE: "1"

jobs:
  # Does this change touch anything the three-platform end-to-end can actually
  # test? Prose cannot break a golden fixture on Windows. Every GATE still runs
  # on every change (see the `gates` job) — this only decides whether the heavy
  # matrix is informative or is just latency.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Classify changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # Anything not explicitly excluded counts as code. The default is to
          # run everything; a path earns its way out of the matrix by being
          # unable to affect a build, a test, a golden or a notebook.
          #
          # Excluded prose is NOT unchecked: site-voice, glossary-check,
          # doc-examples, training-examples and rule-fragments all read these
          # files and all run in `gates` below.
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!research/**'
              - '!**/*.md'
              - '!**/*.mdx'
              - '!LICENSE'
              - '!NOTICE'
              - '!.github/**/*.md'

  # EVERY gate, on every change, always. This job has no `if:`.
  #
  # It calls one make target rather than restating tool invocations, because
  # the restated list is what drifted: seven gates ran only on someone's laptop,
  # `check-run-schema` among them, and a 23% weighted-average-life error once
  # reached main because `analytic-checks` lived in the makefile and not here.
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # pyo3 (cfdl-py) resolves the interpreter from PATH, and runner-default
      # Python can be newer than pyo3 supports.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python gate tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema

      - name: All gates
        run: make ci-gates

  # The end-to-end: compile on three platforms, run the tests, the goldens, the
  # wasm target, the Python SDK and the notebooks. Skipped when nothing outside
  # prose changed — that is the only thing this change makes conditional.
  build-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # Before any cargo build: pyo3 (cfdl-py) resolves the interpreter from
      # PATH, and runner-default Python can be newer than pyo3 supports.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Format
        if: runner.os == 'Linux'
        run: make fmt-check

      - name: Lint (clippy)
        if: runner.os == 'Linux'
        run: make lint

      - name: Tests
        run: cargo test --all --all-features

      # Reference-implementation reconciliation. Engine behaviour, so it lives
      # with the matrix rather than in `gates`: prose cannot move a cash flow.
      - name: Benchmark suite
        run: make bench

      - name: Golden suite
        shell: bash
        run: |
          chmod +x ./tools/golden-runner
          ./tools/golden-runner run

      # cargo test --all only builds cfdl-wasm for the HOST, so a break specific
      # to wasm32 reached main undetected. The functional smoke test of the
      # shipped bundle lives in site.yml, where Node is already set up.
      - name: WebAssembly target builds
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p cfdl-wasm --release --target wasm32-unknown-unknown

      # The gates already ran once, on Linux, in `gates`. They run again here on
      # macOS and Windows because several are Python reading repository text,
      # and text I/O is where the platforms differ: Windows decodes as cp1252,
      # so a gate crashes there and nowhere else the moment a file it reads
      # grows a curly quote. PYTHONWARNDEFAULTENCODING (set by the makefile's
      # PYGATE) turns that class of bug into a failure rather than a surprise.
      - name: All gates (non-Linux platforms)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema
          make ci-gates

      - name: Install Python package (with dev + viz extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "python/[dev,viz]"

      # py-check is skipped: it compares the committed native extension against
      # the engine sources, and CI has just built the extension from those
      # sources, so it can only ever pass here. It is a local-drift gate.
      - name: Python SDK tests
        run: python -m pytest -q python/tests

      - name: Execute example notebooks
        if: runner.os == 'Linux'
        run: |
          python -m pip install -e "python/[notebooks]"
          for nb in examples/notebooks/*.ipynb; do
            echo "executing $nb"
            MPLBACKEND=Agg jupyter nbconvert --to notebook --execute --stdout "$nb" > /dev/null
          done
