name: Python Wheels

# Build-only abi3 wheels for the cfdl-sdk Python package.
#
# Wheels are always built as CI artifacts. Publishing to PyPI happens only for
# a pushed v* tag, and only through the `pypi` environment — so a release still
# requires a human to create the tag and, if the environment has a protection
# rule, to approve the run.
#
# Authentication is PyPI Trusted Publishing (OIDC): GitHub proves the workflow's
# identity directly to PyPI. There is no API token stored in this repository,
# so there is none to leak or rotate.
# Regular per-push compile-checking lives in ci.yml (editable install + pytest);
# this workflow runs the full manylinux/universal2 matrix on tags and on demand.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2014"
          working-directory: python
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: python/dist/*.whl

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: universal2-apple-darwin
          working-directory: python
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-universal2
          path: python/dist/*.whl

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: x64
          working-directory: python
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: python/dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: python
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/*.tar.gz

  smoke:
    # Install the built Linux wheel (not editable) and run the SDK test suite —
    # proves the wheel actually ships the abi3 native module.
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist
      - name: Install wheel + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pytest dist/*.whl
      - name: Run SDK tests against the installed wheel
        run: python -m pytest -q python/tests

  publish:
    # Only a tag publishes. Every other trigger stops at build + smoke test.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows, sdist, smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect distributions
        run: |
          mkdir -p dist
          find artifacts -name '*.whl' -exec cp {} dist/ \;
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
