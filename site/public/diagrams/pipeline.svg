<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 240" role="img"
     aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">The CFDL pipeline</title>
  <desc id="pipeline-desc">A CFDL source file is compiled into an IR JSON
  document, which the engine runs to produce a Results JSON document. Compiling
  lexes, parses, resolves, validates and lowers. Running evaluates schedules and
  applies scenarios, Monte Carlo trials and metrics. Every surface — the CLI,
  Python, the playground and the API server — uses the same two steps.</desc>

  <style>
    /* Rendered inside an img element, so the page's theme cannot cascade in.
       These media queries let the diagram follow the reader's system theme on
       its own. */
    .doc      { fill: #ffffff; stroke: #cbd5e1; }
    .doc-text { fill: #0f172a; }
    .step     { fill: #eef2ff; stroke: #6366f1; }
    .step-text{ fill: #4338ca; }
    .note     { fill: #64748b; }
    .arrow    { stroke: #94a3b8; }
    .arrowhead{ fill: #94a3b8; }
    .caption  { fill: #64748b; }

    @media (prefers-color-scheme: dark) {
      .doc      { fill: #0f172a; stroke: #334155; }
      .doc-text { fill: #e2e8f0; }
      .step     { fill: #1e1b4b; stroke: #6366f1; }
      .step-text{ fill: #a5b4fc; }
      .note     { fill: #94a3b8; }
      .arrow    { stroke: #475569; }
      .arrowhead{ fill: #475569; }
      .caption  { fill: #94a3b8; }
    }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrowhead"/>
    </marker>
  </defs>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">

    <!-- model.cfdl -->
    <rect x="8" y="52" width="132" height="52" rx="8" class="doc" stroke-width="1.5"/>
    <text x="74" y="76" text-anchor="middle" font-size="14" font-weight="600" class="doc-text">model.cfdl</text>
    <text x="74" y="94" text-anchor="middle" font-size="11" class="note">what you write</text>

    <!-- compile -->
    <line x1="146" y1="78" x2="196" y2="78" class="arrow" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="202" y="52" width="136" height="52" rx="8" class="step" stroke-width="1.5"/>
    <text x="270" y="83" text-anchor="middle" font-size="14" font-weight="600" class="step-text">compile</text>
    <text x="270" y="126" text-anchor="middle" font-size="11" class="note">lex → parse → resolve</text>
    <text x="270" y="142" text-anchor="middle" font-size="11" class="note">→ validate → lower</text>

    <!-- IR -->
    <line x1="344" y1="78" x2="394" y2="78" class="arrow" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="400" y="52" width="120" height="52" rx="8" class="doc" stroke-width="1.5"/>
    <text x="460" y="76" text-anchor="middle" font-size="14" font-weight="600" class="doc-text">IR JSON</text>
    <text x="460" y="94" text-anchor="middle" font-size="11" class="note">canonical</text>

    <!-- run -->
    <line x1="526" y1="78" x2="562" y2="78" class="arrow" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="568" y="52" width="90" height="52" rx="8" class="step" stroke-width="1.5"/>
    <text x="613" y="83" text-anchor="middle" font-size="14" font-weight="600" class="step-text">run</text>
    <text x="613" y="126" text-anchor="middle" font-size="11" class="note">schedules, scenarios,</text>
    <text x="613" y="142" text-anchor="middle" font-size="11" class="note">Monte Carlo, metrics</text>

    <!-- Results -->
    <line x1="664" y1="78" x2="694" y2="78" class="arrow" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="700" y="52" width="120" height="52" rx="8" class="doc" stroke-width="1.5"/>
    <text x="760" y="76" text-anchor="middle" font-size="14" font-weight="600" class="doc-text">Results JSON</text>
    <text x="760" y="94" text-anchor="middle" font-size="11" class="note">cash flows, metrics</text>

    <!-- determinism caption -->
    <text x="415" y="196" text-anchor="middle" font-size="12" class="caption">
      Same sources + same pack version + same compiler version
    </text>
    <text x="415" y="214" text-anchor="middle" font-size="12" class="caption">
      produce byte-identical output, on every surface.
    </text>
  </g>
</svg>
