name = "cre"
version = "0.1.0"
description = "Commercial Real Estate pack v0.1 (deterministic lowering)."

# RECOMMENDED vocabulary for a stream's `category`, not a closed one.
# Aggregation reads this rather than pattern-matching a stream's name.
# Shaped like an operating pro forma; see README.md for what each one means
# and why they are separate.
#
# The three roots -- operating, investing, financing -- are the language's gate
# and the only one. A well-rooted category this list omits is valid, and raises
# W5023 naming the near match. A pack cannot enumerate every leaf a deal needs:
# the leaf is not knowable by a pack that shipped before the deal. What this
# list still buys is the domain's conventional spelling. See docs/35.
categories = [
  "operating.revenue.base_rent",
  "operating.revenue.other",
  "operating.revenue.percentage_rent",
  "operating.revenue.recovery",
  "operating.deduction.vacancy",
  "operating.deduction.abatement",
  "operating.expense.opex",
  "investing.capital.leasing",
  "investing.capital.construction",
  "investing.capital.capex",
  "investing.reversion",
  "investing.selling_costs",
  "financing.debt_service",
  "financing.interest",
  "financing.debt_principal",
  "financing.mortgage_insurance",
  "financing.debt_proceeds",
  "financing.equity",
]


[entrypoints]
# What the model may be ABOUT — assets, parties, contracts, lifecycles,
# references and the relations between them. Read before lowering, because a
# contract type names the rule that turns it into cash.
ontology = "ontology/types.toml"
aliases = "aliases.toml"
templates = "templates.toml"
lowering = "lowering/rules.toml"
validations = "validations.toml"
metrics = "metrics.toml"
statements = "statements.toml"
