# A single blended figure — the coarse end of the range. One unsuffixed instance
# emits `cre.opex.line`, which no itemised row claims, so it lands in the
# residual line of the operating statement.
[[templates]]
id = "cre.opex_line.blended"
label = "Operating expense — single blended line"
kind = "contract"
body = """
contract cre.opex_line {
  term ${term_start}..${term_end}
  terms {
    amount_year = ${amount_year}
    escalation = ${escalation}
    pct_fixed = ${pct_fixed}
  }
}
"""
[templates.defaults]
term_start = "2026-01"
term_end = "2036-12"
amount_year = "0"
escalation = "0.03"
pct_fixed = "1.0"
