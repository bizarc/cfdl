# CRE contract templates — the conventional starting set, offered by the editor
# as snippets (the LSP reads these for completion and `applyTemplate`).
#
# The OPERATING EXPENSE lines are the point of this file. `cre.opex_line` is one
# contract instanced per expense, so the vocabulary lives in the INSTANCE NAME —
# `cre.opex_line.property_tax` — and not in a term restating it. These nine are
# the lines a commercial operating statement usually carries; a modeller is free
# to name their own, and `statements.toml` gives the conventional names their
# own rows while anything else falls to the residual line.
#
# `pct_fixed` is the share that does NOT move with occupancy. Property tax and
# insurance run whether the building is full or empty; cleaning and utilities
# track occupied space. The defaults here are conventional underwriting values,
# not measurements — a real deal states its own.
#
# `${key}` placeholders resolve from the request, then from [templates.defaults].

[[templates]]
id = "cre.opex_line.property_tax"
label = "Operating expense — property tax"
kind = "contract"
body = """
contract cre.opex_line.property_tax {
  term ${term_start}..${term_end}
  terms {
    amount_year = ${amount_year}
    escalation = ${escalation}
    pct_fixed = 1.0
  }
}
"""
[templates.defaults]
term_start = "2026-01"
term_end = "2036-12"
amount_year = "0"
escalation = "0.02"

