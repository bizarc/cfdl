# A management fee is usually a percentage of effective gross income, which is a
# read of other streams and would make this line phase-2 — and `cre.exit_forward`
# already reads `cre.opex.line.*` in its own phase-2 forward-NOI sum, so the two
# cannot both be phase-2. Until that ordering is resolved this template states a
# fixed fee, which is what a model must do today.
[[templates]]
id = "cre.opex_line.management"
label = "Operating expense — management fee (fixed)"
kind = "contract"
body = """
contract cre.opex_line.management {
  term ${term_start}..${term_end}
  terms {
    amount_year = ${amount_year}
    escalation = ${escalation}
    pct_fixed = 1.0
  }
}
"""
[templates.defaults]
term_start = "2026-01"
term_end = "2036-12"
amount_year = "0"
escalation = "0.03"

