  }
}
"""
[templates.defaults]
term_start = "2026-01"
term_end = "2035-12"
rate = "0.05"
potential_gross_year = "0"

# Vacancy measured against the ACTUAL rent roll rather than a constant. The
# roll grows with escalation and changes as suites come and go, and the loss
# follows it instead of staying flat while the rent it is a percentage OF
# rises. `rate` is an expression too, so a step at a cliff date is stated
# where it happens: `if(time.date >= date(2030, 1, 1), 0.46, 0.05)`.
[[templates]]
id = "cre.vacancy_loss.tracking"
label = "Vacancy and credit loss (tracks the rent roll)"
kind = "contract"
body = """
contract cre.vacancy_loss {
  term ${term_start}..${term_end}
  terms {
    rate = ${rate}
    potential_gross_year = series_sum("cre.unit.base_rent.*", time.t, time.t)
                           * time.ppy
  }
}
"""
[templates.defaults]
term_start = "2026-01"
term_end = "2035-12"
rate = "0.05"

[[templates]]
id = "cre.construction_loan"
