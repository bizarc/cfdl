# A management fee is usually a percentage of effective gross income. Both
# spellings ship: this one states a FIXED fee, which some agreements do, and
# `cre.opex_line.management_egi` below states the percentage. Neither is a
# workaround for the other.
[[templates]]
id = "cre.opex_line.management"
label = "Operating expense — management fee (fixed)"
kind = "contract"
body = """
contract cre.opex_line.management {
  term ${term_start}..${term_end}
  terms {
    amount_year = ${amount_year}
    escalation = ${escalation}
    pct_fixed = 1.0
  }
}
"""
[templates.defaults]
term_start = "2026-01"
term_end = "2036-12"
amount_year = "0"
escalation = "0.03"

# A management fee stated as a PERCENTAGE OF EFFECTIVE GROSS INCOME, which is
# what most agreements say. EGI is rent plus recoveries less vacancy — all
# revenue, so the fee reads no operating expense and cannot read itself. It
# falls when vacancy rises, which is the point of stating it as a percentage
# rather than restating a number that goes stale.
#
# Streams evaluate in dependency order, so the fee simply evaluates after the
# lines it reads and before `cre.exit_forward`, which reads every opex line
# including this one. Read REVENUE families here: a selector that reaches an
# opex line the fee is part of would be a circular read, which the engine
# refuses by name.
[[templates]]
id = "cre.opex_line.management_egi"
label = "Operating expense — management fee (percentage of EGI)"
kind = "contract"
body = """
contract cre.opex_line.management {
  term ${term_start}..${term_end}
  terms {
    amount_year = (series_sum("cre.unit.base_rent.*", time.t, time.t)
                   + series_sum("cre.unit.recoveries.*", time.t, time.t)
                   + series_sum("cre.vacancy.loss", time.t, time.t))
                  * time.ppy * ${fee_pct}
    escalation = 0
    pct_fixed = 1.0
  }
}
"""
[templates.defaults]
term_start = "2026-01"
term_end = "2036-12"
fee_pct = "0.04"

[[templates]]
id = "cre.opex_line.general_admin"
