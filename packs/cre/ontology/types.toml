# CRE pack ontology — the vocabulary of things a model may declare.
#
# See packs/energy/ontology/types.toml for what the four families mean. The
# short version: `asset` produces or consumes cash, `party` contracts and owns,
# `contract` is an agreement between parties attached to an asset, `reference`
# is a market observable.
#
# HIERARCHY IS OPTIONAL, AND CRE IS THE CLEAREST CASE FOR WHY. The same
# building can be modeled as one asset with a blended rent roll, as a set of
# unit types, as individual suites, or by use (retail podium, office tower).
# All four are correct; which is right depends on what the model is for. So
# `part_of` exists and nothing requires it.

[pack]
ontology_id = "cre"
version = "0.1.0"

# ---------------------------------------------------------------------------
# Assets
# ---------------------------------------------------------------------------

[[entities]]
type_id = "CRE.Asset.RealProperty"
family = "asset"
class = "real"
refines = "Asset.Real"
lifecycle = "cre.property"
description = "An income-producing property."

[[entities.fields]]
name = "asset_class"
field_type = "string"
required = false
description = "office | retail | industrial | multifamily | hospitality | mixed_use"

[[entities.fields]]
name = "rentable_area"
field_type = "decimal"
required = false
unit = "sf"

[[entities.fields]]
name = "year_built"
field_type = "integer"
required = false

# A suite is a property modeled at a finer grain. It is the same class of
# thing as the building, which is why it is not a separate family.
[[entities]]
type_id = "CRE.Asset.Unit"
family = "asset"
class = "real"
refines = "CRE.Asset.RealProperty"
lifecycle = "cre.unit"
description = "A leasable unit or suite. Use when the model needs lease-by-lease detail; a property modeled at the building level needs none."

[[entities.fields]]
name = "rentable_area"
field_type = "decimal"
required = true
unit = "sf"

[[entities.fields]]
name = "use"
field_type = "string"
required = false

[[entities]]
type_id = "CRE.Container.Portfolio"
family = "container"
refines = "Container.Portfolio"
description = "A grouping of properties modeled as one. Cash attached directly to it is deal-level cash — a land purchase, a development budget — aggregated with its members' by the relation."

[[entities]]
type_id = "CRE.Asset.EquityInterest"
family = "asset"
class = "financial"
refines = "Asset.Financial"
description = "A partnership or joint-venture interest in a property's cash."

[[entities.fields]]
name = "interest_type"
field_type = "string"
required = false
description = "sponsor | limited_partner | preferred"

# ---------------------------------------------------------------------------
# Parties
# ---------------------------------------------------------------------------

[[entities]]
type_id = "CRE.Party.Sponsor"
family = "party"
refines = "Party"
description = "Acquires, develops and operates the property."

[[entities.fields]]
name = "name"
field_type = "string"
required = false

[[entities]]
type_id = "CRE.Party.Investor"
family = "party"
refines = "Party"
description = "Provides equity without operating the asset."

[[entities.fields]]
name = "name"
field_type = "string"
required = false

[[entities]]
type_id = "CRE.Party.Lender"
family = "party"
refines = "Party"

[[entities.fields]]
name = "name"
field_type = "string"
required = false

[[entities]]
type_id = "CRE.Party.Tenant"
family = "party"
refines = "Party"
description = "Occupies space under a lease."

[[entities.fields]]
name = "name"
field_type = "string"
required = false

[[entities.fields]]
name = "credit_rating"
field_type = "string"
required = false

[[entities]]
type_id = "CRE.Party.PropertyManager"
family = "party"
refines = "Party"

[[entities.fields]]
name = "name"
field_type = "string"
required = false

# ---------------------------------------------------------------------------
# Lifecycles
# ---------------------------------------------------------------------------

[[lifecycles]]
lifecycle_id = "cre.property"
initial = "stabilized"
states = ["predevelopment", "construction", "lease_up", "stabilized", "repositioning", "disposed"]
description = """A property's condition over a hold (`docs/36` §4.2). MARKET \
CONVENTION, not a standard — no body defines a property lifecycle, and this \
follows institutional investment practice. `stabilized` rather than `operating` \
because a property in lease-up is also operating; stabilisation is what \
distinguishes them. The RETURNING CYCLE is what earns this a machine rather \
than phases: stabilized -> repositioning -> lease_up -> stabilized, walked as \
many times as the hold walks it. `initial` is the common case, an already-\
running asset; a development declares `initial_state predevelopment` on the \
entity."""

[[lifecycles.transitions]]
from = "predevelopment"
to = "construction"

[[lifecycles.transitions]]
from = "construction"
to = "lease_up"

[[lifecycles.transitions]]
from = "lease_up"
to = "stabilized"

[[lifecycles.transitions]]
from = "stabilized"
to = "repositioning"

[[lifecycles.transitions]]
from = "repositioning"
to = "lease_up"
description = "The cycle closes: re-tenanting after a reposition is a lease-up."

[[lifecycles.transitions]]
from = "stabilized"
to = "disposed"

[[lifecycles.transitions]]
from = "repositioning"
to = "disposed"
description = "Selling out of a reposition is ordinary."

[[lifecycles.transitions]]
from = "lease_up"
to = "disposed"

[[lifecycles]]
lifecycle_id = "cre.unit"
initial = "vacant"
states = ["vacant", "leased", "holdover", "month_to_month"]
description = """A unit's leasing condition (`docs/36` §4.1). MARKET CONVENTION, \
following the vocabulary practitioners already use, filtered to conditions — \
the expiration HANDLING choices (market, reabsorb, renew, vacate, option) \
select a transition rather than name a state. `month_to_month` is a \
contractual continuation at agreed terms; `holdover` is occupancy WITHOUT a \
contract, usually at a penalty rent, and they pay differently. There is no \
separate `downtime`: it was the same condition as `vacant` — no tenant, no \
rent — differing only in the PATH taken to reach it, and an edge's actions now \
carry that."""

[[lifecycles.transitions]]
from = "vacant"
to = "leased"

[[lifecycles.transitions]]
from = "leased"
to = "holdover"

[[lifecycles.transitions]]
from = "leased"
to = "month_to_month"

[[lifecycles.transitions]]
from = "leased"
to = "vacant"
description = "Expiry with no renewal: the re-let window opens here."

[[lifecycles.transitions]]
from = "holdover"
to = "leased"

[[lifecycles.transitions]]
from = "holdover"
to = "vacant"

[[lifecycles.transitions]]
from = "month_to_month"
to = "leased"

[[lifecycles.transitions]]
from = "month_to_month"
to = "vacant"

# ---------------------------------------------------------------------------
# Contracts
# ---------------------------------------------------------------------------

[[contracts]]
type_id = "CRE.Contract.Lease"
refines = "Contract.Lease"
contract_name = "cre.lease"
subject_family = "asset"


[[contracts.fields]]
name = "lease_up_months"
field_type = "integer"
unit = "months"
description = "Months to reach full occupancy; rent ramps linearly over them. 1 is fully occupied from the first month."

[[contracts.roles]]
name = "landlord"
refines = "lessor"

[[contracts.roles]]
name = "tenant"
refines = "lessee"

[[contracts]]
type_id = "CRE.Contract.UnitLease"
refines = "CRE.Contract.Lease"
contract_name = "cre.lease_unit"
subject_family = "asset"
parties = ["landlord", "tenant"]
description = "A lease modeled at unit grain, with recoveries and expense stops."


[[contracts.fields]]
name = "rent_year"
field_type = "decimal"
required = true
unit = "USD/yr"
one_of = "rent"
description = "Base rent per year, spread by the calendar."

[[contracts.fields]]
name = "opex_year"
field_type = "decimal"
description = "Recoverable operating expenses per year — the base the expense stop is measured against."

[[contracts.fields]]
name = "opex_escalation"
field_type = "decimal"
unit = "ratio"
description = "Annual growth of the recoverable opex base."

[[contracts.fields]]
name = "gross_up_factor"
field_type = "decimal"
description = "Factor recoverable opex is grossed up by before the stop is applied, so a part-vacant building recovers as if full."

[[contracts.fields]]
name = "expense_stop_year"
field_type = "decimal"
description = "Expense stop per year: the tenant reimburses recoverable opex above it, times its pro rata share."

[[contracts.fields]]
name = "pro_rata_share"
field_type = "decimal"
unit = "ratio"
description = "The tenant's share of recoverable opex above the stop, 0 to 1; 0 turns recoveries off."

[[contracts.fields]]
name = "ti_total"
field_type = "decimal"
description = "Tenant improvement allowance, paid at term start."

[[contracts.fields]]
name = "lc_total"
field_type = "decimal"
description = "Leasing commissions, paid at term start."

[[contracts.lines]]
name = "abatement"

[[contracts.lines]]
name = "recovery"

[[contracts.lines]]
name = "leasing_cost"

[[contracts]]
type_id = "CRE.Contract.Rollover"
refines = "CRE.Contract.Lease"
contract_name = "cre.rollover"
subject_family = "asset"
parties = ["landlord"]
description = "The probability-weighted outcome at expiry. Names only the landlord: the renewing or replacing tenant is not known when the model is written."


[[contracts.fields]]
name = "renewal_probability"
field_type = "decimal"
required = true
unit = "ratio"
description = "Probability the tenant renews at expiry; rents and leasing costs are weighted by it."

[[contracts.fields]]
name = "renewal_rent_year"
field_type = "decimal"
required = true
unit = "USD/yr"
one_of = "rent"
description = "Rent per year if the tenant renews — the clause's rent on the renewal branch."

[[contracts.fields]]
name = "market_rent_year"
field_type = "decimal"
required = true
unit = "USD/yr"
one_of = "rent"
description = "Rent per year to a replacement tenant after downtime — the clause's rent on the re-let branch."

[[contracts.fields]]
name = "downtime_months"
field_type = "integer"
unit = "months"
description = "Vacant months before a replacement tenant starts paying."

[[contracts.fields]]
name = "market_escalation"
field_type = "decimal"
unit = "ratio"
description = "Annual growth of market rent."

[[contracts.fields]]
name = "renewal_ti_lc"
field_type = "decimal"
description = "Tenant improvements and leasing commissions on renewal."

[[contracts.fields]]
name = "new_ti_lc"
field_type = "decimal"
description = "Tenant improvements and leasing commissions on a new lease."

[[contracts.roles]]
name = "tenant"
unbound = true

[[contracts.lines]]
name = "leasing_cost"

[[contracts]]
type_id = "CRE.Contract.PercentageRent"
refines = "CRE.Contract.Lease"
contract_name = "cre.percentage_rent"
subject_family = "asset"
parties = ["landlord", "tenant"]


[[contracts.fields]]
name = "sales_year"
field_type = "decimal"
required = true
unit = "USD/yr"
description = "The tenant's sales per year in the first year of the clause."

[[contracts.fields]]
name = "sales_growth"
field_type = "decimal"
unit = "ratio"
description = "Annual growth of sales."

[[contracts.fields]]
name = "breakpoint_year"
field_type = "decimal"
required = true
unit = "USD/yr"
description = "Sales per year above which overage rent is due."

[[contracts.fields]]
name = "overage_pct"
field_type = "decimal"
required = true
unit = "ratio"
one_of = "rent"
description = "Share of sales above the breakpoint paid as rent — the clause's rent, stated as a rate on sales."

[[contracts]]
type_id = "CRE.Contract.PercentageRentExpected"
refines = "CRE.Contract.Lease"
contract_name = "cre.percentage_rent_expected"
subject_family = "asset"
parties = ["landlord", "tenant"]


[[contracts.fields]]
name = "sales_quantile"
field_type = "string"
required = true
description = "The declared quantile the sales expectation is read from."

[[contracts.fields]]
name = "sales_growth"
field_type = "decimal"
unit = "ratio"
description = "Annual growth of sales."

[[contracts.fields]]
name = "breakpoint_year"
field_type = "decimal"
required = true
unit = "USD/yr"
description = "Sales per year above which overage rent is due."

[[contracts.fields]]
name = "overage_pct"
field_type = "decimal"
required = true
unit = "ratio"
one_of = "rent"
description = "Share of expected sales above the breakpoint paid as rent — the clause's rent, stated as a rate on sales."

[[contracts]]
type_id = "CRE.Contract.VacancyAllowance"
refines = "Contract.Deduction"
contract_name = "cre.vacancy_loss"
subject_family = "asset"


[[contracts.fields]]
name = "rate"
field_type = "decimal"
required = true
unit = "ratio"
description = "Vacancy and credit loss as a fraction of potential gross revenue."

[[contracts.fields]]
name = "potential_gross_year"
field_type = "decimal"
required = true
unit = "USD/yr"
description = "Potential gross revenue per year the rate is applied to."

[[contracts.roles]]
name = "landlord"
refines = "owner"

[[contracts]]
type_id = "CRE.Contract.OperatingExpense"
refines = "Contract.Expense"
contract_name = "cre.opex_line"
subject_family = "asset"
parties = ["owner"]
description = "One operating expense line. Instance it per expense for an itemised schedule, or declare one unsuffixed for a single blended figure; the entity it hangs on sets the level."


[[contracts.fields]]
name = "pct_fixed"
field_type = "decimal"
unit = "ratio"
description = "Share of the expense that is fixed; the rest scales with occupancy."

[[contracts.fields]]
name = "occupancy"
field_type = "decimal"
unit = "ratio"
description = "Occupancy the variable share scales with; may be an expression."

[[contracts]]
type_id = "CRE.Contract.OperatingRevenue"
refines = "Contract.Revenue"
contract_name = "cre.revenue_line"
subject_family = "asset"
parties = ["owner"]

[[contracts]]
type_id = "CRE.Contract.PermanentDebt"
refines = "Contract.Debt"
contract_name = "cre.permanent_debt"
subject_family = "asset"
side = "pays"
parties = ["borrower", "lender"]


[[contracts.fields]]
name = "principal"
field_type = "decimal"
required = true
one_of = "amount"
description = "The loan amount."

[[contracts.fields]]
name = "interest_rate"
field_type = "decimal"
required = true
unit = "ratio"
one_of = "interest"
description = "Nominal annual rate."

[[contracts.fields]]
name = "amortization_months"
field_type = "integer"
required = true
unit = "months"
description = "Amortization term the level payment is struck on."

[[contracts.lines]]
name = "proceeds"

[[contracts.lines]]
name = "principal"

[[contracts]]
type_id = "CRE.Contract.ConstructionFunding"
refines = "Contract.CapitalExpenditure"
contract_name = "cre.construction_stub"
subject_family = "asset"
parties = ["owner"]


[[contracts.fields]]
name = "amount"
field_type = "decimal"
required = true
one_of = "amount"
description = "Construction spend per period."

[[contracts]]
type_id = "CRE.Contract.ConstructionLoan"
refines = "Contract.Debt"
contract_name = "cre.construction_loan"
subject_family = "asset"
side = "pays"
parties = ["lender"]
description = "A construction facility funded behind an equity commitment: equity draws first, the loan takes the balance once the commitment is exhausted, and interest accrues on the drawn balance through the build."


[[contracts.fields]]
name = "draw_curve"
field_type = "string"
required = true
one_of = "amount"
description = "The declared curve of required funding, stated as an annualized rate; the facility funds it above the equity commitment."

[[contracts.fields]]
name = "interest_rate"
field_type = "decimal"
required = true
unit = "ratio"
one_of = "interest"
description = "Nominal annual rate on the drawn balance."

[[contracts.fields]]
name = "equity_commitment"
field_type = "decimal"
required = true
description = "Equity funds the draws up to this amount; the facility funds the rest."

[[contracts.fields]]
name = "capitalize_interest"
field_type = "integer"
description = "1 — accrued interest is added to the balance; 0 — it is paid each period."

[[contracts.fields]]
name = "draw_accrual_fraction"
field_type = "decimal"
unit = "ratio"
description = "Where in the period a draw lands for accrual: 0.5 drawn ratably, 0 at the end, 1 at the start."

[[contracts.roles]]
name = "owner"
refines = "borrower"

[[contracts.lines]]
name = "equity_draw"

[[contracts.lines]]
name = "proceeds"

# Interest the loan funds rather than the borrower pays: an `accrual` row that
# raises the balance with no cash moving (docs/42 §4.2), when
# `capitalize_interest = 1`.
[[contracts.lines]]
name = "capitalized_interest"
optional = true

[[contracts]]
type_id = "CRE.Contract.Disposition"
refines = "Contract.Sale"
contract_name = "cre.exit"
subject_family = "asset"
parties = ["seller"]


[[contracts.fields]]
name = "income"
field_type = "decimal"
required = true
unit = "USD/yr"
description = "The NOI the cap rate is applied to."

[[contracts.fields]]
name = "cap_rate"
field_type = "decimal"
required = true
unit = "ratio"
one_of = "basis"
description = "Capitalization rate applied to the income."

[[contracts.roles]]
name = "buyer"
unbound = true

[[contracts.lines]]
name = "selling_costs"

[[contracts]]
type_id = "CRE.Contract.DispositionAtCap"
refines = "Contract.Sale"
contract_name = "cre.exit_cap"
subject_family = "asset"
parties = ["seller"]


[[contracts.fields]]
name = "income"
field_type = "decimal"
required = true
unit = "USD/yr"
description = "The NOI the cap rate is applied to."

[[contracts.fields]]
name = "cap_rate"
field_type = "decimal"
required = true
unit = "ratio"
one_of = "basis"
description = "Capitalization rate applied to the income."

[[contracts.roles]]
name = "buyer"
unbound = true

[[contracts]]
type_id = "CRE.Contract.DispositionAtForwardCap"
refines = "Contract.Sale"
contract_name = "cre.exit_forward"
subject_family = "asset"
parties = ["seller"]


[[contracts.fields]]
name = "cap_rate"
field_type = "decimal"
required = true
unit = "ratio"
one_of = "basis"
description = "Capitalization rate applied to the forward twelve months of NOI after the sale date."

[[contracts.roles]]
name = "buyer"
unbound = true

[[contracts.lines]]
name = "selling_costs"

# --- Options: contracts with an election ---------------------------------
[[contracts]]
type_id = "CRE.Contract.RenewalOption"
refines = "Contract.Option"
subject_family = "asset"
description = "A tenant's right to extend at stated terms."

[[contracts.roles]]
name = "landlord"
refines = "grantor"

[[contracts.roles]]
name = "tenant"
refines = "holder"

[[contracts]]
type_id = "CRE.Contract.PurchaseOption"
refines = "Contract.Option"
subject_family = "asset"
parties = ["grantor", "holder"]
description = "A right to buy the asset at a stated price."

# ---------------------------------------------------------------------------
# References
# ---------------------------------------------------------------------------

[[references]]
reference_id = "cre.market_rent"
kind = "price_curve"
unit = "USD/sf/yr"

[[references]]
reference_id = "cre.base_rate"
kind = "rate_curve"
unit = "ratio"

[[references]]
reference_id = "cre.cap_rate"
kind = "rate_curve"
unit = "ratio"

[[references]]
reference_id = "cre.inflation"
kind = "index"
unit = "ratio"

# ---------------------------------------------------------------------------
# Relations
# ---------------------------------------------------------------------------

[[relations]]
relation_id = "owns"
from_family = "party"
to_family = "asset"
cardinality = "many_to_many"
inverse = "owned_by"

[[relations]]
relation_id = "manages"
from_family = "party"
to_family = "asset"
cardinality = "many_to_many"
inverse = "managed_by"

[[relations]]
relation_id = "occupies"
from_family = "party"
to_family = "asset"
cardinality = "many_to_many"
inverse = "occupied_by"

[[relations]]
relation_id = "part_of"
from_family = "asset"
to_family = "asset"
cardinality = "many_to_one"
inverse = "contains"
description = "Optional hierarchy — a unit within a building, a building within a portfolio. Never required."
