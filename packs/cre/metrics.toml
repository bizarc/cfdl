# CRE domain metrics.
#
# These are REDUCTIONS of the per-period subtotals in statements.toml, not
# separate definitions. That distinction is the point of this file's current
# shape: `domain.cre.noi` used to be nine hand-listed stream selectors here AND
# a category fold there — two independent statements of one quantity, which is
# a drift waiting to happen, and which needed an analytic identity to police.
#
# Now the fold is the definition and these are its lifetime totals. Adding a
# contract to the pack changes both together, because there is only one place
# that says what NOI is.
#
# `domain.cre.dscr` stays a ratio of two metrics rather than a reduction of the
# per-period DSCR series: summing a series of ratios means nothing. The lifetime
# coverage ratio is lifetime NOI over lifetime debt service, which is what this
# computes — and is a different question from the per-period series, which is
# the one a lender actually asks.

[[metrics]]
id = "domain.cre.noi"
kind = "money"
op = "subtotal_total"
subtotal = "domain.cre.noi"
formula = "sum over periods of domain.cre.noi"

[[metrics]]
id = "domain.cre.debt_service"
kind = "money"
op = "subtotal_total"
subtotal = "domain.cre.debt_service"
formula = "sum over periods of domain.cre.debt_service"
require_positive = true

[[metrics]]
id = "domain.cre.dscr"
kind = "number"
op = "ratio"
numerator_metric = "domain.cre.noi"
denominator_metric = "domain.cre.debt_service"
formula = "domain.cre.noi / domain.cre.debt_service"

[[metrics]]
id = "domain.cre.leasing_costs"
kind = "money"
op = "subtotal_total"
subtotal = "domain.cre.leasing_costs"
formula = "sum over periods of domain.cre.leasing_costs"
require_positive = true
