# CRE domain metrics, evaluated in order (ratios may reference earlier ids).

[[metrics]]
id = "domain.cre.noi"
kind = "money"
op = "sum"
numerator_streams = [
  "cre.lease.base_rent",
  "cre.ops.revenue",
  "cre.unit.base_rent.*",
  "cre.unit.recoveries.*",
  "cre.rollover.rent.*",
  "cre.pct_rent.*",
]
denominator_streams = [
  "cre.ops.expense",
  "cre.vacancy.loss",
  "cre.property.opex.*",
  # Free rent is a deduction from potential gross revenue, not an expense.
  # Base rent is published GROSS, so NOI is unchanged by the split only if
  # the offset is carried here.
  "cre.unit.abatement.*",
]
formula = "sum(numerator_streams) + sum(denominator_streams)"

[[metrics]]
id = "domain.cre.debt_service"
kind = "money"
op = "negated_sum"
numerator_streams = [
  "loan.construction_interest",
  "loan.permanent_debt_service",
  # Mortgage insurance is not a payment on the debt, but coverage is measured
  # against the whole published line — HUD's pro forma states its debt service
  # as P+I+MIP and computes DSCR from it. Backlog 7.14.
  "loan.mortgage_insurance",
]
formula = "-sum(numerator_streams)"
require_positive = true

[[metrics]]
id = "domain.cre.dscr"
kind = "number"
op = "ratio"
numerator_metric = "domain.cre.noi"
denominator_metric = "domain.cre.debt_service"
formula = "domain.cre.noi / domain.cre.debt_service"

[[metrics]]
id = "domain.cre.leasing_costs"
kind = "money"
op = "negated_sum"
numerator_streams = ["cre.unit.ti_lc.*", "cre.rollover.ti_lc.*"]
formula = "-sum(numerator_streams)"
require_positive = true
