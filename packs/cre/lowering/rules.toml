[[rules]]
id = "cre_construction_stub_draws_v1"
contract_name = "cre.construction_stub"
stream_name = "cre.construction.draws"
owner_entity = "${subject}"
direction = "outflow"
currency = "USD"
amount_expr = "45000"
schedule_kind = "every"
schedule_from = "2026-01"
schedule_to = "2026-06"

[[rules]]
id = "cre_lease_base_rent_v1"
contract_name = "cre.lease"
stream_name = "cre.lease.base_rent"
owner_entity = "${subject}"
direction = "inflow"
currency = "USD"
# Lease-up occupancy ramp (default implementation):
# occupancy(t) = clamp((t - 6 + 1) / 18, 0, 1)
# rent(t) = base_rent * occupancy(t)
amount_expr = "25000 * clamp((time.t - 6 + 1) / 18, 0, 1)"
schedule_kind = "every"
schedule_from = "2026-07"
schedule_to = "2031-12"

