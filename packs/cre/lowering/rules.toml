[[rules]]
id = "cre_construction_stub_draws"
contract_name = "cre.construction_stub"
stream_name = "cre.construction.draws"
owner_entity = "${subject}"
direction = "outflow"
category = "investing.capital.construction"
amount_expr = "{{contract.amount}}"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

# `amount` is required: a construction draw is a material number and must be
# stated by the model, never supplied by the pack.

[[rules]]
id = "cre_lease_base_rent"
contract_name = "cre.lease"
stream_name = "cre.lease.base_rent"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.revenue.base_rent"
# Rent accrues over the contract's own term, measured from its start:
#   occupancy(m) = clamp((m + 1) / lease_up_months, 0, 1)
#   rent(m)      = base_rent * occupancy(m)
# where m is months since term_start. `lease_up_months = 1` (the default)
# means fully occupied from the first month — a neutral default that invents
# no lease-up assumption.
amount_expr = "({{contract.base_rent}} + {{contract.base_rent_year}} / {{model.periods_per_year}}) * clamp(({{time.elapsed_periods}} + 1) / {{periods.lease_up_months}}, 0, 1)"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

# `base_rent` is required.
[rules.defaults]
base_rent = "0"
base_rent_year = "0"
lease_up_months = "1"

[[rules]]
id = "cre_ops_revenue"
contract_name = "cre.ops_revenue"
stream_name = "cre.ops.revenue"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.revenue.other"
amount_expr = "{{contract.amount}}"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

# `amount` is required; the term supplies the schedule.

[[rules]]
id = "cre_ops_expense"
contract_name = "cre.ops_expense"
stream_name = "cre.ops.expense"
owner_entity = "${subject}"
direction = "outflow"
category = "operating.expense.opex"
amount_expr = "{{contract.amount}}"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

# `amount` is required; the term supplies the schedule.

[[rules]]
id = "cre_exit_cap_sale"
contract_name = "cre.exit_cap"
stream_name = "cre.exit.sale"
owner_entity = "${subject}"
direction = "inflow"
category = "investing.reversion"
amount_expr = "{{contract.noi_value}} / {{contract.exit_cap}}"
# A disposal is taken at the END of the holding period, so it discounts
# the full n periods. `on_date` alone would settle it at the period's
# open — one month early on a monthly model, a whole year on an annual.
schedule_kind = "on_date"
schedule_at_period_end = true
schedule_from = "{{contract.term_start}}"
schedule_to = ""

# `noi_value` and `exit_cap` are required: an exit valuation is the single
# largest number in most CRE models and must be stated, not assumed. The
# contract's term supplies the sale date.

# ---------------------------------------------------------------------------
# Lease-by-lease contract types at institutional DCF parity (template-driven).
# Lease-anniversary anchoring: lease_t = months_between(term_start, time.date).
# ---------------------------------------------------------------------------

[[rules]]
id = "cre_lease_unit_base_rent"
contract_name = "cre.lease_unit"
stream_name = "cre.unit.base_rent.{{contract.suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.revenue.base_rent"
# Free rent burns off first; escalation steps on lease anniversaries.
amount_expr = "({{contract.rent_year}} / {{model.periods_per_year}}) * pow(1 + {{contract.escalation}}, {{time.elapsed_years}})"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
free_rent_months = "0"
escalation = "0"

# Free rent as its own deduction from potential gross revenue, which is how an
# institutional pro forma reports it (MIT OCW 11.431J does). It used to be
# netted into base rent by a clamp, so a model could show the line OR have it
# counted in NOI, never both — backlog 1.3.
#
# Base rent above is now GROSS and this is the offset, so the two still sum to
# the rent actually collected. `domain.cre.noi` carries this family in its
# denominator, which is what keeps NOI unchanged by the split.
[[rules]]
id = "cre_lease_unit_abatement"
contract_name = "cre.lease_unit"
stream_name = "cre.unit.abatement.{{contract.suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "operating.deduction.abatement"
amount_expr = "({{contract.rent_year}} / {{model.periods_per_year}}) * (1 - clamp({{time.elapsed_periods}} + 1 - {{periods.free_rent_months}}, 0, 1)) * pow(1 + {{contract.escalation}}, {{time.elapsed_years}})"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
free_rent_months = "0"
escalation = "0"

[[rules]]
id = "cre_lease_unit_recoveries"
contract_name = "cre.lease_unit"
stream_name = "cre.unit.recoveries.{{contract.suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.revenue.recovery"
# Expense reimbursement above the stop, at the tenant's pro-rata share.
# Opex escalates on the lease's own anniversary of the PROPERTY schedule:
# anchored to the recovery base year via opex_year/opex_escalation terms.
amount_expr = "max(0, {{contract.opex_year}} * {{contract.gross_up_factor}} * pow(1 + {{contract.opex_escalation}}, {{time.elapsed_years}}) - {{contract.expense_stop_year}}) * {{contract.pro_rata_share}} / {{model.periods_per_year}}"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
expense_stop_year = "0"
opex_year = "0"
opex_escalation = "0"
pro_rata_share = "0"
gross_up_factor = "1"

[[rules]]
id = "cre_lease_unit_ti_lc"
contract_name = "cre.lease_unit"
stream_name = "cre.unit.ti_lc.{{contract.suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "investing.capital.leasing"
amount_expr = "{{contract.ti_total}} + {{contract.lc_total}}"
schedule_kind = "on_date"
schedule_from = "{{contract.term_start}}"
schedule_to = ""

[rules.defaults]
ti_total = "0"
lc_total = "0"

[[rules]]
id = "cre_rollover_rent"
contract_name = "cre.rollover"
stream_name = "cre.rollover.rent.{{contract.suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.revenue.base_rent"
# Industry-standard market leasing assumption. The window starts AT EXPIRY
# (term_start = expiry). During the first downtime_months, only the renewal
# scenario pays (p * renewal rent — the re-lease scenario sits vacant);
# afterwards rent is the full probability-weighted blend. Escalation steps on
# window anniversaries.
amount_expr = "({{contract.renewal_probability}} * {{contract.renewal_rent_year}} + (1 - {{contract.renewal_probability}}) * {{contract.market_rent_year}} * clamp({{time.elapsed_periods}} + 1 - {{periods.downtime_months}}, 0, 1)) / {{model.periods_per_year}} * pow(1 + {{contract.market_escalation}}, {{time.elapsed_years}})"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
market_escalation = "0"
downtime_months = "0"

[[rules]]
id = "cre_rollover_ti_lc"
contract_name = "cre.rollover"
stream_name = "cre.rollover.ti_lc.{{contract.suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "investing.capital.leasing"
# Industry-standard timing: the renewal-scenario turnover cost (p * renewal_ti_lc) pays
# at expiry; the re-lease cost ((1-p) * new_ti_lc) pays after downtime, when
# the new tenant takes occupancy. With downtime_months = 0 both pay at the
# window start.
amount_expr = "if({{time.elapsed_periods}} == 0, {{contract.renewal_probability}} * {{contract.renewal_ti_lc}}, 0) + if({{time.elapsed_periods}} >= {{periods.downtime_months}} and {{time.elapsed_periods}} - 1 < {{periods.downtime_months}}, (1 - {{contract.renewal_probability}}) * {{contract.new_ti_lc}}, 0)"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
renewal_ti_lc = "0"
new_ti_lc = "0"
downtime_months = "0"

[[rules]]
id = "cre_vacancy_loss"
contract_name = "cre.vacancy_loss"
stream_name = "cre.vacancy.loss"
owner_entity = "${subject}"
direction = "outflow"
category = "operating.deduction.vacancy"
amount_expr = "{{contract.rate}} * {{contract.potential_gross_year}} / {{model.periods_per_year}}"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[[rules]]
id = "cre_property_opex"
contract_name = "cre.property_opex"
stream_name = "cre.property.opex{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "operating.expense.opex"
amount_expr = "({{contract.opex_year}} / {{model.periods_per_year}}) * pow(1 + {{contract.escalation}}, {{time.elapsed_years}})"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
escalation = "0"

[[rules]]
id = "cre_exit_forward_noi"
contract_name = "cre.exit"
stream_name = "cre.exit.proceeds"
owner_entity = "${subject}"
direction = "inflow"
category = "investing.reversion"
# Sale at term_start: forward-12-month NOI / exit cap, net of selling costs.
amount_expr = "{{contract.noi_forward_year}} / {{contract.exit_cap}} * (1 - {{contract.selling_costs}})"
# A disposal is taken at the END of the holding period, so it discounts
# the full n periods. `on_date` alone would settle it at the period's
# open — one month early on a monthly model, a whole year on an annual.
schedule_kind = "on_date"
schedule_at_period_end = true
schedule_from = "{{contract.term_start}}"
schedule_to = ""

[rules.defaults]
selling_costs = "0"

[[rules]]
id = "cre_percentage_rent"
contract_name = "cre.percentage_rent"
stream_name = "cre.pct_rent{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.revenue.percentage_rent"
# Overage rent: pct of sales above the breakpoint, sales growing on the
# lease's own anniversaries.
amount_expr = "max(0, {{contract.sales_year}} * pow(1 + {{contract.sales_growth}}, {{time.elapsed_years}}) - {{contract.breakpoint_year}}) * {{contract.overage_pct}} / {{model.periods_per_year}}"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
sales_growth = "0"

[[rules]]
id = "cre_exit_forward_noi_derived"
contract_name = "cre.exit_forward"
stream_name = "cre.exit.proceeds"
owner_entity = "${subject}"
direction = "inflow"
category = "investing.reversion"
# Forward NOI derived from the modeled streams over the 12 months AFTER the
# sale date (expense streams are signed negative, so adding them nets NOI).
# Requires a projection tail (`time ... project 12`) so the window has data.
#
# `cre.pct_rent.*` appears once, not twice. It used to be paired with a bare
# `series_sum("cre.pct_rent", ...)`, which double-counted: `.*` already matches
# the bare name as well as its children, so an unsuffixed cre.PercentageRent
# contract entered forward NOI twice and inflated the exit price it strikes.
# Latent only because every shipped model suffixes the contract.
amount_expr = "(series_sum(\"cre.unit.base_rent.*\", time.t + 1, time.t + {{model.periods_per_year}}) + series_sum(\"cre.unit.recoveries.*\", time.t + 1, time.t + {{model.periods_per_year}}) + series_sum(\"cre.rollover.rent.*\", time.t + 1, time.t + {{model.periods_per_year}}) + series_sum(\"cre.pct_rent.*\", time.t + 1, time.t + {{model.periods_per_year}}) + series_sum(\"cre.lease.base_rent\", time.t + 1, time.t + {{model.periods_per_year}}) + series_sum(\"cre.ops.revenue\", time.t + 1, time.t + {{model.periods_per_year}}) + series_sum(\"cre.ops.expense\", time.t + 1, time.t + {{model.periods_per_year}}) + series_sum(\"cre.vacancy.loss\", time.t + 1, time.t + {{model.periods_per_year}}) + series_sum(\"cre.property.opex\", time.t + 1, time.t + {{model.periods_per_year}})) / {{contract.exit_cap}} * (1 - {{contract.selling_costs}})"
# A disposal is taken at the END of the holding period, so it discounts
# the full n periods. `on_date` alone would settle it at the period's
# open — one month early on a monthly model, a whole year on an annual.
schedule_kind = "on_date"
schedule_at_period_end = true
schedule_from = "{{contract.term_start}}"
schedule_to = ""

[rules.defaults]
selling_costs = "0"

# ---------------------------------------------------------------------------
# cre.permanent_debt — a commercial mortgage on a stabilised property.
#
# Emits ONE stream, `loan.permanent_debt_service`, because that is the exact
# name `domain.cre.debt_service` selects (metrics.toml). Selectors match by
# exact name unless they end `.*`, so a suffixed or split stream would leave
# the metric summing nothing — and `require_positive` would then omit both it
# and `domain.cre.dscr` silently rather than erroring.
#
# THE DEFINING FEATURE IS THAT AMORTISATION AND MATURITY DIFFER. A 30-year
# amortisation on a 10-year term is the normal commercial structure, so
# `amort_months` strikes the payment while `term_end` sets maturity:
#
#   payment index k = p - io_months + 1     (1-based, p = periods elapsed)
#   balance after k = -fv(r, k, pmt(r, amort_months, principal), principal)
#
# THE BALLOON DEFAULTS OFF, and that is a convention rather than an oversight.
# Debt service coverage is measured on PERIODIC debt service; folding an
# unamortised balance into the final period would make that period's DSCR
# meaningless. The standard pro forma carries the payoff against the sale in
# the reversion, not as a debt service line. `balloon_at_maturity = 1` opts in.
#
# ONE COMBINED STREAM MEANS THE TWO-DIVISOR SPLIT DOES NOT CHANGE THIS NUMBER.
# Interest accrues on `day_count` and the payment is struck on
# `amortization_day_count`; principal is the plug, so their sum is the constant
# payment however the two are set. `amortization_day_count` still matters — it
# is what strikes that payment — but the interest/principal DECOMPOSITION this
# contract does not publish is the only place the divisors diverge. During an
# interest-only period there is no plug, so interest accrues on `day_count`
# directly and the distinction is live.
#
# `principal` and `rate` are deliberately NOT defaulted. A mortgage with an
# unstated balance or an unstated rate is not a modelling shortcut, it is a
# missing term, and E5006 should say so rather than the pack inventing a zero.
#
# Sizing to a target coverage ratio is a solve and is out of scope. So is
# refinance, which needs the events layer — no pack emits events. Mortgage
# insurance (FHA/HUD MIP) is not modelled: it is not debt service, and the one
# committed source that carries it states P+I+MIP as a single published line.
# ---------------------------------------------------------------------------

[[rules]]
id = "cre_permanent_debt_service"
contract_name = "cre.permanent_debt"
stream_name = "loan.permanent_debt_service"
owner_entity = "${subject}"
direction = "outflow"
category = "financing.debt_service"
# Interest-only while p < io_months, then the level payment; balloon opt-in.
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.io_months}}, {{contract.principal}} * ({{contract.rate}} / {{model.accrual_divisor}}), -pmt({{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.amort_months}}, {{contract.principal}})) + if({{contract.balloon_at_maturity}} == 1 and {{time.periods_to_term_end}} == 0, -fv({{contract.rate}} / {{model.amortization_divisor}}, {{time.elapsed_periods}} - {{whole_periods.io_months}} + 1, pmt({{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.amort_months}}, {{contract.principal}}), {{contract.principal}}), 0)"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
io_months = "0"
balloon_at_maturity = "0"
payment_frequency = ""
