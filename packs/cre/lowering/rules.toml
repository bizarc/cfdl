[[rules]]
id = "cre_construction_stub_draws"
contract_name = "cre.construction_stub"
stream_name = "cre.construction.draws"
owner_entity = "${subject}"
direction = "outflow"
category = "investing.capital.construction"
amount_expr = "{{contract.amount}}"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

# `amount` is required: a construction draw is a material number and must be
# stated by the model, never supplied by the pack.

[[rules]]
id = "cre_lease_base_rent"
contract_name = "cre.lease"
stream_name = "cre.lease.base_rent"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.revenue.base_rent"
# Rent accrues over the contract's own term, measured from its start:
#   occupancy(m) = clamp((m + 1) / lease_up_months, 0, 1)
#   rent(m)      = base_rent * occupancy(m)
# where m is months since term_start. `lease_up_months = 1` (the default)
# means fully occupied from the first month — a neutral default that invents
# no lease-up assumption.
amount_expr = "({{contract.base_rent}} + {{contract.base_rent_year}} / {{model.periods_per_year}}) * clamp(({{time.elapsed_periods}} + 1) / {{periods.lease_up_months}}, 0, 1)"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

# `base_rent` is required.
[rules.defaults]
base_rent = "0"
base_rent_year = "0"
lease_up_months = "1"

[[rules]]
id = "cre_ops_revenue"
contract_name = "cre.ops_revenue"
stream_name = "cre.ops.revenue"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.revenue.other"
amount_expr = "{{contract.amount}}"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

# `amount` is required; the term supplies the schedule.

[[rules]]
id = "cre_exit_cap_sale"
contract_name = "cre.exit_cap"
stream_name = "cre.exit.sale"
owner_entity = "${subject}"
direction = "inflow"
category = "investing.reversion"
amount_expr = "{{contract.noi_value}} / {{contract.exit_cap}}"
# A disposal is taken at the END of the holding period, so it discounts
# the full n periods. `on_date` alone would settle it at the period's
# open — one month early on a monthly model, a whole year on an annual.
schedule_kind = "on_date"
schedule_at_period_end = true
schedule_from = "{{contract.term_start}}"
schedule_to = ""

# `noi_value` and `exit_cap` are required: an exit valuation is the single
# largest number in most CRE models and must be stated, not assumed. The
# contract's term supplies the sale date.

# ---------------------------------------------------------------------------
# Lease-by-lease contract types at institutional DCF parity (template-driven).
# Lease-anniversary anchoring: lease_t = months_between(term_start, time.date).
# ---------------------------------------------------------------------------

[[rules]]
id = "cre_lease_unit_base_rent"
contract_name = "cre.lease_unit"
stream_name = "cre.unit.base_rent.{{contract.suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.revenue.base_rent"
# Free rent burns off first; escalation steps on lease anniversaries.
amount_expr = "({{contract.rent_year}} / {{model.periods_per_year}}) * pow(1 + {{contract.escalation}}, {{time.elapsed_years}})"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
free_rent_months = "0"
escalation = "0"

# Free rent as its own deduction from potential gross revenue, which is how an
# institutional pro forma reports it (MIT OCW 11.431J does). It used to be
# netted into base rent by a clamp, so a model could show the line OR have it
# counted in NOI, never both — backlog 1.3.
#
# Base rent above is now GROSS and this is the offset, so the two still sum to
# the rent actually collected. `domain.cre.noi` carries this family in its
# denominator, which is what keeps NOI unchanged by the split.

[rules.units]
rent_year = "USD/yr"

[[rules]]
id = "cre_lease_unit_abatement"
contract_name = "cre.lease_unit"
stream_name = "cre.unit.abatement.{{contract.suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "operating.deduction.abatement"
amount_expr = "({{contract.rent_year}} / {{model.periods_per_year}}) * (1 - clamp({{time.elapsed_periods}} + 1 - {{periods.free_rent_months}}, 0, 1)) * pow(1 + {{contract.escalation}}, {{time.elapsed_years}})"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
free_rent_months = "0"
escalation = "0"

[[rules]]
id = "cre_lease_unit_recoveries"
contract_name = "cre.lease_unit"
stream_name = "cre.unit.recoveries.{{contract.suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.revenue.recovery"
# Expense reimbursement above the stop, at the tenant's pro-rata share.
# Opex escalates on the lease's own anniversary of the PROPERTY schedule:
# anchored to the recovery base year via opex_year/opex_escalation terms.
amount_expr = "max(0, {{contract.opex_year}} * {{contract.gross_up_factor}} * pow(1 + {{contract.opex_escalation}}, {{time.elapsed_years}}) - {{contract.expense_stop_year}}) * {{contract.pro_rata_share}} / {{model.periods_per_year}}"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
expense_stop_year = "0"
opex_year = "0"
opex_escalation = "0"
pro_rata_share = "0"
gross_up_factor = "1"

[[rules]]
id = "cre_lease_unit_ti_lc"
contract_name = "cre.lease_unit"
stream_name = "cre.unit.ti_lc.{{contract.suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "investing.capital.leasing"
amount_expr = "{{contract.ti_total}} + {{contract.lc_total}}"
schedule_kind = "on_date"
schedule_from = "{{contract.term_start}}"
schedule_to = ""

[rules.defaults]
ti_total = "0"
lc_total = "0"

[[rules]]
id = "cre_rollover_rent"
contract_name = "cre.rollover"
stream_name = "cre.rollover.rent.{{contract.suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.revenue.base_rent"
# Industry-standard market leasing assumption. The window starts AT EXPIRY
# (term_start = expiry). During the first downtime_months, only the renewal
# scenario pays (p * renewal rent — the re-lease scenario sits vacant);
# afterwards rent is the full probability-weighted blend. Escalation steps on
# window anniversaries.
amount_expr = "({{contract.renewal_probability}} * {{contract.renewal_rent_year}} + (1 - {{contract.renewal_probability}}) * {{contract.market_rent_year}} * clamp({{time.elapsed_periods}} + 1 - {{periods.downtime_months}}, 0, 1)) / {{model.periods_per_year}} * pow(1 + {{contract.market_escalation}}, {{time.elapsed_years}})"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
market_escalation = "0"
downtime_months = "0"

[[rules]]
id = "cre_rollover_ti_lc"
contract_name = "cre.rollover"
stream_name = "cre.rollover.ti_lc.{{contract.suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "investing.capital.leasing"
# Industry-standard timing: the renewal-scenario turnover cost (p * renewal_ti_lc) pays
# at expiry; the re-lease cost ((1-p) * new_ti_lc) pays after downtime, when
# the new tenant takes occupancy. With downtime_months = 0 both pay at the
# window start.
amount_expr = "if({{time.elapsed_periods}} == 0, {{contract.renewal_probability}} * {{contract.renewal_ti_lc}}, 0) + if({{time.elapsed_periods}} >= {{periods.downtime_months}} and {{time.elapsed_periods}} - 1 < {{periods.downtime_months}}, (1 - {{contract.renewal_probability}}) * {{contract.new_ti_lc}}, 0)"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
renewal_ti_lc = "0"
new_ti_lc = "0"
downtime_months = "0"

[[rules]]
id = "cre_vacancy_loss"
contract_name = "cre.vacancy_loss"
stream_name = "cre.vacancy.loss"
owner_entity = "${subject}"
direction = "outflow"
category = "operating.deduction.vacancy"
amount_expr = "{{contract.rate}} * {{contract.potential_gross_year}} / {{model.periods_per_year}}"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

# THE operating expense contract. One rule spans a single blended figure and a
# full itemised schedule; the grain is chosen by how many instances a model
# declares, and the LEVEL by the entity each hangs on (`part_of` rolls them up).
# It replaced `cre.opex_line` and `cre.opex_line`, which differed only in
# escalation and in whether they could be instanced — and, confusingly, the one
# named for a single property was the repeatable one.
#
# ESCALATION AND OCCUPANCY ARE EACH A PAIR, not a toggle. A term is a literal or
# one declared input, never an expression — the parser says so:
#
#   Term 'escalation' takes a single value. A term is a literal or one declared
#   input (e.g. `inputs.yield`); compute derived values in an `assume` instead.
#
# So `escalation = 0.03` and `escalation = inputs.cpi` both work, and a
# time-varying rate cannot arrive through the term at all. The pack composes the
# `curve_value` call and the term carries only the curve NAME. `escalation = 0`
# is the default and IS "no escalation"; a boolean would be a second way to say
# it and a way for the two to disagree.
#
# The occupancy factor is `pct_fixed + (1 - pct_fixed) * occupancy`. Property
# tax and insurance run whether the building is full or empty; utilities and
# cleaning track occupied space. At the default `pct_fixed = 1` the factor is 1
# and this reduces to a plain escalating series.
#
# `pow(1 + esc, time.elapsed_years)` steps ANNUALLY — elapsed_years is
# `round_down(months / 12, 0)` — which is how commercial opex escalates. It is
# deliberately not opco's per-period recurrence: the two give different numbers
# and the HUD case is the evidence that the difference is material.
[[rules]]
id = "cre_opex_line"
contract_name = "cre.opex_line"
stream_name = "cre.opex.line{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "operating.expense.opex"
amount_expr = "({{contract.amount}} + {{contract.amount_year}} / {{model.periods_per_year}}) * pow(1 + if(\"{{contract.escalation_curve}}\" == \"\", {{contract.escalation}}, curve_value(\"{{contract.escalation_curve}}\", time.date)), {{time.elapsed_years}}) * ({{contract.pct_fixed}} + (1 - {{contract.pct_fixed}}) * if(\"{{contract.occupancy_curve}}\" == \"\", {{contract.occupancy}}, curve_value(\"{{contract.occupancy_curve}}\", time.date)))"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
# Either amount term satisfies E6041; the unstated one contributes zero.
amount = "0"
amount_year = "0"
escalation = "0"
escalation_curve = ""
pct_fixed = "1"
occupancy = "1"
occupancy_curve = ""

[[rules]]
id = "cre_exit_selling_costs"
contract_name = "cre.exit"
stream_name = "cre.exit.selling_costs"
owner_entity = "${subject}"
direction = "outflow"
category = "investing.selling_costs"
# The transaction cost as its own line: gross less costs is the old net, so
# net cash flow is unchanged and the statement can show both.
amount_expr = "{{contract.noi_forward_year}} / {{contract.exit_cap}} * {{contract.selling_costs}}"
schedule_kind = "on_date"
schedule_at_period_end = true
schedule_from = "{{contract.term_start}}"
schedule_to = ""

[rules.defaults]
selling_costs = "0"

[[rules]]
id = "cre_exit_forward_noi"
contract_name = "cre.exit"
stream_name = "cre.exit.proceeds"
owner_entity = "${subject}"
direction = "inflow"
category = "investing.reversion"
# Sale at term_start: forward-12-month NOI / exit cap, GROSS. Selling costs
# lower as their own stream, so gross less costs is the old net.
amount_expr = "{{contract.noi_forward_year}} / {{contract.exit_cap}}"
# A disposal is taken at the END of the holding period, so it discounts
# the full n periods. `on_date` alone would settle it at the period's
# open — one month early on a monthly model, a whole year on an annual.
schedule_kind = "on_date"
schedule_at_period_end = true
schedule_from = "{{contract.term_start}}"
schedule_to = ""

[[rules]]
id = "cre_percentage_rent"
contract_name = "cre.percentage_rent"
stream_name = "cre.pct_rent{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.revenue.percentage_rent"
# Overage rent: pct of sales above the breakpoint, sales growing on the
# lease's own anniversaries.
amount_expr = "max(0, {{contract.sales_year}} * pow(1 + {{contract.sales_growth}}, {{time.elapsed_years}}) - {{contract.breakpoint_year}}) * {{contract.overage_pct}} / {{model.periods_per_year}}"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
sales_growth = "0"

[[rules]]
id = "cre_exit_forward_noi_derived"
contract_name = "cre.exit_forward"
stream_name = "cre.exit.proceeds"
owner_entity = "${subject}"
direction = "inflow"
category = "investing.reversion"
# Forward NOI derived from the modeled streams over the 12 months AFTER the
# sale date (expense streams are signed negative, so adding them nets NOI).
# Requires a projection tail (`time ... project 12`) so the window has data.
#
# `cre.pct_rent.*` appears once, not twice. It used to be paired with a bare
# `series_sum("cre.pct_rent", ...)`, which double-counted: `.*` already matches
# the bare name as well as its children, so an unsuffixed cre.PercentageRent
# contract entered forward NOI twice and inflated the exit price it strikes.
# Latent only because every shipped model suffixes the contract.
#
# `cre.opex.line.*` carries a `.*` for the same reason, and it did not always.
# The two opex streams it replaces were summed by BARE name, and
# `cre.opex_line` was instanceable — so `cre.opex_line.taxes` emitted
# `cre.opex.line.taxes`, which the bare pattern did not match. Opex dropped
# out of forward NOI, NOI was overstated, and the exit price struck off it was
# too high. Silent, and worth real money.
amount_expr = "(series_sum(\"cre.unit.base_rent.*\", time.t + 1, time.t + {{model.periods_per_year}}) + series_sum(\"cre.unit.recoveries.*\", time.t + 1, time.t + {{model.periods_per_year}}) + series_sum(\"cre.rollover.rent.*\", time.t + 1, time.t + {{model.periods_per_year}}) + series_sum(\"cre.pct_rent.*\", time.t + 1, time.t + {{model.periods_per_year}}) + series_sum(\"cre.lease.base_rent\", time.t + 1, time.t + {{model.periods_per_year}}) + series_sum(\"cre.ops.revenue\", time.t + 1, time.t + {{model.periods_per_year}}) + series_sum(\"cre.vacancy.loss\", time.t + 1, time.t + {{model.periods_per_year}}) + series_sum(\"cre.opex.line.*\", time.t + 1, time.t + {{model.periods_per_year}})) / {{contract.exit_cap}}"
# A disposal is taken at the END of the holding period, so it discounts
# the full n periods. `on_date` alone would settle it at the period's
# open — one month early on a monthly model, a whole year on an annual.
schedule_kind = "on_date"
schedule_at_period_end = true
schedule_from = "{{contract.term_start}}"
schedule_to = ""

[rules.defaults]
selling_costs = "0"

# The identical forward-NOI window, times the cost rate — the two rules must
# stay in lockstep, which check-rule-fragments polices for repeated fragments.
[[rules]]
id = "cre_exit_forward_selling_costs"
contract_name = "cre.exit_forward"
stream_name = "cre.exit.selling_costs"
owner_entity = "${subject}"
direction = "outflow"
category = "investing.selling_costs"
amount_expr = "(series_sum(\"cre.unit.base_rent.*\", time.t + 1, time.t + {{model.periods_per_year}}) + series_sum(\"cre.unit.recoveries.*\", time.t + 1, time.t + {{model.periods_per_year}}) + series_sum(\"cre.rollover.rent.*\", time.t + 1, time.t + {{model.periods_per_year}}) + series_sum(\"cre.pct_rent.*\", time.t + 1, time.t + {{model.periods_per_year}}) + series_sum(\"cre.lease.base_rent\", time.t + 1, time.t + {{model.periods_per_year}}) + series_sum(\"cre.ops.revenue\", time.t + 1, time.t + {{model.periods_per_year}}) + series_sum(\"cre.vacancy.loss\", time.t + 1, time.t + {{model.periods_per_year}}) + series_sum(\"cre.opex.line.*\", time.t + 1, time.t + {{model.periods_per_year}})) / {{contract.exit_cap}} * {{contract.selling_costs}}"
schedule_kind = "on_date"
schedule_at_period_end = true
schedule_from = "{{contract.term_start}}"
schedule_to = ""

[rules.defaults]
selling_costs = "0"

# ---------------------------------------------------------------------------
# cre.permanent_debt — a commercial mortgage on a stabilized property.
#
# Emits ONE stream, `loan.permanent_debt_service`, because that is the exact
# name `domain.cre.debt_service` selects (metrics.toml). Selectors match by
# exact name unless they end `.*`, so a suffixed or split stream would leave
# the metric summing nothing — and `require_positive` would then omit both it
# and `domain.cre.dscr` silently rather than erroring.
#
# THE DEFINING FEATURE IS THAT AMORTIZATION AND MATURITY DIFFER. A 30-year
# amortization on a 10-year term is the normal commercial structure, so
# `amort_months` strikes the payment while `term_end` sets maturity:
#
#   payment index k = p - io_months + 1     (1-based, p = periods elapsed)
#   balance after k = -fv(r, k, pmt(r, amort_months, principal), principal)
#
# THE BALLOON DEFAULTS OFF, and that is a convention rather than an oversight.
# Debt service coverage is measured on PERIODIC debt service; folding an
# unamortized balance into the final period would make that period's DSCR
# meaningless. The standard pro forma carries the payoff against the sale in
# the reversion, not as a debt service line. `balloon_at_maturity = 1` opts in.
#
# ONE COMBINED STREAM MEANS THE TWO-DIVISOR SPLIT DOES NOT CHANGE THIS NUMBER.
# Interest accrues on `day_count` and the payment is struck on
# `amortization_day_count`; principal is the plug, so their sum is the constant
# payment however the two are set. `amortization_day_count` still matters — it
# is what strikes that payment — but the interest/principal DECOMPOSITION this
# contract does not publish is the only place the divisors diverge. During an
# interest-only period there is no plug, so interest accrues on `day_count`
# directly and the distinction is live.
#
# `principal` and `rate` are deliberately NOT defaulted. A mortgage with an
# unstated balance or an unstated rate is not a modeling shortcut, it is a
# missing term, and E5006 should say so rather than the pack inventing a zero.
#
# Sizing to a target coverage ratio is a solve and is out of scope. So is
# refinance, which needs the events layer — no pack emits events. Mortgage
# insurance (FHA/HUD MIP) is not modeled: it is not debt service, and the one
# committed source that carries it states P+I+MIP as a single published line.
# ---------------------------------------------------------------------------

# Decomposed per the contract design rules (docs/07 §6.4): one stream per line
# a financing statement shows. The single netted `loan.permanent_debt_service`
# lost the interest/principal split — foreclosing a tax line, interest
# coverage, and any amortization schedule — and emitted NO PROCEEDS at all: a
# $6m mortgage that funded nothing, on the most common CRE instrument.
#
# The split is exact: ipmt + ppmt equals the level payment identically (pinned
# in cfdl-calc against Excel), so interest + principal reproduce the old debt
# service to the digit, and every category folds where the netted line folded.
#
# A reconciliation whose source's cash flow starts post-financing states
# `funded_at_close = 0` and says so — the default is the whole instrument.
[[rules]]
id = "cre_permanent_debt_proceeds"
contract_name = "cre.permanent_debt"
stream_name = "loan.permanent_debt.proceeds{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "financing.debt_proceeds"
amount_expr = "{{contract.principal}} * {{contract.funded_at_close}}"
schedule_kind = "on_date"
schedule_from = "{{contract.term_start}}"
schedule_to = ""

[rules.defaults]
funded_at_close = "1"

[[rules]]
id = "cre_permanent_debt_interest"
contract_name = "cre.permanent_debt"
stream_name = "loan.permanent_debt.interest{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "financing.interest"
# Interest-only while p < io_months, then the interest leg of the level
# payment. Accrual and amortization keep their own divisors: an Actual/360
# loan accrues on real days while its payment is struck on a 30/360 schedule.
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.io_months}}, {{contract.principal}} * ({{contract.rate}} / {{model.accrual_divisor}}), -ipmt({{contract.rate}} / {{model.amortization_divisor}}, {{time.elapsed_periods}} - {{whole_periods.io_months}} + 1, {{whole_periods.amort_months}}, {{contract.principal}}))"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
io_months = "0"
payment_frequency = ""

[[rules]]
id = "cre_permanent_debt_principal"
contract_name = "cre.permanent_debt"
stream_name = "loan.permanent_debt.principal{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "financing.debt_principal"
# Scheduled amortization, plus the balloon when opted in — off by default,
# because folding the unamortized balance into the final period makes that
# period's coverage ratio meaningless; a sale usually repays it instead.
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.io_months}}, 0, -ppmt({{contract.rate}} / {{model.amortization_divisor}}, {{time.elapsed_periods}} - {{whole_periods.io_months}} + 1, {{whole_periods.amort_months}}, {{contract.principal}})) + if({{contract.balloon_at_maturity}} == 1 and {{time.periods_to_term_end}} == 0, -fv({{contract.rate}} / {{model.amortization_divisor}}, {{time.elapsed_periods}} - {{whole_periods.io_months}} + 1, pmt({{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.amort_months}}, {{contract.principal}}), {{contract.principal}}), 0)"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
io_months = "0"
balloon_at_maturity = "0"
payment_frequency = ""

# ---------------------------------------------------------------------------
# cre.construction_loan — a construction facility behind an equity commitment.
#
# THE DRAW SCHEDULE IS DATA, NOT A TERM. A development's funding curve is
# per-deal: sixteen published quarters here, an S-curve elsewhere, a
# contractor's actual schedule on the deal after that. All three are the same
# object, so the contract names a `curve` and the model declares it. Putting a
# curve SHAPE in a term (`s_curve_steepness = 4.0`) states an implementation
# parameter as though it were something the parties agreed, and the next deal
# disagrees with it.
#
# THE CURVE CARRIES AN ANNUALIZED FUNDING RATE, and every read divides by
# `{{model.periods_per_year}}`. That is the same convention `rent_year`,
# `opex_year` and opco's `growth_curve` already follow, and it is what makes
# the contract cadence-neutral: a `curve` is a LEVEL, so a step curve returns
# the last point at or before the date whether or not a point was declared
# there. Read as a per-period TOTAL instead, a schedule stated quarterly and
# run monthly repeats each quarter's figure three times and funds three times
# the money, silently. Annualized, the same sparse curve is correct on every
# calendar, and re-graining spreads a quarter's funding evenly across its
# months — which is the only defensible reading when nothing finer was stated.
#
# ONE FIELD, AND EVERYTHING ELSE IS CLOSED FORM. Cumulative funding required is
# the only quantity that cannot be recomputed from the period alone, so it is
# the only recurrence. The equity/debt split, the opening balance and the
# interest all fall out of it with `min` and `max`:
#
#   D(t)          this period's required funding        curve_value(...)
#   C(t)          cumulative through and including t    the field
#   debt draw     min(D, max(0, C - E))
#   equity draw   D - debt draw
#   opening debt  max(0, C - D - E)
#   interest      (opening + draw * f) * rate / divisor
#
# The commitment depleting MID-PERIOD is not a special case: it is what those
# two clamps do when C crosses E inside a period.
#
# NO STREAM READS ANOTHER STREAM AND NO FIELD READS A STREAM. A recurrence sees
# no series at all, so a balance fed by draw streams is not expressible — the
# opening balance is RE-DERIVED from the cumulative field instead. That is the
# shape any construction contract has to take, and it is why this one carries a
# cumulative field rather than a running balance.
#
# INTEREST IS PAID, NOT CAPITALIZED. Capitalizing compounds it, which is a
# different instrument and a different recurrence; the shipped case funds
# interest from the equity budget as a separate stated line, which is what the
# published exhibit does. A capitalizing variant collects to
# `next (prev * (1 + r*f) + D) / (1 - r*f)` and is a follow-on, not a flag.
# ---------------------------------------------------------------------------

[[rules]]
id = "cre_construction_loan_equity_draw"
contract_name = "cre.construction_loan"
stream_name = "cre.construction.equity_draw{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "financing.equity"
# The residual: what the commitment still covers after the loan takes its share.
amount_expr = "(curve_value(\"{{contract.draw_curve}}\", time.date) / {{model.periods_per_year}}) - min((curve_value(\"{{contract.draw_curve}}\", time.date) / {{model.periods_per_year}}), max(0, field.cre_construction_funded{{contract.suffix_ident}} - {{contract.equity_commitment}}))"
field_name = "cre_construction_funded{{contract.suffix_ident}}"
field_init = "(curve_value(\"{{contract.draw_curve}}\", time.date) / {{model.periods_per_year}})"
field_next = "prev + (curve_value(\"{{contract.draw_curve}}\", time.date) / {{model.periods_per_year}})"
field_from = "{{contract.term_start}}"
field_to = "{{contract.term_end}}"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[[rules]]
id = "cre_construction_loan_draw"
contract_name = "cre.construction_loan"
stream_name = "cre.construction.loan_draw{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "financing.debt_proceeds"
# Nothing until cumulative funding passes the commitment; the balance after.
amount_expr = "min((curve_value(\"{{contract.draw_curve}}\", time.date) / {{model.periods_per_year}}), max(0, field.cre_construction_funded{{contract.suffix_ident}} - {{contract.equity_commitment}}))"
field_name = "cre_construction_funded{{contract.suffix_ident}}"
field_init = "(curve_value(\"{{contract.draw_curve}}\", time.date) / {{model.periods_per_year}})"
field_next = "prev + (curve_value(\"{{contract.draw_curve}}\", time.date) / {{model.periods_per_year}})"
field_from = "{{contract.term_start}}"
field_to = "{{contract.term_end}}"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[[rules]]
id = "cre_construction_loan_interest"
contract_name = "cre.construction_loan"
stream_name = "cre.construction.interest{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "outflow"
# `financing.debt_service` so `domain.cre.debt_service` counts it: coverage
# during a build is measured on interest actually accruing.
category = "financing.debt_service"
# `draw_accrual_fraction` is the market convention for WHEN in the period the
# money lands, and it genuinely varies: 0.5 for funding drawn ratably through
# the period (the default, and what a monthly-requisition build does), 0 for
# funding at the period's end, 1 at its start. It is a convention, so it is a
# term; the curve's SHAPE is data, so it is not.
amount_expr = "(max(0, field.cre_construction_funded{{contract.suffix_ident}} - (curve_value(\"{{contract.draw_curve}}\", time.date) / {{model.periods_per_year}}) - {{contract.equity_commitment}}) + min((curve_value(\"{{contract.draw_curve}}\", time.date) / {{model.periods_per_year}}), max(0, field.cre_construction_funded{{contract.suffix_ident}} - {{contract.equity_commitment}})) * {{contract.draw_accrual_fraction}}) * ({{contract.rate}} / {{model.accrual_divisor}})"
field_name = "cre_construction_funded{{contract.suffix_ident}}"
field_init = "(curve_value(\"{{contract.draw_curve}}\", time.date) / {{model.periods_per_year}})"
field_next = "prev + (curve_value(\"{{contract.draw_curve}}\", time.date) / {{model.periods_per_year}})"
field_from = "{{contract.term_start}}"
field_to = "{{contract.term_end}}"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
draw_accrual_fraction = "0.5"
