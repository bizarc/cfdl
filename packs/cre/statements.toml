# CRE per-period subtotals — the middle rows of an operating statement.
#
# These are folds over the ledger, evaluated once per period. Until they existed
# a statement had its line items and its bottom line and nothing between them:
# `domain.cre.noi` was one number for a whole hold, so a lender's coverage test
# — which is annual, and which breaches in a single year — could not be
# expressed at all.
#
# THEY FOLD CATEGORIES, NOT STREAM NAMES. That is the whole point of a category
# being a dotted path: net operating income is everything classified
# `operating.*`, and nothing has to enumerate which streams those are. Add a
# contract to the pack and its streams join the right subtotals because the rule
# that emits them already said what they are. `domain.cre.noi`'s metric sibling,
# by contrast, lists nine stream selectors by hand and has to be edited whenever
# the pack grows.
#
# Verified against a published source rather than asserted. On the HUD Sample
# workbook's Operating Pro Forma:
#
#   operating.revenue.* + operating.deduction.*   = 145,557  = its EGI  (row 15)
#   operating.*                                   =  22,043  = its NOI  (row 24)
#   noi / financing.*                             = 1.5757380799199372
#                                                 = its DSCR (row 102), exactly
#
# Order is the dependency order. A subtotal may reference only ones declared
# above it, which is what makes a cycle unexpressible rather than merely
# rejected — the same argument docs/14_state_and_recurrence.md §5 makes about
# waterfalls.

# Potential gross revenue: the rent roll before anything is deducted.
[[subtotals]]
id = "domain.cre.pgr"
kind = "money"
op = "sum"
categories = ["operating.revenue.*"]
formula = "sum(operating.revenue.*)"

# Effective gross income: potential gross revenue net of vacancy and free rent.
# Recoveries sit under `operating.revenue.recovery` and so are already in the
# first term — which is correct, and is why a pro forma reports them as their
# own line while still counting them above NOI.
[[subtotals]]
id = "domain.cre.egi"
kind = "money"
op = "sum"
categories = ["operating.revenue.*", "operating.deduction.*"]
formula = "potential gross revenue less vacancy and abatements"

# Total operating expenses, signed as they are stored (negative).
[[subtotals]]
id = "domain.cre.opex_total"
kind = "money"
op = "sum"
categories = ["operating.expense.*"]
formula = "sum(operating.expense.*)"

# Net operating income. Deliberately `operating.*` rather than
# `egi + opex_total`: the two are equal by construction, and folding the section
# directly means a new operating category — an expense reimbursement structure
# nobody has thought of yet — lands in NOI without this file changing.
[[subtotals]]
id = "domain.cre.noi"
kind = "money"
op = "sum"
categories = ["operating.*"]
formula = "sum(operating.*)"

# ITEMISED BY STREAM, NOT BY CATEGORY. `cre.opex_line` is one contract instanced
# per expense and every instance carries the same category, so a category row
# could only ever render one number however many lines a model declares.
#
# A `line` row may select by `streams` instead, and the pack loader resolves each
# selector to the category of the rule that emits that family — so these rows
# satisfy the completeness check below exactly as a category row would. The
# category row they replaced cannot be kept alongside them: every itemized
# stream also carries `operating.expense.opex`, and claiming it twice is checked
# for, statically here and per stream by the evaluator.
#
# A modeller naming their own instance is not lost. It matches no row, and the
# evaluator emits a `residual` row for streams no row claimed. That is the
# runtime half of the guarantee, and it is why the static half stops at the
# category.
#
# The total is a subtotal row rather than a line: `domain.cre.opex_total` folds
# `operating.expense.*`, so it stays right however many lines exist, and
# subtotals are excluded from the bottom-line reconciliation because they are
# folds of the lines.

# What coverage is measured against: the categories that are PAYMENTS on the
# debt, not the whole financing section.
#
# It folded `financing.*` until a construction case arrived with draws in it. A
# draw is financing and is not debt service, so the broad fold netted money
# received against money paid and the coverage ratio quietly improved. The
# section is the wrong grain for this question; the two service categories are
# the right one.
#
# Mortgage insurance is included even though it is not a payment on the debt,
# because it is part of the line a lender tests — HUD states its debt service as
# P+I+MIP and computes DSCR from it. See backlog 7.14.
[[subtotals]]
id = "domain.cre.debt_service"
kind = "money"
op = "negated_sum"
# `interest` and `debt_principal` joined when `cre.permanent_debt` decomposed:
# the two legs fold where the netted payment folded, so coverage is unchanged
# to the digit. `debt_service` remains for instruments that genuinely pay one
# line, such as construction-loan interest.
categories = [
  "financing.debt.service",
  "financing.debt.interest_paid",
  "financing.debt.principal",
  "financing.debt.mortgage_insurance",
]
formula = "-sum(financing.debt.service, financing.debt.interest_paid, financing.debt.principal, financing.debt.mortgage_insurance)"

# Debt service coverage, per period. This is the row backlog 1.4 is about: a
# lifetime ratio of 1.4 can contain a year at 0.9 and report nothing.
[[subtotals]]
id = "domain.cre.dscr"
kind = "number"
op = "ratio"
numerator = "domain.cre.noi"
denominator = "domain.cre.debt_service"
formula = "domain.cre.noi / domain.cre.debt_service"

# Leasing costs — TI and commissions. Below the NOI line, which is what
# `investing.` says; the fold reaches both the per-unit and the rollover
# families without naming either.
[[subtotals]]
id = "domain.cre.leasing_costs"
kind = "money"
op = "negated_sum"
categories = ["investing.capital.leasing"]
formula = "-sum(investing.capital.leasing)"

# ---------------------------------------------------------------------------
# The operating statement.
#
# Rows are PRESENTATION. They carry order, labels, depth and a display sign;
# they compute nothing that the subtotals above have not already computed.
#
# `display` is the answer to backlog 1.3. Argus prints a deduction as a POSITIVE
# number in a "less:" row, and the old way to get that was to flip the sign of
# the thing itself — which meant a line could be shown OR counted, never both.
# A row therefore carries the signed value AND a display sign: a consumer that
# ignores presentation still gets correct arithmetic, and a consumer that
# renders gets a pro forma. The arithmetic sign lives in the stream's direction
# and nowhere else.
#
# Row order follows HUD's own Operating Pro Forma (reference/PROVENANCE.md) and
# the section comments MIT's model carries in code.
#
# EVERY CATEGORY THE PACK DECLARES APPEARS IN EXACTLY ONE `line` ROW. That is
# what makes the bottom line reconcile to net cash flow rather than merely
# resemble it, and the completeness gate checks it rather than trusting it.

[[statements]]
id = "operating"
label = "Operating statement"
default = true

[[statements.rows]]
kind = "line"
label = "Base rental revenue"
depth = 1
categories = ["operating.revenue.base_rent"]

[[statements.rows]]
kind = "line"
label = "Percentage rent"
depth = 1
categories = ["operating.revenue.percentage_rent"]

[[statements.rows]]
kind = "line"
label = "Other operating income"
depth = 1
categories = ["operating.revenue.other"]

[[statements.rows]]
kind = "line"
label = "Less: vacancy and credit loss"
depth = 1
categories = ["operating.deduction.vacancy"]
display = "positive"

[[statements.rows]]
kind = "line"
label = "Less: free rent"
depth = 1
categories = ["operating.deduction.abatement"]
display = "positive"

[[statements.rows]]
kind = "line"
label = "Expense reimbursements"
depth = 1
categories = ["operating.revenue.recovery"]

[[statements.rows]]
kind = "line"
label = "Income taxes"
depth = 2
categories = ["operating.income_tax.paid"]
display = "positive"

[[statements.rows]]
kind = "subtotal"
label = "Effective gross income"
depth = 0
subtotal = "domain.cre.egi"

[[statements.rows]]
kind = "line"
label = "Operating expenses"
depth = 2
streams = ["cre.opex.line"]  # series-allow: claims ONLY the unsuffixed blended line; the itemized rows below claim the named instances, and `.*` here would claim theirs too
display = "positive"

[[statements.rows]]
kind = "line"
label = "Property tax"
depth = 2
streams = ["cre.opex.line.property_tax"]
display = "positive"

[[statements.rows]]
kind = "line"
label = "Insurance"
depth = 2
streams = ["cre.opex.line.insurance"]
display = "positive"

[[statements.rows]]
kind = "line"
label = "Utilities"
depth = 2
streams = ["cre.opex.line.utilities"]
display = "positive"

[[statements.rows]]
kind = "line"
label = "Repairs and maintenance"
depth = 2
streams = ["cre.opex.line.repairs_maintenance"]
display = "positive"

[[statements.rows]]
kind = "line"
label = "Cleaning"
depth = 2
streams = ["cre.opex.line.cleaning"]
display = "positive"

[[statements.rows]]
kind = "line"
label = "Security"
depth = 2
streams = ["cre.opex.line.security"]
display = "positive"

[[statements.rows]]
kind = "line"
label = "Landscaping and grounds"
depth = 2
streams = ["cre.opex.line.landscaping"]
display = "positive"

[[statements.rows]]
kind = "line"
label = "Management fee"
depth = 2
streams = ["cre.opex.line.management"]
display = "positive"

[[statements.rows]]
kind = "line"
label = "General and administrative"
depth = 2
streams = ["cre.opex.line.general_admin"]
display = "positive"

[[statements.rows]]
kind = "subtotal"
label = "Total operating expenses"
depth = 1
subtotal = "domain.cre.opex_total"
display = "positive"

[[statements.rows]]
kind = "subtotal"
label = "Net operating income"
depth = 0
subtotal = "domain.cre.noi"

[[statements.rows]]
kind = "spacer"

[[statements.rows]]
kind = "line"
label = "Tenant improvements and leasing commissions"
depth = 1
categories = ["investing.capital.leasing"]
display = "positive"

[[statements.rows]]
kind = "line"
label = "Capital expenditure"
depth = 1
categories = ["investing.capital.capex", "investing.capital.construction"]
display = "positive"

[[statements.rows]]
kind = "line"
label = "Debt service"
depth = 1
categories = ["financing.debt.service"]
display = "positive"

[[statements.rows]]
kind = "line"
label = "Interest"
depth = 1
categories = ["financing.debt.interest_paid"]
display = "positive"

[[statements.rows]]
kind = "line"
label = "Principal amortization"
depth = 1
categories = ["financing.debt.principal"]
display = "positive"

[[statements.rows]]
kind = "line"
label = "Mortgage insurance"
depth = 1
categories = ["financing.debt.mortgage_insurance"]
display = "positive"

[[statements.rows]]
kind = "ratio"
label = "Debt service coverage"
depth = 0
subtotal = "domain.cre.dscr"

[[statements.rows]]
kind = "spacer"

[[statements.rows]]
kind = "line"
label = "Loan proceeds"
depth = 1
categories = ["financing.debt.proceeds"]

[[statements.rows]]
kind = "line"
label = "Equity contributions"
depth = 1
categories = ["financing.equity.contribution"]

[[statements.rows]]
kind = "line"
label = "Sale proceeds"
depth = 1
categories = ["investing.disposal.reversion"]

[[statements.rows]]
kind = "line"
label = "Less: selling costs"
depth = 1
categories = ["investing.disposal.selling_costs"]
display = "positive"

# The same cash, reported annually. Grain belongs to the OUTPUT, so this
# COEXISTS with the statement above rather than replacing it: one run carries a
# per-period pro forma and an annual summary of the same ledger.
#
# The coverage row is why this is not a presentation detail. An annual DSCR is
# annual NOI over annual debt service, NOT the mean of twelve monthly ratios —
# and a column of ratios cannot be re-bucketed at all. It is recomputed from its
# re-bucketed inputs, which is why the evaluator is handed the subtotal
# DECLARATIONS rather than the published ratio series: given the values,
# averaging them would have been the obvious thing to write.
[[statements]]
id = "operating_annual"
label = "Operating statement (annual)"
grain = "annual"

[[statements.rows]]
