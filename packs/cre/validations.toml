# CRE pack domain validations.
#
# Codes are stable and are never renamed or reused (docs/08_diagnostics.md).
# E6004 is permanently retired: it validated lease-up occupancy terms that no
# longer exist.
#
# Required-term checking derived from lowering templates is handled generically
# by E5006_MISSING_CONTRACT_TERM; these are the domain constraints on top.
schema_version = 1
code_prefix = "E6"

# --- cre.lease --------------------------------------------------------------

[[validations]]
contract = "cre.lease"
code = "E6001_CRE_LEASE_MISSING_BASE_RENT"
message = "CRE lease must state a rent: 'base_rent' (per period) or 'base_rent_year' (annual)."
check = "any_term_present"
terms = ["base_rent", "base_rent_year"]

[[validations]]
contract = "cre.lease"
code = "E6002_CRE_LEASE_INVALID_TERM_RANGE"
message = "CRE lease term range is missing, invalid, or outside model timeline."
check = "term_range_within_timeline"

# Parsed as an integer, so `lease_up_months = 18.5` is rejected rather than
# silently truncated. Only checked when the term is present.
[[validations]]
contract = "cre.lease"
code = "E6003_CRE_LEASE_UP_MISSING_MONTHS"
message = "CRE lease_up requires term 'lease_up_months' > 0."
check = "term_number"
term = "lease_up_months"
number = "integer"
when = "present"
on_invalid = "report"
exclusive_min = 0.0

# --- cre.exit_cap -----------------------------------------------------------

# E6010 and E6011 are a pair: E6010 owns "absent or unparseable", E6011 owns
# "parsed but not greater than zero". `on_invalid = "skip"` keeps E6011 quiet
# when the value could not be parsed at all, so only one fires.
[[validations]]
contract = "cre.exit_cap"
code = "E6010_CRE_EXIT_MISSING_EXIT_CAP"
message = "CRE exit contract is missing required term 'exit_cap'."
check = "term_number"
term = "exit_cap"
when = "always"
on_invalid = "report"

[[validations]]
contract = "cre.exit_cap"
code = "E6011_CRE_EXIT_INVALID_EXIT_CAP"
message = "CRE exit 'exit_cap' must be greater than 0."
check = "term_number"
term = "exit_cap"
when = "present"
on_invalid = "skip"
exclusive_min = 0.0

[[validations]]
contract = "cre.exit_cap"
code = "E6012_CRE_EXIT_MISSING_NOI_VALUE"
message = "CRE exit requires either 'noi_ref' or 'noi_value'."
check = "any_term_present"
terms = ["noi_ref", "noi_value", "noi"]

# --- cre.revenue_line -------------------------------------------------------
#
# E6020 and E6021 are RETIRED with `cre.ops_revenue` (codes are never reused).
# E6020 demanded a bare `amount`; the line item takes either amount term.
# E6021 rejected a term reaching the projection tail, which a revenue line
# legitimately does so that forward NOI has revenue to read.

[[validations]]
contract = "cre.revenue_line"
code = "E6064_CRE_REVENUE_LINE_MISSING_AMOUNT"
message = "CRE revenue line must state an amount: 'amount' (per period) or 'amount_year' (annual)."
check = "any_term_present"
terms = ["amount", "amount_year"]

# --- lease-by-lease contracts ----------------------------------------------
#
# These are declared with a per-tenant suffix (`cre.lease_unit.tenant_a`), so
# they match on instance. Bounds only: the required terms themselves are
# enforced generically by E5006 from the lowering templates.

[[validations]]
contract = "cre.lease_unit"
code = "E6033_CRE_UNIT_INVALID_ESCALATION"
message = "CRE lease unit 'escalation' must be greater than or equal to -1."
check = "term_number"
term = "escalation"
when = "present"
on_invalid = "report"
min = -1.0

[[validations]]
contract = "cre.lease_unit"
code = "E6031_CRE_UNIT_INVALID_FREE_RENT"
message = "CRE lease unit 'free_rent_months' must be a whole number of months, 0 or more."
check = "term_number"
term = "free_rent_months"
number = "integer"
when = "present"
on_invalid = "report"
min = 0.0

[[validations]]
contract = "cre.lease_unit"
code = "E6032_CRE_UNIT_INVALID_PRO_RATA"
message = "CRE lease unit 'pro_rata_share' must be a fraction between 0 and 1."
check = "term_number"
term = "pro_rata_share"
when = "present"
on_invalid = "report"
min = 0.0
max = 1.0

[[validations]]
contract = "cre.rollover"
code = "E6040_CRE_ROLLOVER_INVALID_PROBABILITY"
message = "CRE rollover 'renewal_probability' must be a probability between 0 and 1."
check = "term_number"
term = "renewal_probability"
when = "present"
on_invalid = "report"
min = 0.0
max = 1.0

[[validations]]
contract = "cre.rollover"
code = "E6041_CRE_ROLLOVER_INVALID_DOWNTIME"
message = "CRE rollover 'downtime_months' must be a whole number of months, 0 or more."
check = "term_number"
term = "downtime_months"
number = "integer"
when = "present"
on_invalid = "report"
min = 0.0

# Class C pair: per-period rent versus annual rent. Summed if both are given.
[[validations]]
contract = "cre.lease"
code = "E6030_CRE_LEASE_AMBIGUOUS_RENT"
message = "CRE lease states both 'base_rent' (per period) and 'base_rent_year' (annual); they would be summed. Give one."
check = "terms_mutually_exclusive"
terms = ["base_rent", "base_rent_year"]

# --- cre.permanent_debt -----------------------------------------------------

# E6050/E6051 and E6052/E6053 are pairs on the model of E6010/E6011: the first
# owns "absent or unparseable", the second "parsed but out of range", and
# `on_invalid = "skip"` keeps the second quiet when nothing could be parsed.
[[validations]]
contract = "cre.permanent_debt"
code = "E6050_CRE_DEBT_MISSING_PRINCIPAL"
message = "CRE permanent debt is missing required term 'principal'."
check = "term_number"
term = "principal"
when = "always"
on_invalid = "report"

[[validations]]
contract = "cre.permanent_debt"
code = "E6051_CRE_DEBT_INVALID_PRINCIPAL"
message = "CRE permanent debt 'principal' must be greater than 0."
check = "term_number"
term = "principal"
when = "present"
on_invalid = "skip"
exclusive_min = 0.0

[[validations]]
contract = "cre.permanent_debt"
code = "E6052_CRE_DEBT_MISSING_RATE"
message = "CRE permanent debt is missing required term 'rate'."
check = "term_number"
term = "rate"
when = "always"
on_invalid = "report"

[[validations]]
contract = "cre.permanent_debt"
code = "E6053_CRE_DEBT_INVALID_RATE"
message = "CRE permanent debt 'rate' is a nominal annual rate and must be 0 or more."
check = "term_number"
term = "rate"
when = "present"
on_invalid = "skip"
min = 0.0

[[validations]]
contract = "cre.permanent_debt"
code = "E6054_CRE_DEBT_INVALID_AMORT"
message = "CRE permanent debt 'amort_months' must be a whole number of months greater than 0. It strikes the payment and is normally longer than the loan's term."
check = "term_number"
term = "amort_months"
number = "integer"
when = "always"
on_invalid = "report"
exclusive_min = 0.0

[[validations]]
contract = "cre.permanent_debt"
code = "E6055_CRE_DEBT_INVALID_IO_MONTHS"
message = "CRE permanent debt 'io_months' must be a whole number of months, 0 or more."
check = "term_number"
term = "io_months"
number = "integer"
when = "present"
on_invalid = "report"
min = 0.0

[[validations]]
contract = "cre.permanent_debt"
code = "E6056_CRE_DEBT_INVALID_BALLOON_FLAG"
message = "CRE permanent debt 'balloon_at_maturity' is a flag: 0 (the payoff sits in the reversion, the default) or 1 (it is paid as debt service at maturity)."
check = "term_number"
term = "balloon_at_maturity"
when = "present"
on_invalid = "report"
min = 0.0
max = 1.0

# --- cre.construction_loan --------------------------------------------------

# The commitment is the number the whole contract turns on: it is where equity
# stops and the facility starts. Zero is a legal answer (an all-debt build), so
# the bound is non-negative rather than positive.
[[validations]]
contract = "cre.construction_loan"
code = "E6057_CRE_CONSTRUCTION_INVALID_EQUITY_COMMITMENT"
message = "CRE construction loan 'equity_commitment' must be zero or greater."
check = "term_number"
term = "equity_commitment"
when = "present"
on_invalid = "skip"
min = 0.0

# A construction rate is quoted nominal and annual. 1.0 as an upper bound
# catches the commonest input error by an order of magnitude — 8 entered where
# 0.08 was meant — without ruling out a distressed mezzanine coupon.
[[validations]]
contract = "cre.construction_loan"
code = "E6058_CRE_CONSTRUCTION_INVALID_RATE"
message = "CRE construction loan 'rate' must be a nominal annual rate between 0 and 1 (0.08 for 8%)."
check = "term_number"
term = "rate"
when = "present"
on_invalid = "skip"
min = 0.0
max = 1.0

# Where in the period the money lands. Outside [0, 1] it is not a position in
# the period at all, and a value silently outside it would move every interest
# figure in the build.
[[validations]]
contract = "cre.construction_loan"
code = "E6059_CRE_CONSTRUCTION_INVALID_DRAW_ACCRUAL_FRACTION"
message = "CRE construction loan 'draw_accrual_fraction' is where in the period a draw lands and must be between 0 and 1 (0.5 = drawn ratably)."
check = "term_number"
term = "draw_accrual_fraction"
when = "present"
on_invalid = "report"
min = 0.0
max = 1.0

# The build has to sit inside the model, or the schedule silently loses draws.
[[validations]]
contract = "cre.construction_loan"
code = "E6060_CRE_CONSTRUCTION_INVALID_TERM_RANGE"
message = "CRE construction loan term must fall within the model timeline."
check = "term_range_within_timeline"

# --- cre.opex_line ----------------------------------------------------------
#
# The contract that replaced `cre.opex_line` and `cre.opex_line`. Both
# amount terms default to zero so either one alone is enough; stating neither is
# a line that silently costs nothing, which is why it is checked rather than
# defaulted away.

[[validations]]
contract = "cre.opex_line"
code = "E6061_CRE_OPEX_LINE_MISSING_AMOUNT"
message = "CRE operating expense line must state an amount: 'amount' (per period) or 'amount_year' (annual)."
check = "any_term_present"
terms = ["amount", "amount_year"]

# A share, not a percentage: 0.81, never 81. Outside [0,1] the occupancy factor
# `pct_fixed + (1 - pct_fixed) * occupancy` goes negative or exceeds the
# unoccupied cost, and the line quietly reports the wrong expense rather than
# failing.
[[validations]]
contract = "cre.opex_line"
code = "E6062_CRE_OPEX_LINE_PCT_FIXED_RANGE"
message = "CRE operating expense 'pct_fixed' is the fixed SHARE and must be between 0 and 1 (0.81, not 81)."
check = "term_number"
term = "pct_fixed"
min = 0
max = 1
when = "present"

# Occupancy is a ratio of occupied space. Zero is a fully dark building, which
# is legitimate; negative is not, and above 1 is not occupancy.
[[validations]]
contract = "cre.opex_line"
code = "E6063_CRE_OPEX_LINE_OCCUPANCY_RANGE"
message = "CRE operating expense 'occupancy' is a ratio of occupied space and must be between 0 and 1."
check = "term_number"
term = "occupancy"
min = 0
max = 1
when = "present"
