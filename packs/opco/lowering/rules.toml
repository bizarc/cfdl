# Operating-company pack.
#
# All rules are template-driven ({{contract.*}}); no hardcoded
# apply_opco_contract_terms compile path is retired. Conventions:
#   - Growth is annual-compound, stepped continuously on the MODEL clock:
#     value(t) = amount * (1 + growth)^(time.t / periods_per_year).
#     Note this is the model clock, not the contract's — a deliberate opco
#     convention, unlike cre/energy anniversary stepping off term_start.
#   - Annual quantities divide by {{model.periods_per_year}}; NOMINAL rates
#     divide too (`rate / ppy`). Effective-annual figures would take a root
#     instead — do not mix the conventions.
#   - `_months` terms mean calendar months on every calendar. As payment
#     counts they must divide into whole periods ({{whole_periods.X}}).
#   - `amount` and `da_monthly` are PER-PERIOD by definition, on whatever grid
#     the model declares; `da_year` is the annual sibling of the latter.
#   - Cross-stream contracts (working-capital policy, %-of-revenue capex,
#     cash taxes, EBITDA exit) reference base streams via series_sum and
#     evaluate in a later wave, after everything they read is finished.
#     Outflow streams appear SIGNED NEGATIVE in series, so sums over mixed
#     streams net correctly.
#   - Cash sweeps and revolver draws need per-period persistent state and
#     require a planned engine allocation pass; term debt here is
#     scheduled (IO period + level-pay amortization + balloon at maturity).
#   - No NOL carryforwards in cash taxes (losses floor at zero tax per
#     period); carryforwards need a field with a recurrence.

# ---------------------------------------------------------------------------
# Operating lines.
# ---------------------------------------------------------------------------

[[rules]]
# A DRIVER MAY VARY OVER TIME. `growth_rate` and `tax_rate` are scalars, which
# is right for a stable business and wrong for the thing intrinsic valuation
# actually does: growth decays toward the riskfree rate and the effective tax
# rate climbs toward the marginal one as a firm matures. Both are ordinary and
# neither was expressible.
#
# A varying rate arrives through the term itself —
# `growth_rate = curve_value("revenue_growth", time.date)` — the same
# mechanism credit.pool_float_io_bullet uses for a floating index. The
# `growth_curve`/`tax_rate_curve` twin terms that once selected a curve are
# gone; a term may hold the expression.
#
# THE CURVE CARRIES A PER-PERIOD RATE, which is what a modeller would write and
# what will be correct once 5.1 lands. It is deliberately NOT a cumulative
# index, even though an index would be exact today.
#
# The limitation that leaves: compounding still goes through pow(1 + g, t),
# which applies period t's rate as though it had held from the start. That is
# exact while the rate is constant and wrong once it moves — the true factor is
# the running product of each period's rate, and computing it needs a stream to
# read its own prior period (docs/13_feature_backlog.md 5.1).
#
# So a varying curve is accurate up to the period the rate first changes, and
# drifts after it. The drift is measured, not assumed:
# benchmarks/opco/damodaran_fcff/NOTES.md carries the size of it year by year
# against a published model whose growth decays. That case asserts only the
# exact window and records the rest as the delta 5.1 is expected to close.
#
# Taking the exact-today cumulative-index shape instead would have hidden the
# gap in every model that used it, and left a pack interface nobody would
# choose once the language could do better.

id = "opco_revenue_line"
contract_name = "opco.revenue_line"
stream_name = "opco.revenue.recurring{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.revenue.recurring"
amount_expr = "({{contract.amount}} + {{contract.amount_year}} / {{model.periods_per_year}}) * field.opco_revenue_growth{{contract.suffix_ident}}"
field_name = "opco_revenue_growth{{contract.suffix_ident}}"
field_init = "1"
field_next = "prev * pow(1 + {{contract.growth_rate}}, 1 / {{model.periods_per_year}})"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
# Either term satisfies E7001; the unstated one contributes zero.
amount = "0"
amount_year = "0"
growth_rate = "0"


[rules.units]
amount_year = "USD/yr"

[[rules]]
id = "opco_opex_line"
contract_name = "opco.opex_line"
stream_name = "opco.opex.recurring{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "operating.expense.opex"
amount_expr = "({{contract.amount}} + {{contract.amount_year}} / {{model.periods_per_year}}) * field.opco_opex_growth{{contract.suffix_ident}}"
field_name = "opco_opex_growth{{contract.suffix_ident}}"
field_init = "1"
field_next = "prev * pow(1 + {{contract.growth_rate}}, 1 / {{model.periods_per_year}})"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
# Either term satisfies E7001; the unstated one contributes zero.
amount = "0"
amount_year = "0"
growth_rate = "0"

# Fixed working-capital adjustment: a constant per-period outflow. For
# policy-driven working capital see opco.working_capital_policy below.
[[rules]]
id = "opco_working_capital"
contract_name = "opco.working_capital"
stream_name = "opco.working_capital.adjustment{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "operating.working_capital"
amount_expr = "{{contract.amount}}"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

# Exit at a multiple of a declared base value. The exit occurs at the
# contract's term_start.
[[rules]]
id = "opco_exit_multiple"
contract_name = "opco.exit_multiple"
stream_name = "opco.exit.value"
owner_entity = "${subject}"
direction = "inflow"
category = "investing.exit"
amount_expr = "{{contract.base_value}} * {{contract.exit_multiple}}"
# A disposal is taken at the END of the holding period, so it discounts
# the full n periods. `on_date` alone would settle it at the period's
# open — one month early on a monthly model, a whole year on an annual.
schedule_kind = "on_date"
schedule_placement = "end"
schedule_from = "{{contract.term_start}}"
schedule_to = ""

# ---------------------------------------------------------------------------
# opco.working_capital_policy — DSO/DPO/DIO-driven working capital.
# WC(t) = annualized revenue * ar_days/365
#       + annualized opex * inv_days/365   (inventory carried on cost base)
#       - annualized opex * ap_days/365    (payables funded by suppliers)
# Annualized run rates are 12x the current month's base streams (opex is
# signed negative in series, hence the sign flip below). The stream books
# the FULL initial WC in the first period, the period-over-period change
# afterwards, and (optionally) releases the ending balance in the final
# period (release_at_end = 1 makes the last amount negative, i.e. cash in).
# ---------------------------------------------------------------------------

[[rules]]
id = "opco_working_capital_policy"
contract_name = "opco.working_capital_policy"
stream_name = "opco.working_capital.adjustment{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "operating.working_capital"
amount_expr = "({{model.periods_per_year}} / 365.0) * ((series_sum(\"opco.revenue.recurring.*\", time.t, time.t)) * {{contract.ar_days}} - (series_sum(\"opco.opex.recurring.*\", time.t, time.t)) * ({{contract.inv_days}} - {{contract.ap_days}})) - if({{time.elapsed_periods}} == 0, 0, ({{model.periods_per_year}} / 365.0) * ((series_sum(\"opco.revenue.recurring.*\", time.t - 1, time.t - 1)) * {{contract.ar_days}} - (series_sum(\"opco.opex.recurring.*\", time.t - 1, time.t - 1)) * ({{contract.inv_days}} - {{contract.ap_days}}))) - if({{contract.release_at_end}} == 1 and {{time.periods_to_term_end}} == 0, ({{model.periods_per_year}} / 365.0) * ((series_sum(\"opco.revenue.recurring.*\", time.t, time.t)) * {{contract.ar_days}} - (series_sum(\"opco.opex.recurring.*\", time.t, time.t)) * ({{contract.inv_days}} - {{contract.ap_days}})), 0)"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
ar_days = "0"
ap_days = "0"
inv_days = "0"
release_at_end = "0"

# ---------------------------------------------------------------------------
# opco.capex_line — fixed capex (with growth) plus %-of-revenue capex.
# ---------------------------------------------------------------------------

[[rules]]
id = "opco_capex_line"
contract_name = "opco.capex_line"
stream_name = "opco.capex.line{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "investing.capital.capex"
amount_expr = "({{contract.amount}} + {{contract.amount_year}} / {{model.periods_per_year}}) * field.opco_capex_growth{{contract.suffix_ident}} + {{contract.pct_of_revenue}} * (series_sum(\"opco.revenue.recurring.*\", time.t, time.t))"
field_name = "opco_capex_growth{{contract.suffix_ident}}"
field_init = "1"
field_next = "prev * pow(1 + {{contract.growth_rate}}, 1 / {{model.periods_per_year}})"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
amount_year = "0"
amount = "0"
growth_rate = "0"
pct_of_revenue = "0"

# ---------------------------------------------------------------------------
# opco.term_debt — scheduled term loan: optional IO period, then level-pay
# amortization over amort_months, balloon of the remaining balance at the
# contract's term_end. Payment index k = p - io_months + 1 (1-based, p =
# months since term_start). Remaining balance after k payments is
# -fv(r/12, k, pmt(r/12, amort_months, principal), principal).
# Cash sweeps need H3 state and are not modeled here.
# ---------------------------------------------------------------------------

[[rules]]
id = "opco_term_debt_proceeds"
contract_name = "opco.term_debt"
stream_name = "opco.debt.proceeds{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "financing.debt_proceeds"
amount_expr = "{{contract.principal}} * {{contract.funded_at_close}}"
schedule_kind = "on_date"
schedule_from = "{{contract.term_start}}"
schedule_to = ""

[rules.defaults]
funded_at_close = "1"

[[rules]]
id = "opco_term_debt_interest"
contract_name = "opco.term_debt"
stream_name = "opco.debt.interest{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "financing.interest"
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.io_months}}, {{contract.principal}} * ({{contract.rate}} / {{model.accrual_divisor}}), -ipmt({{contract.rate}} / {{model.accrual_divisor}}, {{time.elapsed_periods}} - {{whole_periods.io_months}} + 1, {{whole_periods.amort_months}}, {{contract.principal}}))"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
io_months = "0"

[[rules]]
id = "opco_term_debt_principal"
contract_name = "opco.term_debt"
stream_name = "opco.debt.principal{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "financing.debt_principal"
# Scheduled amortization plus the balloon (remaining balance) at term_end.
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.io_months}}, 0, -ppmt({{contract.rate}} / {{model.accrual_divisor}}, {{time.elapsed_periods}} - {{whole_periods.io_months}} + 1, {{whole_periods.amort_months}}, {{contract.principal}})) + if({{time.periods_to_term_end}} == 0, -fv({{contract.rate}} / {{model.accrual_divisor}}, {{time.elapsed_periods}} - {{whole_periods.io_months}} + 1, pmt({{contract.rate}} / {{model.accrual_divisor}}, {{whole_periods.amort_months}}, {{contract.principal}}), {{contract.principal}}), 0)"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
io_months = "0"

# ---------------------------------------------------------------------------
# opco.cash_taxes — cash taxes on (EBITDA - D&A - interest), floored at 0
# per period (no NOL carryforwards; needs H3 state). Revenue/opex/interest
# come from base streams (opex and interest are signed negative); D&A is
# a declared deduction schedule, not a cash stream.
# ---------------------------------------------------------------------------

[[rules]]
id = "opco_cash_taxes"
contract_name = "opco.cash_taxes"
stream_name = "opco.taxes.cash{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "operating.tax"
amount_expr = "max(0, {{contract.tax_rate}} * (series_sum(\"opco.revenue.recurring.*\", time.t, time.t) + series_sum(\"opco.opex.recurring.*\", time.t, time.t) + series_sum(\"opco.debt.interest.*\", time.t, time.t) - ({{contract.da_monthly}} + {{contract.da_year}} / {{model.periods_per_year}}) * pow(1 + {{contract.da_growth}}, time.t / {{model.periods_per_year}})))"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
da_monthly = "0"
da_year = "0"
da_growth = "0"
# Defaulted so a model may state the CURVE instead. Stating neither is
# E7010 rather than a silent zero-tax model.
tax_rate = "0"

# ---------------------------------------------------------------------------
# opco.exit_ebitda — sale at a multiple of trailing-12-month EBITDA derived
# from the modeled streams (opex signed negative nets out), net of selling
# costs. Exit occurs at term_start.
# ---------------------------------------------------------------------------

[[rules]]
id = "opco_exit_ebitda"
contract_name = "opco.exit_ebitda"
stream_name = "opco.exit.value"
owner_entity = "${subject}"
direction = "inflow"
category = "investing.exit"
amount_expr = "{{contract.exit_multiple}} * (series_sum(\"opco.revenue.recurring.*\", time.t - {{model.periods_per_year}} + 1, time.t) + series_sum(\"opco.opex.recurring.*\", time.t - {{model.periods_per_year}} + 1, time.t))"
# A disposal is taken at the END of the holding period, so it discounts
# the full n periods. `on_date` alone would settle it at the period's
# open — one month early on a monthly model, a whole year on an annual.
schedule_kind = "on_date"
schedule_placement = "end"
schedule_from = "{{contract.term_start}}"
schedule_to = ""

[rules.defaults]
selling_costs = "0"

[[rules]]
id = "opco_exit_ebitda_selling_costs"
contract_name = "opco.exit_ebitda"
stream_name = "opco.exit.selling_costs"
owner_entity = "${subject}"
direction = "outflow"
category = "investing.selling_costs"
# The identical trailing-EBITDA window, times the cost rate; gross less costs
# is the old net, so net cash flow is unchanged.
amount_expr = "{{contract.exit_multiple}} * (series_sum(\"opco.revenue.recurring.*\", time.t - {{model.periods_per_year}} + 1, time.t) + series_sum(\"opco.opex.recurring.*\", time.t - {{model.periods_per_year}} + 1, time.t)) * {{contract.selling_costs}}"
schedule_kind = "on_date"
schedule_placement = "end"
schedule_from = "{{contract.term_start}}"
schedule_to = ""

[rules.defaults]
selling_costs = "0"

# ---------------------------------------------------------------------------
# opco.acquisition — purchase price paid at term_start (the equity check
# when paired with opco.term_debt proceeds at the same date).
# ---------------------------------------------------------------------------

[[rules]]
id = "opco_acquisition_price"
contract_name = "opco.acquisition"
stream_name = "opco.acquisition.price{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "investing.acquisition"
amount_expr = "{{contract.price}}"
schedule_kind = "on_date"
schedule_from = "{{contract.term_start}}"
schedule_to = ""

# ---------------------------------------------------------------------------
# opco.exit_perpetuity — terminal value as a growing perpetuity:
#
#   TV = base_value * (1 + growth_rate) / (discount_rate - growth_rate)
#
# The Gordon form, and the terminal every intrinsic valuation ends with. The
# pack could previously only express a MULTIPLE of something (exit_multiple on
# a stated base, exit_ebitda on trailing EBITDA), so the largest single
# component of value in a DCF had no contract at all.
#
# `base_value` is the flow the perpetuity is struck on, ALREADY at the terminal
# period and BEFORE the (1 + g) step — the contract applies that step, because
# the convention is to value the next period's flow. What the flow is —
# dividends, free cash flow to firm, free cash flow to equity — is deliberately
# not the contract's business, and `discount_rate` must be the matching rate:
# a cost of equity against a dividend, a cost of capital against FCFF. Mixing
# them is a real modeling error the pack cannot detect.
#
# `discount_rate` IS A TERM, not the run's NPV rate. That is deliberate rather
# than a limitation: a terminal cost of capital legitimately differs from the
# near-term rate — it is the rate for a business that has reached steady state
# — and the sources that publish these models state it explicitly, usually
# built from their own CAPM inputs. The run's `annual_discount_rate` discounts
# the resulting cash flow; this rate capitalizes it. They are different numbers
# doing different jobs, and E7025 guards the one that must hold: r > g.
#
# NO `mid`. benchmarks/opco/banker_dcf_conventions Finding 6 established that
# the mid-period convention applies to FLOWS and not to a terminal value: a
# terminal value is a price struck at a point in time, so it discounts whole.
# Applying mid to it as well overstates every cell by about 5%.
# ---------------------------------------------------------------------------

[[rules]]
id = "opco_exit_perpetuity"
contract_name = "opco.exit_perpetuity"
stream_name = "opco.exit.value{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "investing.exit"
amount_expr = "{{contract.base_value}} * (1 + {{contract.growth_rate}}) / ({{contract.discount_rate}} - {{contract.growth_rate}})"
# A disposal is taken at the END of the holding period, so it discounts
# the full n periods. `on_date` alone would settle it at the period's
# open — one month early on a monthly model, a whole year on an annual.
schedule_kind = "on_date"
schedule_placement = "end"
schedule_from = "{{contract.term_start}}"
schedule_to = ""

[rules.defaults]
selling_costs = "0"


[[rules]]
id = "opco_exit_perpetuity_selling_costs"
contract_name = "opco.exit_perpetuity"
stream_name = "opco.exit.selling_costs{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "investing.selling_costs"
amount_expr = "{{contract.base_value}} * (1 + {{contract.growth_rate}}) / ({{contract.discount_rate}} - {{contract.growth_rate}}) * {{contract.selling_costs}}"
schedule_kind = "on_date"
schedule_placement = "end"
schedule_from = "{{contract.term_start}}"
schedule_to = ""

[rules.defaults]
selling_costs = "0"
