# OpCo pack domain validations.
#
# Codes are stable and are never renamed or reused (docs/08_diagnostics.md).
schema_version = 1
code_prefix = "E7"

# --- operating lines --------------------------------------------------------

# `when = "always"` with no bounds: an absent or unparseable amount both fail.
[[validations]]
contracts = ["opco.revenue_line", "opco.opex_line"]
code = "E7001_OPCO_LINE_MISSING_AMOUNT"
message = "OpCo line is missing required numeric term 'amount'."
check = "term_number"
term = "amount"
when = "always"
on_invalid = "report"

[[validations]]
contracts = ["opco.revenue_line", "opco.opex_line"]
code = "E7002_OPCO_LINE_INVALID_SCHEDULE"
message = "OpCo line term range is missing, invalid, or outside model timeline."
check = "term_range_within_timeline"

# Optional term: only checked when supplied.
[[validations]]
contracts = ["opco.revenue_line", "opco.opex_line"]
code = "E7003_OPCO_LINE_INVALID_GROWTH"
message = "OpCo line has invalid 'growth_rate' term."
check = "term_number"
term = "growth_rate"
when = "present"
on_invalid = "report"

# --- working capital --------------------------------------------------------

[[validations]]
contract = "opco.working_capital"
code = "E7010_OPCO_WC_MISSING_AMOUNT_OR_RULE"
message = "OpCo working capital requires term 'amount' or a supported rule expression."
check = "term_number"
term = "amount"
when = "always"
on_invalid = "report"

[[validations]]
contract = "opco.working_capital"
code = "E7011_OPCO_WC_INVALID_SCHEDULE"
message = "OpCo working capital term range is missing, invalid, or outside model timeline."
check = "term_range_within_timeline"

# --- exit at a multiple of a declared base value ----------------------------

# Pair, as with the CRE exit cap: E7020 owns absent-or-unparseable, E7021 owns
# parsed-but-not-positive.
[[validations]]
contract = "opco.exit_multiple"
code = "E7020_OPCO_EXIT_MISSING_MULTIPLE"
message = "OpCo exit is missing required term 'exit_multiple'."
check = "term_number"
term = "exit_multiple"
when = "always"
on_invalid = "report"

[[validations]]
contract = "opco.exit_multiple"
code = "E7021_OPCO_EXIT_INVALID_MULTIPLE"
message = "OpCo exit 'exit_multiple' must be greater than 0."
check = "term_number"
term = "exit_multiple"
when = "present"
on_invalid = "skip"
exclusive_min = 0.0

[[validations]]
contract = "opco.exit_multiple"
code = "E7022_OPCO_EXIT_MISSING_BASE_VALUE"
message = "OpCo exit requires numeric term 'base_value'."
check = "term_number"
term = "base_value"
when = "always"
on_invalid = "report"

[[validations]]
contract = "opco.exit_multiple"
code = "E7023_OPCO_EXIT_INVALID_SCHEDULE"
message = "OpCo exit term range is missing, invalid, or outside model timeline (exit occurs at term_start)."
check = "term_range_within_timeline"

# --- trailing-EBITDA exit ---------------------------------------------------

[[validations]]
contract = "opco.exit_ebitda"
code = "E7024_OPCO_EXIT_EBITDA_INVALID_MULTIPLE"
message = "OpCo EBITDA exit requires 'exit_multiple' greater than 0."
check = "term_number"
term = "exit_multiple"
when = "always"
on_invalid = "report"
exclusive_min = 0.0

# --- term debt --------------------------------------------------------------

[[validations]]
contract = "opco.term_debt"
code = "E7030_OPCO_DEBT_INVALID_AMORT"
message = "OpCo term debt requires 'amort_months' greater than 0."
check = "term_number"
term = "amort_months"
when = "always"
on_invalid = "report"
exclusive_min = 0.0

[[validations]]
contract = "opco.term_debt"
code = "E7031_OPCO_DEBT_INVALID_RATE"
message = "OpCo term debt requires a non-negative 'rate'."
check = "term_number"
term = "rate"
when = "always"
on_invalid = "report"
min = 0.0
