# OpCo pack domain validations.
#
# Codes are stable and are never renamed or reused (docs/08_diagnostics.md).
schema_version = 1
code_prefix = "E7"

# --- operating lines --------------------------------------------------------

# A line must state its size, as either a per-period `amount` or an annual
# `amount_year`. The pair exists because `amount` is per-period by definition,
# so the same number means different economics on each calendar; `amount_year`
# is the grid-independent way to say it. Stating both sums them, which is
# almost never intended but is not currently rejected.
[[validations]]
contracts = ["opco.revenue_line", "opco.opex_line"]
code = "E7001_OPCO_LINE_MISSING_AMOUNT"
message = "OpCo line must state a size: 'amount' (per period) or 'amount_year' (annual)."
check = "any_term_present"
terms = ["amount", "amount_year"]
when = "always"
on_invalid = "report"

[[validations]]
contracts = ["opco.revenue_line", "opco.opex_line"]
code = "E7002_OPCO_LINE_INVALID_SCHEDULE"
message = "OpCo line term range is missing, invalid, or outside model timeline."
check = "term_range_within_timeline"

# Optional term: only checked when supplied.
[[validations]]
contracts = ["opco.revenue_line", "opco.opex_line"]
code = "E7003_OPCO_LINE_INVALID_GROWTH"
message = "OpCo line has invalid 'growth_rate' term."
check = "term_number"
term = "growth_rate"
when = "present"
on_invalid = "report"

# --- working capital --------------------------------------------------------

[[validations]]
contract = "opco.working_capital"
code = "E7013_OPCO_WC_MISSING_AMOUNT_OR_RULE"
message = "OpCo working capital requires term 'amount' or a supported rule expression."
check = "term_number"
term = "amount"
when = "always"
on_invalid = "report"

[[validations]]
contract = "opco.working_capital"
code = "E7014_OPCO_WC_INVALID_SCHEDULE"
message = "OpCo working capital term range is missing, invalid, or outside model timeline."
check = "term_range_within_timeline"

# --- exit at a multiple of a declared base value ----------------------------

# Pair, as with the CRE exit cap: E7020 owns absent-or-unparseable, E7021 owns
# parsed-but-not-positive.
[[validations]]
contract = "opco.exit_multiple"
code = "E7020_OPCO_EXIT_MISSING_MULTIPLE"
message = "OpCo exit is missing required term 'multiple'."
check = "term_number"
term = "multiple"
when = "always"
on_invalid = "report"

[[validations]]
contract = "opco.exit_multiple"
code = "E7021_OPCO_EXIT_INVALID_MULTIPLE"
message = "OpCo exit 'multiple' must be greater than 0."
check = "term_number"
term = "multiple"
when = "present"
on_invalid = "skip"
exclusive_min = 0.0

[[validations]]
contract = "opco.exit_multiple"
code = "E7022_OPCO_EXIT_MISSING_BASE_VALUE"
message = "OpCo exit requires numeric term 'base'."
check = "term_number"
term = "base"
when = "always"
on_invalid = "report"

[[validations]]
contract = "opco.exit_multiple"
code = "E7023_OPCO_EXIT_INVALID_SCHEDULE"
message = "OpCo exit term range is missing, invalid, or outside model timeline (exit occurs at term_start)."
check = "term_range_within_timeline"

# --- trailing-EBITDA exit ---------------------------------------------------

[[validations]]
contract = "opco.exit_ebitda"
code = "E7024_OPCO_EXIT_EBITDA_INVALID_MULTIPLE"
message = "OpCo EBITDA exit requires 'multiple' greater than 0."
check = "term_number"
term = "multiple"
when = "always"
on_invalid = "report"
exclusive_min = 0.0

# --- term debt --------------------------------------------------------------

[[validations]]
contract = "opco.term_debt"
code = "E7030_OPCO_DEBT_INVALID_AMORT"
message = "OpCo term debt requires 'amortization_months' greater than 0."
check = "term_number"
term = "amortization_months"
when = "always"
on_invalid = "report"
exclusive_min = 0.0

[[validations]]
contract = "opco.term_debt"
code = "E7031_OPCO_DEBT_INVALID_RATE"
message = "OpCo term debt requires a non-negative 'interest_rate'."
check = "term_number"
term = "interest_rate"
when = "always"
on_invalid = "report"
min = 0.0

# Class C pairs: the same figure in two units. A rule sums both with zero
# defaults because templates have no conditional, so stating both would
# silently add them.
[[validations]]
contracts = ["opco.revenue_line", "opco.opex_line", "opco.capex_line"]
code = "E7010_OPCO_LINE_AMBIGUOUS_AMOUNT"
message = "OpCo line states both 'amount' (per period) and 'amount_year' (annual); they would be summed. Give one."
check = "terms_mutually_exclusive"
terms = ["amount", "amount_year"]

[[validations]]
contract = "opco.cash_taxes"
code = "E7011_OPCO_TAXES_AMBIGUOUS_DA"
message = "OpCo cash taxes state both 'da_monthly' (per period) and 'da_year' (annual); they would be summed. Give one."
check = "terms_mutually_exclusive"
terms = ["da_monthly", "da_year"]

# A tax rate may be a scalar or a curve, but a cash-taxes contract that states
# neither would silently model a business that pays no tax. The default on
# `tax_rate` exists so the curve can stand alone, not so it can be omitted.
[[validations]]
contracts = ["opco.cash_taxes"]
code = "E7012_OPCO_TAXES_MISSING_RATE"
message = "OpCo cash taxes must state a rate: 'tax_rate' (scalar) or 'tax_rate_curve' (a model curve name)."
check = "any_term_present"
terms = ["tax_rate", "tax_rate_curve"]
when = "always"
on_invalid = "report"


# --- opco.exit_perpetuity ---------------------------------------------------

# The one check that cannot be expressed as a range. A perpetuity with r <= g
# is not a large number, it is a meaningless one: the denominator goes to zero
# and then negative, so the contract would return a huge positive value and
# then a negative one, with nothing to say the model had stopped meaning
# anything. Guarded first because the other checks would still pass.
[[validations]]
contract = "opco.exit_perpetuity"
code = "E7025_OPCO_PERPETUITY_RATE_NOT_ABOVE_GROWTH"
message = "OpCo exit perpetuity needs 'discount_rate' strictly greater than 'growth_rate'. A perpetuity growing at or above its discount rate has no finite value."
check = "term_compare"
left = "discount_rate"
op = "gt"
right = "growth_rate"

[[validations]]
contract = "opco.exit_perpetuity"
code = "E7026_OPCO_PERPETUITY_MISSING_BASE_VALUE"
message = "OpCo exit perpetuity is missing required term 'base' — the terminal-period flow the perpetuity is struck on."
check = "term_number"
term = "base"
when = "always"
on_invalid = "report"

[[validations]]
contract = "opco.exit_perpetuity"
code = "E7027_OPCO_PERPETUITY_MISSING_DISCOUNT_RATE"
message = "OpCo exit perpetuity is missing required term 'discount_rate'. This is the terminal capitalization rate and is stated on the contract, not taken from the run's discount rate."
check = "term_number"
term = "discount_rate"
when = "always"
on_invalid = "report"

[[validations]]
contract = "opco.exit_perpetuity"
code = "E7028_OPCO_PERPETUITY_MISSING_GROWTH"
message = "OpCo exit perpetuity is missing required term 'growth_rate'. State 0 for a flat perpetuity."
check = "term_number"
term = "growth_rate"
when = "always"
on_invalid = "report"

[[validations]]
contract = "opco.exit_perpetuity"
code = "E7029_OPCO_PERPETUITY_INVALID_SELLING_COSTS"
message = "OpCo exit perpetuity 'selling_costs' is a fraction between 0 and 1."
check = "term_number"
term = "selling_costs"
when = "present"
on_invalid = "report"
min = 0.0
max = 1.0
