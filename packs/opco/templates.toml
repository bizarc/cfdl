kind = "contract"
body = """
contract opco.term_debt {
  term ${term_start}..${term_end}
  terms {
    principal = ${principal}
    interest_rate = ${interest_rate}
    amortization_months = ${amortization_months}
    interest_only_months = ${interest_only_months}
  }
}
"""
[templates.defaults]
term_start = "2026-01"
term_end = "2031-12"
