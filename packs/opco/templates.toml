# OpCo contract templates — the conventional starting set for an operating
# business, offered by the editor as snippets and assembled into starting
# models by the MCP `skeleton` tool. Defaults are the values the benchmark
# suite validates (benchmarks/opco/lbo_buyout), not measurements — a real
# deal states its own.
#
# `${key}` placeholders resolve from the request, then from [templates.defaults].

[[templates]]
id = "opco.revenue_line"
label = "Revenue line with growth"
kind = "contract"
body = """
contract opco.revenue_line {
  term ${term_start}..${term_end}
  terms {
    amount = ${amount}
    growth_rate = ${growth_rate}
  }
}
"""
[templates.defaults]
term_start = "2026-01"
term_end = "2030-12"
amount = "1000000"
growth_rate = "0.06"

[[templates]]
id = "opco.opex_line"
label = "Operating expense line with growth"
kind = "contract"
body = """
contract opco.opex_line {
  term ${term_start}..${term_end}
  terms {
    amount = ${amount}
