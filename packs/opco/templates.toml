[[templates]]
id = "opco.term_debt"
label = "Term loan — IO then amortizing"
kind = "contract"
body = """
contract opco.term_debt {
  term ${term_start}..${term_end}
  terms {
    principal = ${principal}
    rate = ${rate}
    io_months = ${io_months}
    amort_months = ${amort_months}
  }
}
"""
[templates.defaults]
term_start = "2026-01"
term_end = "2030-12"
principal = "21000000"
rate = "0.085"
io_months = "12"
amort_months = "84"

[[templates]]
id = "opco.cash_taxes"
