# OpCo per-period subtotals and the free cash flow statement.
#
# Shaped like the FCF BUILD-UP a banker or an equity analyst writes: revenue to
# EBITDA, EBITDA to unlevered free cash flow through tax, working capital and
# capex, then the financing leg down to levered free cash flow.
#
# That order is the point. `benchmarks/opco/banker_dcf_conventions` reconciles a
# source that publishes the build-up line by line, and the model carries six
# opaque UFCF streams against it — the statement is where the intermediate lines
# become visible rather than implied.
#
# Order is dependency order.

[[subtotals]]
id = "domain.opco.revenue_periodic"
kind = "money"
op = "sum"
categories = ["operating.revenue.*"]
formula = "sum(operating.revenue.*)"

[[subtotals]]
id = "domain.opco.opex_periodic"
kind = "money"
op = "negated_sum"
categories = ["operating.expense.*"]
formula = "-sum(operating.expense.*)"

# Revenue less cash operating cost. Tax and working capital are excluded — both
# sit below EBITDA in every convention this pack reconciles against.
[[subtotals]]
id = "domain.opco.ebitda_periodic"
kind = "money"
op = "sum"
categories = ["operating.revenue.*", "operating.expense.*"]
formula = "sum(operating.revenue.*, operating.expense.*)"

# Unlevered free cash flow: everything operating, less capital expenditure, and
# BEFORE any financing. That exclusion is what "unlevered" means, and it is why
# this cannot simply fold `operating.* + investing.*` — an acquisition or an
# exit is investing and is not part of the operating asset's free cash flow.
[[subtotals]]
id = "domain.opco.ufcf_periodic"
kind = "money"
op = "sum"
categories = ["operating.*", "investing.capital.capex"]
formula = "sum(operating.*, investing.capital.capex)"

# What the debt costs each period, as an amount paid.
[[subtotals]]
id = "domain.opco.debt_service_periodic"
kind = "money"
op = "negated_sum"
categories = ["financing.interest", "financing.debt_principal"]
formula = "-sum(financing.interest, financing.debt_principal)"

# Levered free cash flow: UFCF after the whole financing section, draws
# included. The streams are signed, so adding `financing.*` subtracts interest
# and principal and adds proceeds without this file restating the signs.
[[subtotals]]
id = "domain.opco.lfcf_periodic"
kind = "money"
op = "sum"
subtotals = ["domain.opco.ufcf_periodic"]
categories = ["financing.*"]
formula = "domain.opco.ufcf_periodic + sum(financing.*)"

# Coverage, per period. `domain.opco.fcf_to_debt_service` in metrics.toml is
# this ratio over the whole life; a lender tests it every period.
[[subtotals]]
id = "domain.opco.debt_service_coverage"
kind = "number"
op = "ratio"
numerator = "domain.opco.ufcf_periodic"
denominator = "domain.opco.debt_service_periodic"
formula = "domain.opco.ufcf_periodic / domain.opco.debt_service_periodic"

