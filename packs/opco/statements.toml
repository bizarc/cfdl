# The statement of cash flows, by activity — ASC 230-10-45 / IAS 7.10.
#
# The three sections ARE CFDL's category roots, so this view is the language's
# own structure reported directly: every category the pack declares belongs to
# exactly one section by construction, and the completeness gate checks it.
[[statements]]
id = "cash_flows"
label = "Statement of cash flows"

[[statements.rows]]
kind = "line"
label = "Revenue"
depth = 1
categories = ["operating.revenue.recurring"]

[[statements.rows]]
kind = "line"
label = "Operating expenses"
depth = 1
categories = ["operating.expense.opex"]
display = "positive"

[[statements.rows]]
kind = "line"
label = "Income taxes paid"
depth = 1
categories = ["operating.tax"]
display = "positive"

[[statements.rows]]
kind = "line"
label = "Change in net working capital"
depth = 1
categories = ["operating.working_capital"]

[[statements.rows]]
kind = "subtotal"
label = "Net cash from operating activities"
depth = 0
subtotal = "domain.opco.net_cash_from_operations"

[[statements.rows]]
kind = "spacer"

[[statements.rows]]
kind = "line"
label = "Purchases of property and equipment"
depth = 1
categories = ["investing.capital.capex"]
display = "positive"

[[statements.rows]]
kind = "line"
label = "Acquisitions, net of cash acquired"
depth = 1
categories = ["investing.acquisition"]
display = "positive"

[[statements.rows]]
kind = "line"
label = "Proceeds from disposals"
depth = 1
categories = ["investing.exit"]

[[statements.rows]]
kind = "subtotal"
label = "Net cash from investing activities"
depth = 0
subtotal = "domain.opco.net_cash_from_investing"

[[statements.rows]]
kind = "spacer"

[[statements.rows]]
kind = "line"
label = "Proceeds from borrowings"
depth = 1
categories = ["financing.debt_proceeds"]

[[statements.rows]]
kind = "line"
label = "Repayment of borrowings"
depth = 1
categories = ["financing.debt_principal"]
display = "positive"

[[statements.rows]]
kind = "line"
label = "Interest paid"
depth = 1
categories = ["financing.interest"]
display = "positive"

[[statements.rows]]
kind = "subtotal"
label = "Net cash from financing activities"
depth = 0
subtotal = "domain.opco.net_cash_from_financing"
