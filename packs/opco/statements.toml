# ---------------------------------------------------------------------------
# SUB-INDUSTRY VIEWS.
#
# The same cash, read by different mandates.
#
# A NOTE ON WHAT IS AND IS NOT STANDARD, because the two views below are not
# equally well grounded and the file should say so.
#
# "Cash flow available for debt service" is a defined term in credit agreements
# and project finance documents, and the coverage ratio struck from it is a
# tested covenant. That view is grounded.
#
# The second view is the STATEMENT OF CASH FLOWS as ASC 230 / IAS 7 define it —
# net cash from operating, investing and financing activities. Those are the
# three sections CFDL's own category roots already are, so this view is the
# language's structure reported directly, and it is a real reporting standard.
#
# It deliberately does NOT use "gross burn" and "net burn". Those are common
# venture vernacular but they are not defined in any accounting standard, and
# naming a subtotal after a convention nobody codified would put a term in the
# output that no source can be pointed at.

[[subtotals]]
id = "domain.opco.cfads"
kind = "money"
op = "sum"
categories = ["operating.*", "investing.capital.capex"]
formula = "cash flow available for debt service"

# ASC 230-10-45 / IAS 7.10: the operating section of a statement of cash flows.
[[subtotals]]
id = "domain.opco.net_cash_from_operations"
kind = "money"
op = "sum"
categories = ["operating.*"]
formula = "net cash provided by (used in) operating activities"

[[subtotals]]
id = "domain.opco.net_cash_from_investing"
kind = "money"
op = "sum"
categories = ["investing.*"]
formula = "net cash provided by (used in) investing activities"

[[subtotals]]
id = "domain.opco.net_cash_from_financing"
kind = "money"
op = "sum"
categories = ["financing.*"]
formula = "net cash provided by (used in) financing activities"

# Sponsor / leveraged buyout view.
[[statements]]
id = "sponsor"
label = "Sponsor cash flow"

[[statements.rows]]
kind = "line"
label = "Acquisition of the platform"
depth = 1
categories = ["investing.acquisition"]
