# OpCo pack ontology — the vocabulary of things a model may declare.
#
# See packs/energy/ontology/types.toml for what the four families mean.
#
# WHY AN OPERATING BUSINESS IS A FINANCIAL ASSET. What a model values is not
# the machines — it is the claim on a going concern's cash. The machines are
# real assets the business happens to own, and a model that needed them would
# declare them separately. So `Enterprise` is `financial`: it is an equity
# claim, which is also why it carries a capital structure and the real assets
# beneath it usually do not appear at all.
#
# HIERARCHY IS OPTIONAL. A group can be one enterprise or a parent with
# segments; a roll-up can be one business or the platform plus its
# acquisitions. The modeller chooses the grain.

[pack]
ontology_id = "opco"
version = "0.1.0"

# ---------------------------------------------------------------------------
# Assets
# ---------------------------------------------------------------------------

[[entities]]
type_id = "OpCo.Asset.Enterprise"
family = "asset"
class = "financial"
refines = "Asset.Financial"
description = "A going concern valued on its cash flows."

[[entities.fields]]
name = "industry"
field_type = "string"
required = false

[[entities.fields]]
name = "fiscal_year_end"
field_type = "string"
required = false
description = "Month of the fiscal year end. Matters because a valuation date that is not a year end produces a stub period."

[[entities]]
type_id = "OpCo.Asset.BusinessSegment"
family = "asset"
class = "financial"
refines = "Asset.Financial"
description = "A division modeled separately. Use only when the grain is the segment; a consolidated model needs none."

[[entities]]
type_id = "OpCo.Asset.EquityInterest"
family = "asset"
class = "financial"
refines = "Asset.Financial"
description = "A claim on the enterprise's equity — sponsor, rollover, preferred, or an option pool."

[[entities.fields]]
name = "interest_type"
field_type = "string"
required = false
description = "sponsor | management_rollover | preferred | option_pool | common"

[[entities.fields]]
name = "shares"
field_type = "decimal"
required = false
unit = "shares"

# Intangibles are the third class, and this is where they arise: a royalty
# stream or a license is neither a real thing nor a claim on a balance sheet.
[[entities]]
type_id = "OpCo.Asset.IntangibleRight"
family = "asset"
class = "intangible"
refines = "Asset.Intangible"
description = "A royalty, license or contractual right valued on its own cash flows."

[[entities.fields]]
name = "right_type"
field_type = "string"
required = false
description = "royalty | license | franchise | patent"

[[entities.fields]]
name = "expiry"
field_type = "date"
required = false

# ---------------------------------------------------------------------------
# Parties
# ---------------------------------------------------------------------------

[[entities]]
type_id = "OpCo.Party.Sponsor"
family = "party"
refines = "Party"
description = "Acquires and controls the business."

[[entities.fields]]
name = "name"
field_type = "string"
required = false

[[entities]]
type_id = "OpCo.Party.Management"
family = "party"
refines = "Party"
description = "Runs the business; commonly rolls equity and holds options."

[[entities.fields]]
name = "name"
field_type = "string"
required = false

[[entities]]
type_id = "OpCo.Party.Lender"
family = "party"
refines = "Party"

[[entities.fields]]
name = "name"
field_type = "string"
required = false

[[entities.fields]]
name = "tranche_role"
field_type = "string"
required = false
description = "revolver | term_loan | senior_notes | subordinated_notes"

[[entities]]
type_id = "OpCo.Party.Shareholder"
family = "party"
refines = "Party"

[[entities.fields]]
name = "name"
field_type = "string"
required = false

[[entities]]
type_id = "OpCo.Party.Counterparty"
family = "party"
refines = "Party"
description = "A customer or supplier named when a contract depends on one."

[[entities.fields]]
name = "name"
field_type = "string"
required = false

# ---------------------------------------------------------------------------
# Lifecycles
# ---------------------------------------------------------------------------

# No lifecycle.
#
# An enterprise has no regime a model gates behavior on. The machine that
# stood here encoded two orthogonal concerns — a transaction process
# (under_offer -> acquired) and a capital structure (levered -> deleveraged)
# — and an entity is in exactly one state, so the normal condition of every
# LBO, levered AND operating, could not be said. Its declared path also left
# `operating` at close, so a stream gated `active in state "operating"` would
# have stopped paying the moment the deal funded.
#
# A transaction closing is a one-time occurrence: an event with a no-return
# topology. Leverage is a magnitude: a field. Neither is a regime.
#
# What DOES warrant a machine here is the financing, not the enterprise —
# compliant / in_breach / forborne / accelerated, a regime that returns and
# gates cash. It is not declared until a case forces it (`docs/36` §5.1).

# ---------------------------------------------------------------------------
# Contracts
# ---------------------------------------------------------------------------

[[contracts]]
type_id = "OpCo.Contract.RevenueLine"
refines = "Contract.Revenue"
contract_name = "opco.revenue_line"
subject_family = "asset"
parties = ["owner"]

[[contracts]]
type_id = "OpCo.Contract.OperatingExpenseLine"
refines = "Contract.Expense"
contract_name = "opco.opex_line"
subject_family = "asset"
parties = ["owner"]

[[contracts]]
type_id = "OpCo.Contract.CapexLine"
refines = "Contract.CapitalExpenditure"
contract_name = "opco.capex_line"
subject_family = "asset"
parties = ["owner"]


[[contracts.fields]]
name = "pct_of_revenue"
field_type = "decimal"
unit = "ratio"
one_of = "amount"
description = "Capex as a share of modeled revenue — an amount stated as a rate on revenue, on its own or added to a stated amount."

[[contracts]]
type_id = "OpCo.Contract.WorkingCapital"
refines = "Contract.WorkingCapital"
contract_name = "opco.working_capital"
subject_family = "asset"
parties = ["owner"]


[[contracts.fields]]
name = "amount"
field_type = "decimal"
required = true
description = "Working-capital investment per period; negative releases it."

[[contracts]]
type_id = "OpCo.Contract.WorkingCapitalPolicy"
refines = "Contract.WorkingCapital"
contract_name = "opco.working_capital_policy"
subject_family = "asset"
parties = ["owner"]
description = "Days-based policy — receivables, payables, inventory — rather than a stated movement."


[[contracts.fields]]
name = "ar_days"
field_type = "integer"
unit = "days"
description = "Days of revenue held as receivables."

[[contracts.fields]]
name = "inv_days"
field_type = "integer"
unit = "days"
description = "Days of cost held as inventory."

[[contracts.fields]]
name = "ap_days"
field_type = "integer"
unit = "days"
description = "Days of cost owed as payables."

[[contracts.fields]]
name = "release_at_end"
field_type = "integer"
description = "1 — the working-capital balance is released in the final period."

[[contracts]]
type_id = "OpCo.Contract.TermDebt"
refines = "Contract.Debt"
contract_name = "opco.term_debt"
subject_family = "asset"
parties = ["borrower", "lender"]


[[contracts.fields]]
name = "principal"
field_type = "decimal"
required = true
one_of = "amount"
description = "The loan amount."

[[contracts.fields]]
name = "interest_rate"
field_type = "decimal"
required = true
unit = "ratio"
one_of = "interest"
description = "Nominal annual rate."

[[contracts.fields]]
name = "amortization_months"
field_type = "integer"
required = true
unit = "months"
description = "Amortization term the level payment is struck on."

[[contracts.lines]]
name = "proceeds"

[[contracts.lines]]
name = "principal"

[[contracts]]
type_id = "OpCo.Contract.CashTaxes"
refines = "Contract.Tax"
contract_name = "opco.cash_taxes"
subject_family = "asset"
parties = ["taxpayer"]


[[contracts.fields]]
name = "tax_rate_curve"
field_type = "string"
one_of = "charge"
description = "A declared curve of tax rates by date, instead of a fixed rate."

[[contracts.fields]]
name = "da_monthly"
field_type = "decimal"
description = "Depreciation and amortization deduction per period."

[[contracts.fields]]
name = "da_year"
field_type = "decimal"
unit = "USD/yr"
description = "Depreciation and amortization deduction per year, spread by the calendar."

[[contracts.fields]]
name = "da_growth"
field_type = "decimal"
unit = "ratio"
description = "Annual growth of the depreciation and amortization deduction."

[[contracts.roles]]
name = "authority"
unbound = true

[[contracts.lines]]
name = "paid"

[[contracts]]
type_id = "OpCo.Contract.Acquisition"
refines = "Contract.Purchase"
contract_name = "opco.acquisition"
subject_family = "asset"
parties = ["buyer", "seller"]

[[contracts]]
type_id = "OpCo.Contract.ExitAtMultiple"
refines = "Contract.Sale"
contract_name = "opco.exit_multiple"
subject_family = "asset"
parties = ["seller"]


[[contracts.fields]]
name = "base"
field_type = "decimal"
required = true
description = "The figure the multiple is struck on."

[[contracts.fields]]
name = "multiple"
field_type = "decimal"
required = true
one_of = "basis"
description = "Multiple applied to the base."

[[contracts.roles]]
name = "buyer"
unbound = true

[[contracts]]
type_id = "OpCo.Contract.ExitAtEbitdaMultiple"
refines = "Contract.Sale"
contract_name = "opco.exit_ebitda"
subject_family = "asset"
parties = ["seller"]


[[contracts.fields]]
name = "multiple"
field_type = "decimal"
required = true
one_of = "basis"
description = "Multiple applied to the trailing twelve months of EBITDA before the sale date."

[[contracts.roles]]
name = "buyer"
unbound = true

[[contracts.lines]]
name = "selling_costs"

[[contracts]]
type_id = "OpCo.Contract.ExitAtPerpetuity"
refines = "Contract.Sale"
contract_name = "opco.exit_perpetuity"
subject_family = "asset"
parties = ["seller"]


[[contracts.fields]]
name = "base"
field_type = "decimal"
required = true
description = "The terminal-period flow, before the growth step."

[[contracts.fields]]
name = "growth_rate"
field_type = "decimal"
required = true
unit = "ratio"
description = "Perpetual growth; 0 for a flat perpetuity."

[[contracts.fields]]
name = "discount_rate"
field_type = "decimal"
required = true
unit = "ratio"
one_of = "basis"
description = "Terminal capitalization rate."

[[contracts.roles]]
name = "buyer"
unbound = true

[[contracts.lines]]
name = "selling_costs"

# --- Options: contracts with an election ---------------------------------
# An option names no lowering rule. Its cash is the payoff of an election, which
# the engine resolves directly — so unlike every other contract type here, there
# is no rule to bind to.
[[contracts]]
type_id = "OpCo.Contract.EquityOption"
refines = "Contract.Option"
subject_family = "asset"
parties = ["grantor", "holder"]
description = "A management or investor option over the enterprise's equity, struck at a stated price."

# ---------------------------------------------------------------------------
# References
# ---------------------------------------------------------------------------

[[references]]
reference_id = "opco.base_rate"
kind = "rate_curve"
unit = "ratio"
description = "Floating base rate a debt tranche prices off."

[[references]]
reference_id = "opco.inflation"
kind = "index"
unit = "ratio"

[[references]]
reference_id = "opco.exit_multiple"
kind = "index"
unit = "turns"
description = "Exit multiple path, where the model treats it as varying rather than fixed."

# ---------------------------------------------------------------------------
# Relations
# ---------------------------------------------------------------------------

[[relations]]
relation_id = "owns"
from_family = "party"
to_family = "asset"
cardinality = "many_to_many"
inverse = "owned_by"

[[relations]]
relation_id = "manages"
from_family = "party"
to_family = "asset"
cardinality = "many_to_many"
inverse = "managed_by"

[[relations]]
relation_id = "lends_to"
from_family = "party"
to_family = "asset"
cardinality = "many_to_many"
inverse = "borrows_from"

[[relations]]
relation_id = "part_of"
from_family = "asset"
to_family = "asset"
cardinality = "many_to_one"
inverse = "contains"
description = "Optional hierarchy — a segment within an enterprise, an acquisition under a platform. Never required."

[[relations]]
relation_id = "claim_on"
from_family = "asset"
to_family = "asset"
cardinality = "many_to_one"
inverse = "claimed_by"
description = "An equity interest's claim on the enterprise it is an interest in."
