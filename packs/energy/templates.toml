# Energy contract templates — the conventional starting set for a contracted
# generation asset, offered by the editor as snippets and assembled into
# starting models by the MCP `skeleton` tool. Defaults are the values the
# benchmark suite validates (benchmarks/energy/solar_ppa_microgrid), not
# measurements — a real project states its own.
#
# `${key}` placeholders resolve from the request, then from [templates.defaults].

[[templates]]
id = "energy.ppa"
label = "Power purchase agreement — contracted offtake"
kind = "contract"
body = """
contract energy.ppa {
  term ${term_start}..${term_end}
  terms {
    mwh_year = ${mwh_year}
    ppa_price = ${ppa_price}
    escalation = ${escalation}
    degradation = ${degradation}
  }
}
"""
[templates.defaults]
term_start = "2026-01"
term_end = "2050-12"
mwh_year = "4200"
ppa_price = "85"
escalation = "0.02"
degradation = "0.005"

[[templates]]
id = "energy.om"
label = "Operations and maintenance"
kind = "contract"
body = """
contract energy.om {
  term ${term_start}..${term_end}
  terms {
    om_year = ${om_year}
    escalation = ${escalation}
  }
}
"""
[templates.defaults]
term_start = "2026-01"
term_end = "2050-12"
om_year = "70000"
escalation = "0.025"

[[templates]]
id = "energy.capex"
label = "Capital expenditure at close"
kind = "contract"
body = """
contract energy.capex {
  term ${term_start}..${term_start}
  terms {
    amount = ${amount}
  }
}
"""
[templates.defaults]
term_start = "2026-01"
amount = "2400000"

[[templates]]
id = "energy.debt_service"
label = "Level-pay project debt"
kind = "contract"
body = """
contract energy.debt_service {
  term ${term_start}..${term_end}
  terms {
    rate = ${rate}
    term_months = ${term_months}
    principal = ${principal}
    funded_at_close = ${funded_at_close}
  }
}
"""
[templates.defaults]
term_start = "2026-01"
term_end = "2045-12"
rate = "0.06"
term_months = "240"
principal = "1600000"
funded_at_close = "0"
