# Energy contract templates — the conventional starting set, offered by the
# editor as snippets (the LSP reads these for completion and `applyTemplate`).
#
# Each template carries the terms its rule REQUIRES, with a conventional value
# where a convention exists and zero where only the deal knows. A term may hold
# an expression, so a varying rate is written directly —
# `growth_rate = curve_value("cpi", time.date)` — and no template offers a
# curve-selector twin.
#
# `${key}` placeholders resolve from the request, then from
# [templates.defaults].

[[templates]]
id = "energy.ppa"
label = "PPA revenue"
kind = "contract"
body = """
contract energy.ppa.plant_a {
  term ${term_start}..${term_end}
  terms {
    mwh_year = ${mwh_year}
    ppa_price = ${ppa_price}
    escalation = ${escalation}
    degradation = ${degradation}
    availability = ${availability}
  }
}
"""
[templates.defaults]
term_start = "2026-01"
term_end = "2050-12"
mwh_year = "0"
ppa_price = "0"
escalation = "0"
degradation = "0.005"
availability = "1.0"

