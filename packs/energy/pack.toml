name = "energy"
version = "0.1.0"
description = "Energy & microgrids pack: PPA/merchant revenue, storage, O&M, tax credits, project debt."

# Every rule in this pack divides annual figures by a literal 12 and counts
# elapsed time in months, so one period must be one month. On any other
# calendar the schedule adapts but the amounts do not, producing figures out
# by a factor of twelve with no diagnostic. Migration scaffold: removed rule
# by rule as the expressions become cadence-neutral.
cadences = ["monthly"]

[entrypoints]
aliases = "aliases.toml"
lowering = "lowering/rules.toml"
metrics = "metrics.toml"
validations = "validations.toml"
