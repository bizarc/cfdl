# Energy pack ontology — the vocabulary of things a model may declare.
#
# A pack's lowering rules say how a contract becomes cash. THIS file says what
# the model is ABOUT: which assets exist, which parties can be counterparties,
# what lifecycle an asset moves through, and how those things relate.
#
# THE FOUR FAMILIES are fixed by the language; a pack fills them in:
#
#   asset        a thing that produces or consumes cash
#   party        someone who contracts, owns, lends or invests
#   contract     an agreement between parties, attached to an asset
#   reference    a market observable — a price curve, an index, a rate
#
# An asset also carries a CLASS — `real`, `financial` or `intangible` — which
# is the split every asset taxonomy starts from and the one that decides how an
# asset is underwritten. A turbine is real; a tax-equity interest in it is
# financial.
#
# HIERARCHY IS OPTIONAL, ALWAYS. A wind farm may be one asset or a collection
# of turbines; a portfolio may be one asset or many projects. The modeller
# chooses the grain, and the language supports either without preferring one.
# Nothing here requires a parent.

[pack]
ontology_id = "energy"
version = "0.1.0"

# ---------------------------------------------------------------------------
# Assets
# ---------------------------------------------------------------------------

[[entities]]
type_id = "Energy.Asset.GenerationFacility"
family = "asset"
class = "real"
refines = "Asset.Real"
lifecycle = "energy.facility"
description = "A plant that converts a resource into electricity or heat."

[[entities.fields]]
name = "technology"
field_type = "string"
required = false
description = "solar_pv | wind | storage | geothermal | thermal | hybrid"

[[entities.fields]]
name = "nameplate_capacity"
field_type = "decimal"
required = false
unit = "kW"

[[entities.fields]]
name = "capacity_factor"
field_type = "decimal"
required = false
unit = "ratio"

[[entities.fields]]
name = "commercial_operation_date"
field_type = "date"
required = false

[[entities.fields]]
name = "available_capacity_fraction"
field_type = "number"
required = false
description = """The share of net maximum capacity currently available. A DERATE \
is partial and coexists with being in service, and IEEE 762 reports derates with \
a magnitude — so this is a field rather than a state (`docs/36` §3.1). 1.0 is \
fully available."""

[[entities]]
type_id = "Energy.Container.Portfolio"
family = "container"
refines = "Container.Portfolio"
description = "A grouping of facilities modeled as one. Use only when the grain is the portfolio; a facility needs no parent to exist."

# A tax-equity or sponsor interest is a claim on the project, not the plant
# itself — so it is financial even though what it claims is real.
[[entities]]
type_id = "Energy.Asset.ProjectInterest"
family = "asset"
class = "financial"
refines = "Asset.Financial"
lifecycle = "energy.flip_structure"
description = "An equity interest in a project's cash and tax attributes."

[[entities.fields]]
name = "interest_type"
field_type = "string"
required = false
description = "sponsor | tax_equity | preferred"

# ---------------------------------------------------------------------------
# Parties
# ---------------------------------------------------------------------------

[[entities]]
type_id = "Energy.Party.Sponsor"
family = "party"
refines = "Party"
description = "Develops and owns the project."

[[entities.fields]]
name = "name"
field_type = "string"
required = false

[[entities]]
type_id = "Energy.Party.Offtaker"
family = "party"
refines = "Party"
description = "Buys the output — a utility, a corporate buyer, or the market."

[[entities.fields]]
name = "name"
field_type = "string"
required = false

[[entities.fields]]
name = "credit_rating"
field_type = "string"
required = false

[[entities]]
type_id = "Energy.Party.Lender"
family = "party"
refines = "Party"
description = "Provides project debt."

[[entities.fields]]
name = "name"
field_type = "string"
required = false

[[entities]]
type_id = "Energy.Party.TaxEquityInvestor"
family = "party"
refines = "Party"
description = "Invests for the tax attributes — credits and depreciation."

[[entities.fields]]
name = "name"
field_type = "string"
required = false

[[entities]]
type_id = "Energy.Party.ServiceProvider"
family = "party"
refines = "Party"
description = "Operations and maintenance counterparty, or a landowner under a site lease."

[[entities.fields]]
name = "name"
field_type = "string"
required = false

# ---------------------------------------------------------------------------
# Lifecycles
#
# Every asset with a lifecycle is ALWAYS in exactly one of its states, starting
# at `initial`. There is no null state and no undeclared state: a transition
# naming a state not listed here is a compile error, which is what makes a
# misspelled status impossible rather than merely unlikely.
# ---------------------------------------------------------------------------

[[lifecycles]]
lifecycle_id = "energy.facility"
initial = "in_service"
states = ["development", "construction", "commissioning", "in_service", "reserve_shutdown", "forced_outage", "planned_outage", "maintenance_outage", "mothballed", "retired", "abandoned"]
description = """A generating unit's condition, on IEEE Std 762 as NERC GADS \
operationalises it (`docs/36` §3.1). The standard's central distinction is \
AVAILABILITY against DISPATCH: a unit that is available but not synchronised is \
in RESERVE SHUTDOWN, which is not the same condition as one forced out, and the \
two carry opposite implications for an availability payment. Economic \
curtailment is a reserve shutdown; a physical limit is a DERATE, which is \
partial and coexists with being in service — so it is the \
`available_capacity_fraction` field, not a state. Forced, planned and \
maintenance outages stay distinct because the availability metrics this pack \
publishes (EAF, EFOR) are defined on that distinction."""

[[lifecycles.transitions]]
from = "development"
to = "construction"

[[lifecycles.transitions]]
from = "development"
to = "abandoned"
description = "Where projects most often die."

[[lifecycles.transitions]]
from = "construction"
to = "commissioning"

[[lifecycles.transitions]]
from = "construction"
to = "abandoned"

[[lifecycles.transitions]]
from = "commissioning"
to = "in_service"
description = "The service date, on which GADS reporting begins."

[[lifecycles.transitions]]
from = "in_service"
to = "reserve_shutdown"
description = "Available, not synchronised. Economic curtailment lands here."

[[lifecycles.transitions]]
from = "reserve_shutdown"
to = "in_service"

[[lifecycles.transitions]]
from = "in_service"
to = "forced_outage"

[[lifecycles.transitions]]
from = "forced_outage"
to = "in_service"

[[lifecycles.transitions]]
from = "reserve_shutdown"
to = "forced_outage"

[[lifecycles.transitions]]
from = "in_service"
to = "planned_outage"

[[lifecycles.transitions]]
from = "planned_outage"
to = "in_service"

[[lifecycles.transitions]]
from = "in_service"
to = "maintenance_outage"

[[lifecycles.transitions]]
from = "maintenance_outage"
to = "in_service"

[[lifecycles.transitions]]
from = "in_service"
to = "mothballed"
description = "GADS inactive. A mothballed unit can return; a retired one cannot."

[[lifecycles.transitions]]
from = "reserve_shutdown"
to = "mothballed"

[[lifecycles.transitions]]
from = "mothballed"
to = "in_service"

[[lifecycles.transitions]]
from = "in_service"
to = "retired"

[[lifecycles.transitions]]
from = "mothballed"
to = "retired"

[[lifecycles]]
lifecycle_id = "energy.flip_structure"
initial = "pre_flip"
states = ["pre_flip", "post_flip"]

[[lifecycles.transitions]]
from = "pre_flip"
to = "post_flip"
description = "The tax investor's after-tax internal rate of return reaches its target."

# ---------------------------------------------------------------------------
# Contracts
#
# `contract_name` binds a type to the lowering rule that turns it into cash, so
# the ontology and the arithmetic cannot drift apart: a type with no rule
# produces nothing, and a rule with no type has no counterparties.
# ---------------------------------------------------------------------------

[[contracts]]
type_id = "Energy.Contract.PPA"
refines = "Contract.Offtake"
contract_name = "energy.ppa"
subject_family = "asset"
parties = ["seller", "offtaker"]
description = "Power purchase agreement: contracted price for delivered energy."

[[contracts]]
type_id = "Energy.Contract.MerchantSale"
refines = "Contract.Offtake"
contract_name = "energy.merchant"
subject_family = "asset"
parties = ["seller"]
description = "Uncontracted sale into the market. The counterparty is the market, so only the seller is named."

[[contracts.roles]]
name = "offtaker"
unbound = true

[[contracts]]
type_id = "Energy.Contract.StorageArbitrage"
refines = "Contract.Offtake"
contract_name = "energy.storage_arbitrage"
subject_family = "asset"
parties = ["seller"]

[[contracts.roles]]
name = "offtaker"
unbound = true

[[contracts]]
type_id = "Energy.Contract.CapacityPayment"
refines = "Contract.Offtake"
contract_name = "energy.capacity"
subject_family = "asset"
parties = ["seller", "offtaker"]

[[contracts]]
type_id = "Energy.Contract.OperationsAndMaintenance"
refines = "Contract.Service"
contract_name = "energy.om"
subject_family = "asset"

[[contracts.roles]]
name = "owner"
refines = "recipient"

[[contracts.roles]]
name = "service_provider"
refines = "provider"

[[contracts]]
type_id = "Energy.Contract.ProjectDebt"
refines = "Contract.Debt"
contract_name = "energy.debt_service"
subject_family = "asset"
parties = ["borrower", "lender"]

[[contracts]]
type_id = "Energy.Contract.Capex"
refines = "Contract.CapitalExpenditure"
contract_name = "energy.capex"
subject_family = "asset"
parties = ["owner"]

# Tax attributes are agreements with a revenue authority rather than a
# commercial counterparty, so they name only the claimant.
[[contracts]]
type_id = "Energy.Contract.InvestmentTaxCredit"
refines = "Contract.Tax"
contract_name = "energy.itc"
subject_family = "asset"

[[contracts.roles]]
name = "claimant"
refines = "taxpayer"

[[contracts.roles]]
name = "authority"
unbound = true

[[contracts]]
type_id = "Energy.Contract.ProductionTaxCredit"
refines = "Contract.Tax"
contract_name = "energy.ptc"
subject_family = "asset"

[[contracts.roles]]
name = "claimant"
refines = "taxpayer"

[[contracts.roles]]
name = "authority"
unbound = true

[[contracts]]
type_id = "Energy.Contract.DepreciationShield"
refines = "Contract.Tax"
contract_name = "energy.macrs_shield"
subject_family = "asset"

[[contracts.roles]]
name = "claimant"
refines = "taxpayer"

[[contracts.roles]]
name = "authority"
unbound = true

# --- Options: contracts with an election ---------------------------------
[[contracts]]
type_id = "Energy.Contract.OfftakeExtension"
refines = "Contract.Option"
subject_family = "asset"
description = "An offtaker's right to extend the contracted term."

[[contracts.roles]]
name = "seller"
refines = "grantor"

[[contracts.roles]]
name = "offtaker"
refines = "holder"

# ---------------------------------------------------------------------------
# References — market observables. Declared in the model today; the shape
# admits an external source later without the model changing.
# ---------------------------------------------------------------------------
[[references]]
reference_id = "energy.power_price"
kind = "price_curve"
unit = "USD/MWh"
description = "Forward or projected wholesale power price."

[[references]]
reference_id = "energy.base_rate"
kind = "rate_curve"
unit = "ratio"
description = "Floating base rate for project debt."

[[references]]
reference_id = "energy.inflation"
kind = "index"
unit = "ratio"

# ---------------------------------------------------------------------------
# Relations — typed links, with an inverse so either end reads naturally.
# ---------------------------------------------------------------------------

[[relations]]
relation_id = "owns"
from_family = "party"
to_family = "asset"
cardinality = "many_to_many"
inverse = "owned_by"

[[relations]]
relation_id = "operates"
from_family = "party"
to_family = "asset"
cardinality = "many_to_many"
inverse = "operated_by"

[[relations]]
relation_id = "part_of"
from_family = "asset"
to_family = "asset"
cardinality = "many_to_one"
inverse = "contains"
description = "Optional hierarchy — a facility within a portfolio. Never required: an asset stands alone unless the modeller groups it."
