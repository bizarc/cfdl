# Energy pack lowering rules — fully template-driven ({{contract.*}} + defaults).
#
# Conventions (documented in README.md):
# - Annual quantities (`X_year`) are spread evenly across the rule's own
#   periods: X_year / {{model.periods_per_year}}. That is the model's calendar
#   unless the rule declares its own schedule_every, in which case it is the
#   payment rhythm — a monthly-paying instrument on a daily book divides by 12.
# - Escalation and degradation step ANNUALLY via {{time.elapsed_years}},
#   matching common project-finance Excel practice. This is cadence-neutral
#   already: it counts whole years, not periods.
# - Rates are NOMINAL and divide (`rate / ppy`); a 6% loan is 0.5%/month and
#   1.5%/quarter, and those are different instruments. Effective annual figures
#   (CPR-style) would take a root instead — do not mix the two.
# - `_months` terms always mean calendar months, on every calendar. Used as a
#   payment count they must divide into whole periods ({{whole_periods.X}}).
# - time.t is the 0-based period index; contract term ranges gate schedules.

[[rules]]
id = "energy_ppa_revenue"
contract_name = "energy.ppa"
stream_name = "energy.ppa.revenue{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.revenue.energy"
amount_expr = "({{contract.mwh_year}} / {{model.periods_per_year}}) * {{contract.availability}} * pow(1 - {{contract.degradation}}, {{time.elapsed_years}}) * {{contract.ppa_price}} * pow(1 + {{contract.escalation}}, {{time.elapsed_years}})"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
escalation = "0"
degradation = "0"
availability = "1"


[rules.units]
mwh_year = "MWh/yr"
ppa_price = "USD/MWh"

[[rules]]
id = "energy_merchant_revenue"
contract_name = "energy.merchant"
stream_name = "energy.merchant.revenue{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.revenue.energy"
amount_expr = "({{contract.mwh_year}} / {{model.periods_per_year}}) * {{contract.availability}} * pow(1 - {{contract.degradation}}, {{time.elapsed_years}}) * {{contract.price}} * pow(1 + {{contract.price_escalation}}, {{time.elapsed_years}})"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
price_escalation = "0"
degradation = "0"
availability = "1"


[rules.units]
mwh_year = "MWh/yr"
price = "USD/MWh"

[[rules]]
id = "energy_storage_arbitrage"
contract_name = "energy.storage_arbitrage"
stream_name = "energy.storage.margin{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.revenue.energy"
amount_expr = "({{contract.mwh_cycled_year}} / {{model.periods_per_year}}) * {{contract.spread}} * pow(1 - {{contract.degradation}}, {{time.elapsed_years}})"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
degradation = "0"


[rules.units]
mwh_cycled_year = "MWh/yr"
spread = "USD/MWh"

[[rules]]
id = "energy_capacity_payment"
contract_name = "energy.capacity"
stream_name = "energy.capacity.revenue{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.revenue.energy"
amount_expr = "{{contract.payment_year}} / {{model.periods_per_year}}"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"


[rules.units]
payment_year = "USD/yr"

[[rules]]
id = "energy_om_expense"
contract_name = "energy.om"
stream_name = "energy.om.expense{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "operating.expense.om"
amount_expr = "({{contract.om_year}} / {{model.periods_per_year}}) * pow(1 + {{contract.escalation}}, {{time.elapsed_years}})"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
escalation = "0"


[rules.units]
om_year = "USD/yr"

[[rules]]
id = "energy_itc_credit"
contract_name = "energy.itc"
stream_name = "energy.itc.credit{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.income_tax.benefit"
amount_expr = "{{contract.credit}}"
schedule_kind = "on_date"
schedule_from = "{{contract.term_start}}"
schedule_to = ""


[rules.units]
credit = "USD"

[[rules]]
id = "energy_capex"
contract_name = "energy.capex"
stream_name = "energy.capex.outlay{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "investing.capital.capex"
amount_expr = "{{contract.amount}}"
schedule_kind = "on_date"
schedule_from = "{{contract.term_start}}"
schedule_to = ""


[rules.units]
amount = "USD"

# Decomposed per the contract design rules (docs/07 §6.4): the whole
# instrument, one stream per line. The single netted `energy.debt.service`
# lost the interest/principal split and emitted no draw at all. The split is
# exact — ipmt + ppmt equals the level payment — so the two legs fold where
# the netted line folded and coverage is unchanged.
#
# A reconciliation whose source's cash flow starts post-financing states
# `funded_at_close = 0` and says so; the default is the whole instrument.
[[rules]]
id = "energy_debt_proceeds"
contract_name = "energy.debt_service"
stream_name = "energy.debt.proceeds{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "financing.debt.proceeds"
amount_expr = "{{contract.principal}} * {{contract.funded_at_close}}"
schedule_kind = "on_date"
schedule_from = "{{contract.term_start}}"
schedule_to = ""

[rules.defaults]
funded_at_close = "1"

[rules.units]
principal = "USD"

[[rules]]
id = "energy_debt_interest"
contract_name = "energy.debt_service"
stream_name = "energy.debt.interest{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "financing.debt.interest_paid"
# ipmt() returns the Excel-convention negative interest for a positive pv;
# negate for a positive outflow amount.
amount_expr = "-ipmt({{contract.rate}} / {{model.accrual_divisor}}, {{time.elapsed_periods}} + 1, {{whole_periods.term_months}}, {{contract.principal}})"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.units]
principal = "USD"
term_months = "months"

[[rules]]
id = "energy_debt_principal"
contract_name = "energy.debt_service"
stream_name = "energy.debt.principal{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "financing.debt.principal"
amount_expr = "-ppmt({{contract.rate}} / {{model.accrual_divisor}}, {{time.elapsed_periods}} + 1, {{whole_periods.term_months}}, {{contract.principal}})"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.units]
principal = "USD"
term_months = "months"

[[rules]]
id = "energy_ptc_credit"
contract_name = "energy.ptc"
stream_name = "energy.ptc.credit{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.income_tax.benefit"
# Production tax credit on generated MWh; credit rate is inflation-adjusted
# (escalation), production degrades annually. The contract term bounds the
# credit window (statutorily 10 years).
#
# THE CREDIT RATE IS A STAIRCASE, NOT A RAMP. The inflation-adjusted credit is
# published rounded to the nearest 0.1 cent per kWh, so it steps once a year
# and holds.
#
# MIND THE UNIT. This rule's rate is per MWh, and 0.1 c/kWh is $1.00/MWh:
#   0.1 cent = $0.001 per kWh, x 1000 kWh = $1.00 per MWh.
# So the published credit moves in whole dollars per MWh — 28, 29, 30 — which
# is why `round_step` defaults to 1.00 and not 0.10. Getting this wrong rounds
# to a hundredth of a cent, which is indistinguishable from not rounding at
# all; the external reference is what caught it. Carrying it continuously was wrong
# by up to 1.8% in a single year and about -0.3% over a ten-year window, and the
# error alternates sign rather than drifting, which is why it survived: it looks
# like noise in aggregate. Found reconciling against a national laboratory's
# model, which rounds; see benchmarks/energy/.
#
# `round_step` defaults to 0.10 for that convention. Set it to 0 to disable
# rounding for a jurisdiction that does not round, or to another tick.
amount_expr = "({{contract.mwh_year}} / {{model.periods_per_year}}) * {{contract.availability}} * pow(1 - {{contract.degradation}}, {{time.elapsed_years}}) * if({{contract.round_step}} > 0, round_to({{contract.credit_per_mwh}} * pow(1 + {{contract.escalation}}, {{time.elapsed_years}}), {{contract.round_step}}), {{contract.credit_per_mwh}} * pow(1 + {{contract.escalation}}, {{time.elapsed_years}}))"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
round_step = "1.00"
escalation = "0"
degradation = "0"
availability = "1"


[rules.units]
mwh_year = "MWh/yr"
credit_per_mwh = "USD/MWh"
round_step = "USD/MWh"

[[rules]]
id = "energy_macrs_shield"
contract_name = "energy.macrs_shield"
stream_name = "energy.macrs.shield{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.income_tax.benefit"
# Cash value of MACRS depreciation deductions: basis * rate(year) * tax_rate,
# spread monthly. macrs_rate() follows IRS Pub 946 GDS half-year tables and
# returns 0 beyond the recovery period, so the term can simply span the model.
amount_expr = "{{contract.basis}} * macrs_rate({{time.elapsed_years}}, {{contract.life}}) / {{model.periods_per_year}} * {{contract.tax_rate}}"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

# `life` is required: the MACRS class life sets the whole depreciation
# schedule (5 / 7 / 15 / 20), so the model states it.


[rules.units]
basis = "USD"
life = "years"
