# Credit pack ontology — the vocabulary of things a model may declare.
#
# See packs/energy/ontology/types.toml for what the four families mean.
#
# HIERARCHY IS OPTIONAL, AND CREDIT IS THE CASE THAT PROVES IT MATTERS. A
# mortgage-backed security can be modeled as ONE pool asset carrying
# collective behavior — CPR, CDR, severity, recovery lag — or as a COLLECTION
# of individual loans. The pool form is right for pricing and for convention
# work; the loan form is right when the question needs loan-level behavior,
# such as individual default simulation or a scenario that acts on one
# borrower. Both are first-class here. `part_of` exists so a model can be
# built either way, and nothing requires it.

[pack]
ontology_id = "credit"
version = "0.1.0"

# ---------------------------------------------------------------------------
# Assets
# ---------------------------------------------------------------------------

[[entities]]
type_id = "Credit.Asset.LoanPool"
family = "asset"
class = "financial"
refines = "Asset.Financial"
lifecycle = "credit.pool"
description = "A pool of loans modeled by its collective behavior. Needs no children: the pool IS the grain."

[[entities.fields]]
name = "collateral_type"
field_type = "string"
required = false
description = "residential_mortgage | commercial_mortgage | auto | consumer | student | corporate"

[[entities.fields]]
name = "original_balance"
field_type = "decimal"
required = false
unit = "USD"

[[entities.fields]]
name = "weighted_average_coupon"
field_type = "decimal"
required = false
unit = "ratio"

[[entities.fields]]
name = "weighted_average_maturity"
field_type = "integer"
required = false
unit = "months"

[[entities]]
type_id = "Credit.Asset.Loan"
family = "asset"
class = "financial"
refines = "Asset.Financial"
lifecycle = "credit.loan"
description = "A single loan. Use when the model needs loan-level behavior — individual default paths, borrower-level scenarios — otherwise model the pool."

[[entities.fields]]
name = "original_balance"
field_type = "decimal"
required = false
unit = "USD"

[[entities.fields]]
name = "coupon"
field_type = "decimal"
required = false
unit = "ratio"

[[entities.fields]]
name = "term"
field_type = "integer"
required = false
unit = "months"

[[entities.fields]]
name = "days_past_due"
field_type = "number"
required = false
description = """How far past due the loan is. A FIELD, not a state: the industry \
reports delinquency in buckets (30-59, 60-89, 90+) and a bucket is a reading of \
this counter rather than a regime. The 90-day default threshold is a guard on \
it (`docs/36` §2.1)."""

[[entities]]
type_id = "Credit.Asset.Tranche"
family = "asset"
class = "financial"
refines = "Asset.Financial"
description = "A claim of stated seniority on a pool's cash."

[[entities.fields]]
name = "seniority"
field_type = "integer"
required = false
description = "1 is most senior. Ordering, not a rating."

[[entities.fields]]
name = "original_balance"
field_type = "decimal"
required = false
unit = "USD"

# ---------------------------------------------------------------------------
# Parties
# ---------------------------------------------------------------------------

[[entities]]
type_id = "Credit.Party.Issuer"
family = "party"
refines = "Party"

[[entities.fields]]
name = "name"
field_type = "string"
required = false

[[entities]]
type_id = "Credit.Party.Servicer"
family = "party"
refines = "Party"
description = "Collects, advances and works out the collateral."

[[entities.fields]]
name = "name"
field_type = "string"
required = false

[[entities]]
type_id = "Credit.Party.Investor"
family = "party"
refines = "Party"

[[entities.fields]]
name = "name"
field_type = "string"
required = false

[[entities]]
type_id = "Credit.Party.Borrower"
family = "party"
refines = "Party"
description = "Owes under a loan. Named when the model is at loan grain; a pool model has no single borrower."

[[entities.fields]]
name = "name"
field_type = "string"
required = false

# ---------------------------------------------------------------------------
# Lifecycles
#
# A pool never defaults as a whole — it amortizes and its collateral decays, so
# its lifecycle is about the pool's life, not its credit. A LOAN has credit
# states, which is one more reason the two are different types rather than one
# type at two grains.
# ---------------------------------------------------------------------------

[[lifecycles]]
lifecycle_id = "credit.pool"
initial = "amortizing"
states = ["warehouse", "revolving", "amortizing", "rapid_amortization", "retired"]
description = """A pool's structural regime (`docs/36` §2.2). `revolving` is the \
reinvestment period and `rapid_amortization` is early amortization on a trigger \
breach — both universal ABS/CLO regimes with their own cash mechanics. A \
clean-up call is NOT a state: it is an occurrence, and it drives \
`amortizing -> retired` as an event with a no-return topology."""

# A RETIRED POOL PRODUCES NOTHING (docs/40 §3, stage 6). `balance` names the
# field ROLE the pool's rules fill — the level-pay pool's balance, the
# interest-only pools' survival factor, and the lagged twin that feeds
# recoveries — so one entry action ends the
# cash of every pool shape without naming an instance's field. A model
# retires a pool with one status write: the clean-up call is an event.
[[lifecycles.entry_actions]]
state = "retired"
description = "The pool's balance is extinguished: every stream it lowers reads zero from the next period."
actions = [{ set = "balance", value = "0" }]

[[lifecycles.transitions]]
from = "warehouse"
to = "revolving"

[[lifecycles.transitions]]
from = "warehouse"
to = "amortizing"

[[lifecycles.transitions]]
from = "revolving"
to = "amortizing"
description = "The reinvestment period ends and principal begins paying down."

[[lifecycles.transitions]]
from = "revolving"
to = "rapid_amortization"

[[lifecycles.transitions]]
from = "amortizing"
to = "rapid_amortization"
description = "An early amortization trigger breaches."

[[lifecycles.transitions]]
from = "amortizing"
to = "retired"

[[lifecycles.transitions]]
from = "rapid_amortization"
to = "retired"

[[lifecycles]]
lifecycle_id = "credit.loan"
initial = "current"
states = ["current", "delinquent", "defaulted", "in_foreclosure", "liquidated", "prepaid", "matured", "repurchased"]
description = """A loan's condition, named as the standards name it (`docs/36` §2.1). \
Basel BCBS d403 and the EBA guidelines describe a DEFAULTED EXPOSURE, entered \
at 90 days past due OR on unlikeliness-to-pay independently of any day count; \
the MBA's phrasing for enforcement is `in the process of foreclosure`. Both \
are conditions the loan is in, which is why neither is spelled as the event \
that starts it. Delinquency BUCKETS (30-59, 60-89, 90+) are readings of the \
`days_past_due` field, not states."""

# A LOAN THAT IS PAID OFF OR REPURCHASED OWES NOTHING (docs/40 §3, stage 6).
# `balance` names the field ROLE the loan's rules fill — the level-pay
# balance and its lagged twin, the interest-only survival factor — so one
# entry action ends the cash without naming an instance's field. A clean-up
# call REPURCHASES the remaining loans: a model writes one status and the
# collateral is gone from the next period.
[[lifecycles.entry_actions]]
state = "repurchased"
description = "The claim is extinguished: every stream the loan lowers reads zero from the next period."
actions = [{ set = "balance", value = "0" }]

[[lifecycles.entry_actions]]
state = "prepaid"
description = "Paid off in full: every stream the loan lowers reads zero from the next period."
actions = [{ set = "balance", value = "0" }]

[[lifecycles.transitions]]
from = "current"
to = "delinquent"

[[lifecycles.transitions]]
from = "delinquent"
to = "current"
description = "Cure. No probation applies below the default threshold."

[[lifecycles.transitions]]
from = "delinquent"
to = "defaulted"
description = "90 days past due, or unlikeliness to pay at any day count."

[[lifecycles.transitions]]
from = "defaulted"
to = "current"
description = """Cure out of default. The EBA requires a MINIMUM PROBATION PERIOD \
before an exposure returns to performing, so this edge is guarded on a dwell \
counter rather than on payment alone — `on enter defaulted` resets it."""

[[lifecycles.transitions]]
from = "defaulted"
to = "in_foreclosure"

[[lifecycles.transitions]]
from = "in_foreclosure"
to = "current"
description = "Reinstatement before sale, which is ordinary in US practice."

[[lifecycles.transitions]]
from = "in_foreclosure"
to = "liquidated"
description = "Recovery lands, net of severity and after the recovery lag."

[[lifecycles.transitions]]
from = "current"
to = "prepaid"

[[lifecycles.transitions]]
from = "delinquent"
to = "prepaid"
description = "A late borrower can still pay off."

[[lifecycles.transitions]]
from = "defaulted"
to = "prepaid"

[[lifecycles.transitions]]
from = "current"
to = "matured"

[[lifecycles.transitions]]
from = "delinquent"
to = "matured"
description = "Stated maturity arrives whether or not the borrower is current."

[[lifecycles.transitions]]
from = "current"
to = "repurchased"
description = "Fannie Mae zero-balance code 06; a real termination, not a default outcome."

[[lifecycles.transitions]]
from = "delinquent"
to = "repurchased"

[[lifecycles.transitions]]
from = "defaulted"
to = "repurchased"

# ---------------------------------------------------------------------------
# Contracts
# ---------------------------------------------------------------------------

# The pool the three lowered shapes share: a purchased pool of loans, so the
# lender's role is the note HOLDER and the borrowers are the obligors behind
# the pool — many, unnamed, so the role is unbound. Abstract: a model declares
# one of the shapes below, never the pool itself.
# ---------------------------------------------------------------------------
# THE LOAN (docs/42 §3.8). One type. A loan is the agreement; a pool of loans
# is a container the modeller names — `Container.SPV`, or one called Pool —
# and its balance is the fold of its members' (docs/42 §3.4). A loan written
# with prepayment, default, severity and recovery RATES is a representative
# loan standing for many; a tape of actual loans is many contracts, each on
# its own entity, folded by the container. Both are `credit.loan`.
#
# The repayment pattern is the master's `amortization` term — `level_pay`
# (the default), `interest_only` or `bullet` — and the coupon is fixed
# (`interest_rate`) or floating (`index_curve` + `margin`). The lowering
# rules select on those terms (docs/07 §6.5), so no type is named after a
# pattern. A floating level-pay loan has no row and is refused (E1385).
# ---------------------------------------------------------------------------
[[contracts]]
type_id = "Credit.Contract.Loan"
refines = "Contract.Debt"
contract_name = "credit.loan"
subject_family = "asset"
description = "A loan, or a representative loan standing for a pool of them: balance, coupon, term and repayment pattern, with the prepayment, default, severity and servicing assumptions its cash follows."

# The subject is the asset the holder owns; the borrower is the pool's many
# obligors, or one — unbound either way.
[[contracts.roles]]
name = "holder"
refines = "lender"

[[contracts.roles]]
name = "borrower"
unbound = true

[[contracts.fields]]
name = "principal"
field_type = "decimal"
required = true
one_of = "amount"
description = "The balance at the model's start — what is owed when the model opens. A loan that funds inside the run states the amount it funds for."

[[contracts.fields]]
name = "term_months"
field_type = "integer"
required = true
unit = "months"
description = "Remaining term, in months."

[[contracts.fields]]
name = "cpr"
field_type = "decimal"
unit = "ratio"
description = "Annual conditional prepayment rate."

[[contracts.fields]]
name = "cdr"
field_type = "decimal"
unit = "ratio"
description = "Annual conditional default rate."

[[contracts.fields]]
name = "psa_speed"
field_type = "decimal"
description = "Multiple of the standard PSA prepayment curve — 1.5 is 150% PSA."

[[contracts.fields]]
name = "sda_speed"
field_type = "decimal"
description = "Multiple of the standard default assumption — 1.0 is 100% SDA."

[[contracts.fields]]
name = "abs_speed"
field_type = "decimal"
unit = "ratio"
description = "Absolute prepayment speed: a constant fraction of the original balance each month."

[[contracts.fields]]
name = "age_months"
field_type = "integer"
unit = "months"
description = "Age at the model's start, in months; seasons the PSA and SDA curves. A representative loan carries the pool's weighted average."

[[contracts.fields]]
name = "severity"
field_type = "decimal"
unit = "ratio"
description = "Loss severity on defaulted balance."

[[contracts.fields]]
name = "recovery_lag_months"
field_type = "integer"
unit = "months"
description = "Months from default to recovery cash."

[[contracts.fields]]
name = "servicing_fee"
field_type = "decimal"
unit = "ratio"
description = "Annual servicing strip on performing balance."

[[contracts.fields]]
name = "prepay_penalty_rate"
field_type = "decimal"
unit = "ratio"
description = "Flat penalty rate on voluntary prepayments."

[[contracts.fields]]
name = "amortization"
field_type = "string"
description = "The repayment pattern: level_pay (the default), interest_only, or bullet — interest paid on schedule and the principal at maturity. The lowering rules select on it."

[[contracts.fields]]
name = "interest_rate"
field_type = "decimal"
unit = "ratio"
one_of = "interest"
description = "Annual note rate, when the coupon is fixed."

[[contracts.fields]]
name = "index_curve"
field_type = "string"
one_of = "interest"
description = "The declared curve a floating coupon resets off, with `margin`. Floating coupons are interest-only or bullet: a floating level-pay schedule has no closed form."

[[contracts.fields]]
name = "rate_floor"
field_type = "decimal"
unit = "ratio"
description = "Coupon floor, on a floating coupon."

[[contracts.fields]]
name = "rate_cap"
field_type = "decimal"
unit = "ratio"
description = "Coupon cap, on a floating coupon."

[[contracts.lines]]
name = "principal"

[[contracts.lines]]
name = "prepayment"

[[contracts.lines]]
name = "recovery"

[[contracts.lines]]
name = "servicing"

[[contracts.lines]]
name = "penalty"

[[contracts]]
type_id = "Credit.Contract.Purchase"
refines = "Contract.Purchase"
contract_name = "credit.purchase"
subject_family = "asset"
parties = ["buyer", "seller"]

# A PARTICIPATION: an undivided pro rata interest in a pool's cash — a
# Fannie Mae or Ginnie Mae pass-through, a Freddie Mac participation
# certificate, a loan participation. The holder receives its share of what
# the pool produced each period, scheduled and unscheduled principal alike,
# and interest net of servicing; nothing is ranked and nothing is chosen, so
# both lines are LOWERED from the collateral (docs/40 §4.13). Written from
# the issuer's seat, as the pack is: the pass-through is an outflow from the
# pool entity, and the model's net is what the issuer retains.
#
# The participation carries the SUFFIX of the pool it participates in:
# `credit.participation.smoke` reads `credit.pool.*.smoke`.
[[contracts]]
type_id = "Credit.Contract.Participation"
refines = "Contract.Security"
contract_name = "credit.participation"
subject_family = "asset"
parties = ["issuer", "holder"]
description = "A pro rata interest in a pool's cash, passed through to the holder each period — a pass-through certificate or a loan participation. Instanced with the suffix of the pool it participates in."

[[contracts.fields]]
name = "share"
field_type = "decimal"
required = true
unit = "ratio"
description = "The holder's undivided share of the pool's cash, 0 to 1."

# A STRUCTURED NOTE: a class of a securitisation — an ABS class, a REMIC
# tranche — paid what the priority of payments allocates it. Both lines are
# marked ALLOCATED here, where the master leaves them lowered (docs/40 §4.13):
# the structure pays them, and the rules lower only the claims the steps
# read. The coupon is required on a note, where the master leaves it optional
# for a pass-through.
[[contracts]]
type_id = "Credit.Contract.Note"
refines = "Contract.Security"
contract_name = "credit.note"
subject_family = "container"
parties = ["issuer", "holder"]
description = "A class of notes in a securitisation: a face and a coupon, paid interest and principal by the trust's priority of payments. The steps that pay it name it; its claim is face less what the holder's principal account has received."

[[contracts.fields]]
name = "coupon"
field_type = "decimal"
unit = "ratio"
one_of = "coupon"
description = "Annual coupon, where fixed."

[[contracts.fields]]
name = "index_curve"
field_type = "string"
one_of = "coupon"
description = "The declared curve a floating coupon resets off, with `margin`."

[[contracts.fields]]
name = "principal_account"
field_type = "account"
required = true
description = "The declared account the holder's principal is paid into — the note's wiring to the ledger, as `on entity` is its wiring to the trust. The claim is `face` less this account's prior balance."

[[contracts.lines]]
name = "interest"
allocated = true

[[contracts.lines]]
name = "principal"
allocated = true

# --- Options: contracts with an election ---------------------------------

[[contracts]]
type_id = "Credit.Contract.CleanUpCall"
refines = "Contract.Option"
subject_family = "asset"
parties = ["holder"]
description = "The issuer's right to retire the pool once it falls below a stated size."

[[contracts.roles]]
name = "issuer"
refines = "grantor"

# ---------------------------------------------------------------------------
# References
# ---------------------------------------------------------------------------
[[references]]
reference_id = "credit.base_rate"
kind = "rate_curve"
unit = "ratio"
description = "Floating base rate a coupon resets off."

[[references]]
reference_id = "credit.prepayment_speed"
kind = "index"
unit = "ratio"
description = "Prepayment path — a constant speed or a ramp."

[[references]]
reference_id = "credit.default_rate"
kind = "index"
unit = "ratio"

# ---------------------------------------------------------------------------
# Relations
# ---------------------------------------------------------------------------

[[relations]]
relation_id = "holds"
from_family = "party"
to_family = "asset"
cardinality = "many_to_many"
inverse = "held_by"

[[relations]]
relation_id = "services"
from_family = "party"
to_family = "asset"
cardinality = "many_to_many"
inverse = "serviced_by"

[[relations]]
relation_id = "owes"
from_family = "party"
to_family = "asset"
cardinality = "many_to_many"
inverse = "owed_by"

[[relations]]
relation_id = "part_of"
from_family = "asset"
to_family = "asset"
cardinality = "many_to_one"
inverse = "contains"
description = "Optional hierarchy — loans within a pool, or a tranche's claim on one. Never required: a pool models collective behavior perfectly well with no children."

[[relations]]
relation_id = "secured_by"
from_family = "asset"
to_family = "asset"
cardinality = "many_to_many"
inverse = "secures"
description = "A loan against the collateral behind it — which may be an asset from another pack, such as a property."
