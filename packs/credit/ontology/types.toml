# Credit pack ontology — the vocabulary of things a model may declare.
#
# See packs/energy/ontology/types.toml for what the four families mean.
#
# HIERARCHY IS OPTIONAL, AND CREDIT IS THE CASE THAT PROVES IT MATTERS. A
# mortgage-backed security can be modeled as ONE pool asset carrying
# collective behavior — CPR, CDR, severity, recovery lag — or as a COLLECTION
# of individual loans. The pool form is right for pricing and for convention
# work; the loan form is right when the question needs loan-level behavior,
# such as individual default simulation or a scenario that acts on one
# borrower. Both are first-class here. `part_of` exists so a model can be
# built either way, and nothing requires it.

[pack]
ontology_id = "credit"
version = "0.1.0"

# ---------------------------------------------------------------------------
# Assets
# ---------------------------------------------------------------------------

[[entities]]
type_id = "Credit.Asset.LoanPool"
family = "asset"
class = "financial"
refines = "Asset.Financial"
lifecycle = "credit.pool"
description = "A pool of loans modeled by its collective behavior. Needs no children: the pool IS the grain."

[[entities.fields]]
name = "collateral_type"
field_type = "string"
required = false
description = "residential_mortgage | commercial_mortgage | auto | consumer | student | corporate"

[[entities.fields]]
name = "original_balance"
field_type = "decimal"
required = false
unit = "USD"

[[entities.fields]]
name = "weighted_average_coupon"
field_type = "decimal"
required = false
unit = "ratio"

[[entities.fields]]
name = "weighted_average_maturity"
field_type = "integer"
required = false
unit = "months"

[[entities]]
type_id = "Credit.Asset.Loan"
family = "asset"
class = "financial"
refines = "Asset.Financial"
lifecycle = "credit.loan"
description = "A single loan. Use when the model needs loan-level behavior — individual default paths, borrower-level scenarios — otherwise model the pool."

[[entities.fields]]
name = "original_balance"
field_type = "decimal"
required = false
unit = "USD"

[[entities.fields]]
name = "coupon"
field_type = "decimal"
required = false
unit = "ratio"

[[entities.fields]]
name = "term"
field_type = "integer"
required = false
unit = "months"

[[entities.fields]]
name = "days_past_due"
field_type = "number"
required = false
description = """How far past due the loan is. A FIELD, not a state: the industry \
reports delinquency in buckets (30-59, 60-89, 90+) and a bucket is a reading of \
this counter rather than a regime. The 90-day default threshold is a guard on \
it (`docs/36` §2.1)."""

[[entities]]
type_id = "Credit.Asset.Tranche"
family = "asset"
class = "financial"
refines = "Asset.Financial"
description = "A claim of stated seniority on a pool's cash."

[[entities.fields]]
name = "seniority"
field_type = "integer"
required = false
description = "1 is most senior. Ordering, not a rating."

[[entities.fields]]
name = "original_balance"
field_type = "decimal"
required = false
unit = "USD"

# ---------------------------------------------------------------------------
# Parties
# ---------------------------------------------------------------------------

[[entities]]
type_id = "Credit.Party.Issuer"
family = "party"
refines = "Party"

[[entities.fields]]
name = "name"
field_type = "string"
required = false

[[entities]]
type_id = "Credit.Party.Servicer"
family = "party"
refines = "Party"
description = "Collects, advances and works out the collateral."

[[entities.fields]]
name = "name"
field_type = "string"
required = false

[[entities]]
type_id = "Credit.Party.Investor"
family = "party"
refines = "Party"

[[entities.fields]]
name = "name"
field_type = "string"
required = false

[[entities]]
type_id = "Credit.Party.Borrower"
family = "party"
refines = "Party"
description = "Owes under a loan. Named when the model is at loan grain; a pool model has no single borrower."

[[entities.fields]]
name = "name"
field_type = "string"
required = false

# ---------------------------------------------------------------------------
# Lifecycles
#
# A pool never defaults as a whole — it amortizes and its collateral decays, so
# its lifecycle is about the pool's life, not its credit. A LOAN has credit
# states, which is one more reason the two are different types rather than one
# type at two grains.
# ---------------------------------------------------------------------------

[[lifecycles]]
lifecycle_id = "credit.pool"
initial = "amortizing"
states = ["warehouse", "revolving", "amortizing", "rapid_amortization", "retired"]
description = """A pool's structural regime (`docs/36` §2.2). `revolving` is the \
reinvestment period and `rapid_amortization` is early amortization on a trigger \
breach — both universal ABS/CLO regimes with their own cash mechanics. A \
clean-up call is NOT a state: it is an occurrence, and it drives \
`amortizing -> retired` as an event with a no-return topology."""

[[lifecycles.transitions]]
from = "warehouse"
to = "revolving"

[[lifecycles.transitions]]
from = "warehouse"
to = "amortizing"

[[lifecycles.transitions]]
from = "revolving"
to = "amortizing"
description = "The reinvestment period ends and principal begins paying down."

[[lifecycles.transitions]]
from = "revolving"
to = "rapid_amortization"

[[lifecycles.transitions]]
from = "amortizing"
to = "rapid_amortization"
description = "An early amortization trigger breaches."

[[lifecycles.transitions]]
from = "amortizing"
to = "retired"

[[lifecycles.transitions]]
from = "rapid_amortization"
to = "retired"

[[lifecycles]]
lifecycle_id = "credit.loan"
initial = "current"
states = ["current", "delinquent", "defaulted", "in_foreclosure", "liquidated", "prepaid", "matured", "repurchased"]
description = """A loan's condition, named as the standards name it (`docs/36` §2.1). \
Basel BCBS d403 and the EBA guidelines describe a DEFAULTED EXPOSURE, entered \
at 90 days past due OR on unlikeliness-to-pay independently of any day count; \
the MBA's phrasing for enforcement is `in the process of foreclosure`. Both \
are conditions the loan is in, which is why neither is spelled as the event \
that starts it. Delinquency BUCKETS (30-59, 60-89, 90+) are readings of the \
`days_past_due` field, not states."""

[[lifecycles.transitions]]
from = "current"
to = "delinquent"

[[lifecycles.transitions]]
from = "delinquent"
to = "current"
description = "Cure. No probation applies below the default threshold."

[[lifecycles.transitions]]
from = "delinquent"
to = "defaulted"
description = "90 days past due, or unlikeliness to pay at any day count."

[[lifecycles.transitions]]
from = "defaulted"
to = "current"
description = """Cure out of default. The EBA requires a MINIMUM PROBATION PERIOD \
before an exposure returns to performing, so this edge is guarded on a dwell \
counter rather than on payment alone — `on enter defaulted` resets it."""

[[lifecycles.transitions]]
from = "defaulted"
to = "in_foreclosure"

[[lifecycles.transitions]]
from = "in_foreclosure"
to = "current"
description = "Reinstatement before sale, which is ordinary in US practice."

[[lifecycles.transitions]]
from = "in_foreclosure"
to = "liquidated"
description = "Recovery lands, net of severity and after the recovery lag."

[[lifecycles.transitions]]
from = "current"
to = "prepaid"

[[lifecycles.transitions]]
from = "delinquent"
to = "prepaid"
description = "A late borrower can still pay off."

[[lifecycles.transitions]]
from = "defaulted"
to = "prepaid"

[[lifecycles.transitions]]
from = "current"
to = "matured"

[[lifecycles.transitions]]
from = "delinquent"
to = "matured"
description = "Stated maturity arrives whether or not the borrower is current."

[[lifecycles.transitions]]
from = "current"
to = "repurchased"
description = "Fannie Mae zero-balance code 06; a real termination, not a default outcome."

[[lifecycles.transitions]]
from = "delinquent"
to = "repurchased"

[[lifecycles.transitions]]
from = "defaulted"
to = "repurchased"

# ---------------------------------------------------------------------------
# Contracts
# ---------------------------------------------------------------------------

[[contracts]]
type_id = "Credit.Contract.LevelPayPool"
refines = "Contract.Debt"
contract_name = "credit.pool_level_pay"
subject_family = "asset"
description = "Amortizing pool with prepayment, default, severity and recovery lag."

[[contracts.roles]]
name = "holder"
refines = "lender"

[[contracts.roles]]
name = "borrower"
unbound = true

[[contracts.lines]]
name = "principal"

[[contracts.lines]]
name = "prepayment"

[[contracts.lines]]
name = "recovery"

[[contracts.lines]]
name = "servicing"

[[contracts.lines]]
name = "penalty"

[[contracts]]
type_id = "Credit.Contract.InterestOnlyPool"
refines = "Contract.Debt"
contract_name = "credit.pool_io_bullet"
subject_family = "asset"

[[contracts.roles]]
name = "holder"
refines = "lender"

[[contracts.roles]]
name = "borrower"
unbound = true

[[contracts.lines]]
name = "prepayment"

[[contracts.lines]]
name = "principal"

[[contracts.lines]]
name = "recovery"

[[contracts.lines]]
name = "servicing"

[[contracts.lines]]
name = "penalty"

[[contracts]]
type_id = "Credit.Contract.FloatingInterestOnlyPool"
refines = "Contract.Debt"
contract_name = "credit.pool_float_io_bullet"
subject_family = "asset"
description = "Coupon resets off a declared reference rather than being fixed at origination."

[[contracts.roles]]
name = "holder"
refines = "lender"

[[contracts.roles]]
name = "borrower"
unbound = true

[[contracts.lines]]
name = "prepayment"

[[contracts.lines]]
name = "principal"

[[contracts.lines]]
name = "recovery"

[[contracts.lines]]
name = "servicing"

[[contracts.lines]]
name = "penalty"

[[contracts]]
type_id = "Credit.Contract.Purchase"
refines = "Contract.Purchase"
contract_name = "credit.purchase"
subject_family = "asset"
parties = ["buyer", "seller"]

# --- Options: contracts with an election ---------------------------------

[[contracts]]
type_id = "Credit.Contract.CleanUpCall"
refines = "Contract.Option"
subject_family = "asset"
parties = ["holder"]
description = "The issuer's right to retire the pool once it falls below a stated size."

[[contracts.roles]]
name = "issuer"
refines = "grantor"

# ---------------------------------------------------------------------------
# References
# ---------------------------------------------------------------------------
[[references]]
reference_id = "credit.base_rate"
kind = "rate_curve"
unit = "ratio"
description = "Floating base rate a coupon resets off."

[[references]]
reference_id = "credit.prepayment_speed"
kind = "index"
unit = "ratio"
description = "Prepayment path — a constant speed or a ramp."

[[references]]
reference_id = "credit.default_rate"
kind = "index"
unit = "ratio"

# ---------------------------------------------------------------------------
# Relations
# ---------------------------------------------------------------------------

[[relations]]
relation_id = "holds"
from_family = "party"
to_family = "asset"
cardinality = "many_to_many"
inverse = "held_by"

[[relations]]
relation_id = "services"
from_family = "party"
to_family = "asset"
cardinality = "many_to_many"
inverse = "serviced_by"

[[relations]]
relation_id = "owes"
from_family = "party"
to_family = "asset"
cardinality = "many_to_many"
inverse = "owed_by"

[[relations]]
relation_id = "part_of"
from_family = "asset"
to_family = "asset"
cardinality = "many_to_one"
inverse = "contains"
description = "Optional hierarchy — loans within a pool, or a tranche's claim on one. Never required: a pool models collective behavior perfectly well with no children."

[[relations]]
relation_id = "secured_by"
from_family = "asset"
to_family = "asset"
cardinality = "many_to_many"
inverse = "secures"
description = "A loan against the collateral behind it — which may be an asset from another pack, such as a property."
