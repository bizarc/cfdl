# Credit / lending pack v0.1.
#
# Fixed-rate loan pools with CPR prepayments, CDR defaults, loss severity and
# a recovery lag. The engine's expression dialect has no loops, so the pack
# uses the exact closed form for a homogeneous pool under constant SMM/MDR
# (the standard MBS pool-factor decomposition); the benchmark references
# implement the same convention with a month-by-month recursion and must
# agree to the penny.
#
# Convention (documented; matches benchmarks/credit/*/reference_gen.py):
#   ppy      = payments per year: the rule's own payment interval when the
#              contract declares `payment_frequency`, else the model calendar.
#              A monthly-paying pool carried on a daily book has ppy = 12.
#   p        = elapsed PAYMENT periods since term_start (0-based); payment
#              #t = p + 1
#   r        = note_rate / ppy       [NOMINAL annual rate: divide]
#   Two rate bases. Interest accrues on `day_count`; the constant payment is
#   struck on `amortization_day_count`, which defaults to it. Scheduled
#   The scheduled-balance factor S is built from the AMORTIZATION basis too:
#   it describes the path the loan was underwritten to follow, not the rate
#   money accrues at. Only the bare rate multiplier is on the accrual basis.
#   principal is then the PLUG — payment less interest — so an Actual/360 loan
#   holds its payment fixed and lets principal absorb the month-length
#   variation, as loan documents do. With one basis the two collapse and the
#   expression reduces exactly to the classic factor.
#   n        = term_months converted to whole payment periods
#   smm      = cpr_to_periodic(cpr, ppy), mdr = cpr_to_periodic(cdr, ppy)
#              [1 - (1-x)^(1/ppy) — CPR/CDR are EFFECTIVE annual rates, so
#               they take a root. Do not confuse the two conventions.]
#   k_j      = (1 - mdr_j) - smm_j   [survival; additive, see PREPAYMENT BASE]
#   F(p)     = PROD over j < p of k_j                    [cumulative survival]
#   S(p)     = ((1+r)^n - (1+r)^p) / ((1+r)^n - 1)       [sched balance factor]
#   B_beg(p) = balance * S(p) * F(p)                     [level-pay pools]
#   B_beg(p) = balance * F(p)                            [IO/bullet pools]
#
#   F IS A DECLARED STATE, NOT pow(k, p). Every rule below reads
#   `field.credit_<family>_survival<suffix>`, seeded at 1 and stepped once per
#   PAYMENT period. `pow(k, p)` is only the closed form of that product when
#   the hazard is CONSTANT; it is wrong the moment the hazard moves, which is
#   what PSA, SDA and the ABS prepayment convention all do. The state form is
#   correct in both cases and is what makes those conventions reachable at all.
#
#   NOTE THE INDEX: F(p) consumes hazards up to j = p-1, so the state at
#   payment period p reflects the hazard of period p-1. F(0) = 1. Getting this
#   off by one reproduces nothing published.
#
#   THE STATE'S CLOCK IS THE PAYMENT CLOCK, not the model's. Each rule sets
#   `field_every = "{{contract.payment_frequency}}"`, so a pool carried on a
#   daily book but paying monthly compounds twelve times a year, not three
#   hundred and sixty-five. Removing that line makes `make cadence-parity`
#   fail on pack_cadence_credit_daily_monthly_pay, which is the check that
#   proves it. See docs/14_state_and_recurrence.md §8.
#
#   RECOVERIES READ A SECOND, LAGGED STATE. Their factor is F(p - lag)
#   throughout, never F(p), so the recoveries rule declares
#   `field.credit_<family>_survival_lag<suffix>` as its own state: the same
#   recurrence, holding until the lag has elapsed and freezing once the pool
#   has retired. It has no `field_to` because recoveries settle a lag beyond
#   term end, and `term_end + lag` is not expressible as a template date.
#
#   ITS HAZARD AGE IS `elapsed - lag - 1`, NOT `elapsed - 1`. Step j of the
#   lagged state consumes the hazard of age j-1, and j = elapsed - lag. Under a
#   flat hazard the two are identical, so this was wrong for three commits with
#   111 goldens, 19 benchmarks and a lag identity all passing. A ramped
#   reference put it at 7.6% on recoveries by month 60. See
#   benchmarks/credit/mbs_pool_ramped.
#
#   ALL THREE RAMPS ARE INDEXED FROM ORIGINATION, not from the deal's closing.
#   `age_months` is the pool's weighted average age at closing and enters every
#   hazard's age argument; a seasoned pool is already part-way up the curve on
#   its first distribution. Default 0, so a new pool is unaffected. Measured at
#   20 percentage points of note balance on a seasoned pool at 1.50% ABS — see
#   benchmarks/credit/auto_abs_speed_150.
#   Each period: defaults leave at the start of the period (no interest on
#   defaulted balance); interest and scheduled principal accrue on the
#   performing balance.
#
#   PREPAYMENT BASE — SMM is defined on the balance outstanding at the
#   BEGINNING of the period, net of SCHEDULED amortization only; defaults are
#   NOT removed from the base. This pack previously applied SMM to the balance
#   net of defaults, understating prepayments by the default rate and
#   contradicting the definition of the quantity it calls SMM. Checked for
#   parity against the published industry reference schedule.
#
#   The survival factor changes with it, which is not obvious and is worth
#   spelling out. When prepayments are taken from the SURVIVORS the two
#   attritions compose multiplicatively, k = (1 - mdr)(1 - smm). When both are
#   taken from the SAME beginning balance, as the convention specifies, they
#   are additive on that base and k = (1 - mdr) - smm. The difference is the
#   product mdr*smm — 9,993 in period 1 of the reference pool — which compounds
#   over 360 periods. Getting the base right and leaving k alone would have been
#   internally inconsistent, and the published ending balance says so:
#   97,934,244 additive against 97,944,237 multiplicative.
#
#   RECOVERY — a defaulted loan keeps amortizing while it sits in foreclosure,
#   so what is liquidated is the AMORTIZED balance, not face. The loss is
#   severity x the original face; the recovery is the amortized balance less
#   that loss. For a level-pay pool that gives
#       recovery(p) = face(p-lag) * ( S(p)/S(p-lag) - severity )
#   where S is the scheduled balance factor already in the closed forms above,
#   and the ratio reduces to numerators because S shares a denominator.
#
#   Floored at zero. A defaulted loan cannot repay less than nothing, so the
#   loss is capped at the amortized balance. On a 30-year pool the ratio never
#   falls below severity and the floor never binds, which is why the published
#   schedule could not reveal this — it shows up on a short amortizing term,
#   where the balance is nearly gone by the time foreclosure completes.
#
#   This applies to LEVEL-PAY ONLY, and the asymmetry is deliberate: an
#   IO/bullet loan has no scheduled amortization, so its defaulted balance does
#   not amortize in foreclosure and (1 - severity) of face is already correct
#   there. Do not "fix" the IO rules to match.
#
#   ZERO NOTE RATE — supported. The closed form for S(p) is 0/0 at r = 0, so
#   it is written as a ratio of annuity present values instead,
#   S(p) = pv(r, n - p, -1) / pv(r, n, -1), with the level payment factor as
#   -pmt(r, n - p, 1). Both are exact identities of the closed form and both
#   carry the r = 0 limit already, so a 0% promotional pool amortizes straight
#   line with no interest and no special case anywhere. Verified against all
#   107 goldens: byte-identical for every non-zero rate.
#
# Not supported in v0.1 (see packs/credit/README.md):
#   - floating-rate LEVEL-PAY pools (the balance path depends on the rate
#     path; no closed form). Floating IO/bullet pools are supported via
#     `credit.pool_float_io_bullet` + a model `curve` declaration.
#   - stochastic rate paths (stochastic roadmap item 4)
#
# Calendars: all of them. Two distinct daily shapes both work —
#   1. a daily book with monthly payments: declare `payment_frequency = "month"`
#      so ppy = 12 and term_months maps one-for-one onto payment periods. This
#      is the ordinary mortgage/ABS case;
#   2. genuinely daily accrual (warehouse, repo, revolvers): ppy = 365.
# term_months must divide into whole payment periods, which for daily accrual
# means a tenor that is a multiple of 12 months (360 -> 10,950 days).

# ---------------------------------------------------------------------------
# credit.pool_level_pay — amortizing (level-pay) pool.
# ---------------------------------------------------------------------------

[[rules]]
id = "credit_pool_level_pay_interest"
contract_name = "credit.pool_level_pay"
stream_name = "credit.pool.interest{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.collection.interest"
# interest = performing balance * monthly rate
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.term_months}}, ({{contract.balance}} * (pv({{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}} - {{time.elapsed_periods}}, -1) / pv({{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}}, -1)) * field.credit_level_pay_survival{{contract.suffix_ident}}) * (1 - cpr_to_periodic(if({{contract.sda_speed}} == 0, {{contract.cdr}}, {{contract.sda_speed}} * (min(0.0002 * min(max(1, ({{contract.age_months}} + ({{time.elapsed_periods}})) + 1), 30), 0.006) - 0.000095 * max(0, min(max(1, ({{contract.age_months}} + ({{time.elapsed_periods}})) + 1), 120) - 60))), {{model.periods_per_year}})) * ({{contract.rate}} / {{model.accrual_divisor}}), 0)"
field_name = "credit_level_pay_survival{{contract.suffix_ident}}"
field_init = "1"
field_next = "prev * ((1 - cpr_to_periodic(if({{contract.sda_speed}} == 0, {{contract.cdr}}, {{contract.sda_speed}} * (min(0.0002 * min(max(1, ({{contract.age_months}} + ({{time.elapsed_periods}} - 1)) + 1), 30), 0.006) - 0.000095 * max(0, min(max(1, ({{contract.age_months}} + ({{time.elapsed_periods}} - 1)) + 1), 120) - 60))), {{model.periods_per_year}})) - if({{contract.abs_speed}} == 0, cpr_to_periodic(if({{contract.psa_speed}} == 0, {{contract.cpr}}, min({{contract.psa_speed}} * 0.002 * max(1, min(({{contract.age_months}} + ({{time.elapsed_periods}} - 1)) + 1, 30)), 1)), {{model.periods_per_year}}), min({{contract.abs_speed}} / max(1 - {{contract.abs_speed}} * ({{contract.age_months}} + ({{time.elapsed_periods}} - 1)), 0.000001), 1)))"
field_every = "{{contract.payment_frequency}}"
field_from = "{{contract.term_start}}"
field_to = "{{contract.term_end}}"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
psa_speed = "0"
sda_speed = "0"
abs_speed = "0"
age_months = "0"
severity = "0"
recovery_lag_months = "0"

[[rules]]
id = "credit_pool_level_pay_sched_principal"
contract_name = "credit.pool_level_pay"
stream_name = "credit.pool.sched_principal{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.collection.principal"
# scheduled principal = performing balance * c(t), c(t) = r / ((1+r)^(n-p) - 1)
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.term_months}}, ({{contract.balance}} * (pv({{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}} - {{time.elapsed_periods}}, -1) / pv({{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}}, -1)) * field.credit_level_pay_survival{{contract.suffix_ident}}) * (1 - cpr_to_periodic(if({{contract.sda_speed}} == 0, {{contract.cdr}}, {{contract.sda_speed}} * (min(0.0002 * min(max(1, ({{contract.age_months}} + ({{time.elapsed_periods}})) + 1), 30), 0.006) - 0.000095 * max(0, min(max(1, ({{contract.age_months}} + ({{time.elapsed_periods}})) + 1), 120) - 60))), {{model.periods_per_year}})) * ((-pmt({{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}} - {{time.elapsed_periods}}, 1)) - ({{contract.rate}} / {{model.accrual_divisor}})), 0)"
field_name = "credit_level_pay_survival{{contract.suffix_ident}}"
field_init = "1"
field_next = "prev * ((1 - cpr_to_periodic(if({{contract.sda_speed}} == 0, {{contract.cdr}}, {{contract.sda_speed}} * (min(0.0002 * min(max(1, ({{contract.age_months}} + ({{time.elapsed_periods}} - 1)) + 1), 30), 0.006) - 0.000095 * max(0, min(max(1, ({{contract.age_months}} + ({{time.elapsed_periods}} - 1)) + 1), 120) - 60))), {{model.periods_per_year}})) - if({{contract.abs_speed}} == 0, cpr_to_periodic(if({{contract.psa_speed}} == 0, {{contract.cpr}}, min({{contract.psa_speed}} * 0.002 * max(1, min(({{contract.age_months}} + ({{time.elapsed_periods}} - 1)) + 1, 30)), 1)), {{model.periods_per_year}}), min({{contract.abs_speed}} / max(1 - {{contract.abs_speed}} * ({{contract.age_months}} + ({{time.elapsed_periods}} - 1)), 0.000001), 1)))"
field_every = "{{contract.payment_frequency}}"
field_from = "{{contract.term_start}}"
field_to = "{{contract.term_end}}"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
psa_speed = "0"
sda_speed = "0"
abs_speed = "0"
age_months = "0"
severity = "0"
recovery_lag_months = "0"

[[rules]]
id = "credit_pool_level_pay_prepay"
contract_name = "credit.pool_level_pay"
stream_name = "credit.pool.prepay{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.collection.prepayment"
# prepayment = (performing - scheduled principal) * smm
#            = performing * (1 - c(t)) * smm
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.term_months}}, ({{contract.balance}} * (pv({{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}} - {{time.elapsed_periods}}, -1) / pv({{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}}, -1)) * field.credit_level_pay_survival{{contract.suffix_ident}}) * (1 - ((-pmt({{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}} - {{time.elapsed_periods}}, 1)) - ({{contract.rate}} / {{model.accrual_divisor}}))) * if({{contract.abs_speed}} == 0, cpr_to_periodic(if({{contract.psa_speed}} == 0, {{contract.cpr}}, min({{contract.psa_speed}} * 0.002 * max(1, min(({{contract.age_months}} + ({{time.elapsed_periods}})) + 1, 30)), 1)), {{model.periods_per_year}}), min({{contract.abs_speed}} / max(1 - {{contract.abs_speed}} * ({{contract.age_months}} + ({{time.elapsed_periods}})), 0.000001), 1)), 0)"
field_name = "credit_level_pay_survival{{contract.suffix_ident}}"
field_init = "1"
field_next = "prev * ((1 - cpr_to_periodic(if({{contract.sda_speed}} == 0, {{contract.cdr}}, {{contract.sda_speed}} * (min(0.0002 * min(max(1, ({{contract.age_months}} + ({{time.elapsed_periods}} - 1)) + 1), 30), 0.006) - 0.000095 * max(0, min(max(1, ({{contract.age_months}} + ({{time.elapsed_periods}} - 1)) + 1), 120) - 60))), {{model.periods_per_year}})) - if({{contract.abs_speed}} == 0, cpr_to_periodic(if({{contract.psa_speed}} == 0, {{contract.cpr}}, min({{contract.psa_speed}} * 0.002 * max(1, min(({{contract.age_months}} + ({{time.elapsed_periods}} - 1)) + 1, 30)), 1)), {{model.periods_per_year}}), min({{contract.abs_speed}} / max(1 - {{contract.abs_speed}} * ({{contract.age_months}} + ({{time.elapsed_periods}} - 1)), 0.000001), 1)))"
field_every = "{{contract.payment_frequency}}"
field_from = "{{contract.term_start}}"
field_to = "{{contract.term_end}}"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
psa_speed = "0"
sda_speed = "0"
abs_speed = "0"
age_months = "0"
severity = "0"
recovery_lag_months = "0"

[[rules]]
id = "credit_pool_level_pay_recoveries"
contract_name = "credit.pool_level_pay"
stream_name = "credit.pool.recoveries{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.collection.recovery"
# recovery(p) = default(p - lag) * (1 - severity)
#             = B_beg(p - lag) * mdr * (1 - severity)
#     [B_beg(p - lag) carries F(p - lag), hence the lagged field.]
# Set the contract term to cover term_months + recovery_lag_months so the
# recovery tail has schedule periods.
amount_expr = "if({{time.elapsed_periods}} >= {{whole_periods.recovery_lag_months}} and {{time.elapsed_periods}} < {{whole_periods.term_months}} + {{whole_periods.recovery_lag_months}}, ({{contract.balance}} * (pv({{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}} - ({{time.elapsed_periods}} - {{whole_periods.recovery_lag_months}}), -1) / pv({{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}}, -1)) * field.credit_level_pay_survival_lag{{contract.suffix_ident}}) * cpr_to_periodic(if({{contract.sda_speed}} == 0, {{contract.cdr}}, {{contract.sda_speed}} * (min(0.0002 * min(max(1, ({{contract.age_months}} + ({{time.elapsed_periods}} - {{whole_periods.recovery_lag_months}})) + 1), 30), 0.006) - 0.000095 * max(0, min(max(1, ({{contract.age_months}} + ({{time.elapsed_periods}} - {{whole_periods.recovery_lag_months}})) + 1), 120) - 60))), {{model.periods_per_year}}) * max(0, (pv({{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}} - {{time.elapsed_periods}}, -1) / pv({{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}} - ({{time.elapsed_periods}} - {{whole_periods.recovery_lag_months}}), -1)) - {{contract.severity}}), 0)"
field_name = "credit_level_pay_survival_lag{{contract.suffix_ident}}"
field_init = "1"
field_next = "if({{time.elapsed_periods}} > {{whole_periods.recovery_lag_months}} and {{time.elapsed_periods}} - {{whole_periods.recovery_lag_months}} < {{whole_periods.term_months}}, prev * ((1 - cpr_to_periodic(if({{contract.sda_speed}} == 0, {{contract.cdr}}, {{contract.sda_speed}} * (min(0.0002 * min(max(1, ({{contract.age_months}} + ({{time.elapsed_periods}} - {{whole_periods.recovery_lag_months}} - 1)) + 1), 30), 0.006) - 0.000095 * max(0, min(max(1, ({{contract.age_months}} + ({{time.elapsed_periods}} - {{whole_periods.recovery_lag_months}} - 1)) + 1), 120) - 60))), {{model.periods_per_year}})) - if({{contract.abs_speed}} == 0, cpr_to_periodic(if({{contract.psa_speed}} == 0, {{contract.cpr}}, min({{contract.psa_speed}} * 0.002 * max(1, min(({{contract.age_months}} + ({{time.elapsed_periods}} - {{whole_periods.recovery_lag_months}} - 1)) + 1, 30)), 1)), {{model.periods_per_year}}), min({{contract.abs_speed}} / max(1 - {{contract.abs_speed}} * ({{contract.age_months}} + ({{time.elapsed_periods}} - {{whole_periods.recovery_lag_months}} - 1)), 0.000001), 1))), prev)"
field_every = "{{contract.payment_frequency}}"
field_from = "{{contract.term_start}}"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
psa_speed = "0"
sda_speed = "0"
abs_speed = "0"
age_months = "0"
severity = "0"
recovery_lag_months = "0"

[[rules]]
id = "credit_pool_level_pay_servicing"
contract_name = "credit.pool_level_pay"
stream_name = "credit.pool.servicing{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "outflow"
category = "operating.expense.servicing"
# Servicing fee accrues on the performing balance (a NOMINAL annual rate, so
# rate / ppy).
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.term_months}}, ({{contract.balance}} * (pv({{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}} - {{time.elapsed_periods}}, -1) / pv({{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}}, -1)) * field.credit_level_pay_survival{{contract.suffix_ident}}) * (1 - cpr_to_periodic(if({{contract.sda_speed}} == 0, {{contract.cdr}}, {{contract.sda_speed}} * (min(0.0002 * min(max(1, ({{contract.age_months}} + ({{time.elapsed_periods}})) + 1), 30), 0.006) - 0.000095 * max(0, min(max(1, ({{contract.age_months}} + ({{time.elapsed_periods}})) + 1), 120) - 60))), {{model.periods_per_year}})) * ({{contract.servicing_fee}} / {{model.accrual_divisor}}), 0)"
field_name = "credit_level_pay_survival{{contract.suffix_ident}}"
field_init = "1"
field_next = "prev * ((1 - cpr_to_periodic(if({{contract.sda_speed}} == 0, {{contract.cdr}}, {{contract.sda_speed}} * (min(0.0002 * min(max(1, ({{contract.age_months}} + ({{time.elapsed_periods}} - 1)) + 1), 30), 0.006) - 0.000095 * max(0, min(max(1, ({{contract.age_months}} + ({{time.elapsed_periods}} - 1)) + 1), 120) - 60))), {{model.periods_per_year}})) - if({{contract.abs_speed}} == 0, cpr_to_periodic(if({{contract.psa_speed}} == 0, {{contract.cpr}}, min({{contract.psa_speed}} * 0.002 * max(1, min(({{contract.age_months}} + ({{time.elapsed_periods}} - 1)) + 1, 30)), 1)), {{model.periods_per_year}}), min({{contract.abs_speed}} / max(1 - {{contract.abs_speed}} * ({{contract.age_months}} + ({{time.elapsed_periods}} - 1)), 0.000001), 1)))"
field_every = "{{contract.payment_frequency}}"
field_from = "{{contract.term_start}}"
field_to = "{{contract.term_end}}"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
psa_speed = "0"
sda_speed = "0"
abs_speed = "0"
age_months = "0"
severity = "0"
recovery_lag_months = "0"
servicing_fee = "0"

[[rules]]
id = "credit_pool_level_pay_penalty"
contract_name = "credit.pool_level_pay"
stream_name = "credit.pool.penalty{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
category = "operating.collection.penalty"
# Prepayment penalty: flat rate on voluntary prepayments (simplified yield
# maintenance; full make-whole needs a discounting engine primitive).
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.term_months}}, ({{contract.balance}} * (pv({{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}} - {{time.elapsed_periods}}, -1) / pv({{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}}, -1)) * field.credit_level_pay_survival{{contract.suffix_ident}}) * (1 - ((-pmt({{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}} - {{time.elapsed_periods}}, 1)) - ({{contract.rate}} / {{model.accrual_divisor}}))) * if({{contract.abs_speed}} == 0, cpr_to_periodic(if({{contract.psa_speed}} == 0, {{contract.cpr}}, min({{contract.psa_speed}} * 0.002 * max(1, min(({{contract.age_months}} + ({{time.elapsed_periods}})) + 1, 30)), 1)), {{model.periods_per_year}}), min({{contract.abs_speed}} / max(1 - {{contract.abs_speed}} * ({{contract.age_months}} + ({{time.elapsed_periods}})), 0.000001), 1)) * {{contract.prepay_penalty_rate}}, 0)"
field_name = "credit_level_pay_survival{{contract.suffix_ident}}"
field_init = "1"
