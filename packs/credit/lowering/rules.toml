# Credit / lending pack v0.1.
#
# Fixed-rate loan pools with CPR prepayments, CDR defaults, loss severity and
# a recovery lag. The engine's expression dialect has no loops, so the pack
# uses the exact closed form for a homogeneous pool under constant SMM/MDR
# (the standard MBS pool-factor decomposition); the benchmark references
# implement the same convention with a month-by-month recursion and must
# agree to the penny.
#
# Convention (documented; matches benchmarks/credit/*/reference_gen.py):
#   ppy      = payments per year: the rule's own payment interval when the
#              contract declares `payment_frequency`, else the model calendar.
#              A monthly-paying pool carried on a daily book has ppy = 12.
#   p        = elapsed PAYMENT periods since term_start (0-based); payment
#              #t = p + 1
#   r        = note_rate / ppy       [NOMINAL annual rate: divide]
#   Two rate bases. Interest accrues on `day_count`; the constant payment is
#   struck on `amortization_day_count`, which defaults to it. Scheduled
#   The scheduled-balance factor S is built from the AMORTISATION basis too:
#   it describes the path the loan was underwritten to follow, not the rate
#   money accrues at. Only the bare rate multiplier is on the accrual basis.
#   principal is then the PLUG — payment less interest — so an Actual/360 loan
#   holds its payment fixed and lets principal absorb the month-length
#   variation, as loan documents do. With one basis the two collapse and the
#   expression reduces exactly to the classic factor.
#   n        = term_months converted to whole payment periods
#   smm      = cpr_to_periodic(cpr, ppy), mdr = cpr_to_periodic(cdr, ppy)
#              [1 - (1-x)^(1/ppy) — CPR/CDR are EFFECTIVE annual rates, so
#               they take a root. Do not confuse the two conventions.]
#   k        = (1 - mdr) - smm      [survival; additive, see PREPAYMENT BASE]
#   S(p)     = ((1+r)^n - (1+r)^p) / ((1+r)^n - 1)       [sched balance factor]
#   B_beg(p) = balance * S(p) * k^p                      [level-pay pools]
#   B_beg(p) = balance * k^p                             [IO/bullet pools]
#   Each period: defaults leave at the start of the period (no interest on
#   defaulted balance); interest and scheduled principal accrue on the
#   performing balance.
#
#   PREPAYMENT BASE — SMM is defined on the balance outstanding at the
#   BEGINNING of the period, net of SCHEDULED amortisation only; defaults are
#   NOT removed from the base. This pack previously applied SMM to the balance
#   net of defaults, understating prepayments by the default rate and
#   contradicting the definition of the quantity it calls SMM. Checked for
#   parity against the published industry reference schedule.
#
#   The survival factor changes with it, which is not obvious and is worth
#   spelling out. When prepayments are taken from the SURVIVORS the two
#   attritions compose multiplicatively, k = (1 - mdr)(1 - smm). When both are
#   taken from the SAME beginning balance, as the convention specifies, they
#   are additive on that base and k = (1 - mdr) - smm. The difference is the
#   product mdr*smm — 9,993 in period 1 of the reference pool — which compounds
#   over 360 periods. Getting the base right and leaving k alone would have been
#   internally inconsistent, and the published ending balance says so:
#   97,934,244 additive against 97,944,237 multiplicative.
#
#   RECOVERY — a defaulted loan keeps amortising while it sits in foreclosure,
#   so what is liquidated is the AMORTISED balance, not face. The loss is
#   severity x the original face; the recovery is the amortised balance less
#   that loss. For a level-pay pool that gives
#       recovery(p) = face(p-lag) * ( S(p)/S(p-lag) - severity )
#   where S is the scheduled balance factor already in the closed forms above,
#   and the ratio reduces to numerators because S shares a denominator.
#
#   Floored at zero. A defaulted loan cannot repay less than nothing, so the
#   loss is capped at the amortised balance. On a 30-year pool the ratio never
#   falls below severity and the floor never binds, which is why the published
#   schedule could not reveal this — it shows up on a short amortising term,
#   where the balance is nearly gone by the time foreclosure completes.
#
#   This applies to LEVEL-PAY ONLY, and the asymmetry is deliberate: an
#   IO/bullet loan has no scheduled amortisation, so its defaulted balance does
#   not amortise in foreclosure and (1 - severity) of face is already correct
#   there. Do not "fix" the IO rules to match.
#
# Not supported in v0.1 (see packs/credit/README.md):
#   - zero note rate on level-pay pools (S(p) is undefined at r = 0)
#   - floating-rate LEVEL-PAY pools (the balance path depends on the rate
#     path; no closed form). Floating IO/bullet pools are supported via
#     `credit.pool_float_io_bullet` + a model `curve` declaration.
#   - stochastic rate paths (stochastic roadmap item 4)
#
# Calendars: all of them. Two distinct daily shapes both work —
#   1. a daily book with monthly payments: declare `payment_frequency = "month"`
#      so ppy = 12 and term_months maps one-for-one onto payment periods. This
#      is the ordinary mortgage/ABS case;
#   2. genuinely daily accrual (warehouse, repo, revolvers): ppy = 365.
# term_months must divide into whole payment periods, which for daily accrual
# means a tenor that is a multiple of 12 months (360 -> 10,950 days).

# ---------------------------------------------------------------------------
# credit.pool_level_pay — amortizing (level-pay) pool.
# ---------------------------------------------------------------------------

[[rules]]
id = "credit_pool_level_pay_interest"
contract_name = "credit.pool_level_pay"
stream_name = "credit.pool.interest{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
# interest = performing balance * monthly rate
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.term_months}}, ({{contract.balance}} * ((pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}}) - pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{time.elapsed_periods}})) / (pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}}) - 1)) * pow(((1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) - cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}})), {{time.elapsed_periods}})) * (1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) * ({{contract.rate}} / {{model.accrual_divisor}}), 0)"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
severity = "0"
recovery_lag_months = "0"

[[rules]]
id = "credit_pool_level_pay_sched_principal"
contract_name = "credit.pool_level_pay"
stream_name = "credit.pool.sched_principal{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
# scheduled principal = performing balance * c(t), c(t) = r / ((1+r)^(n-p) - 1)
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.term_months}}, ({{contract.balance}} * ((pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}}) - pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{time.elapsed_periods}})) / (pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}}) - 1)) * pow(((1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) - cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}})), {{time.elapsed_periods}})) * (1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) * (({{contract.rate}} / {{model.amortization_divisor}}) + ({{contract.rate}} / {{model.amortization_divisor}}) / (pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}} - {{time.elapsed_periods}}) - 1) - ({{contract.rate}} / {{model.accrual_divisor}})), 0)"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
severity = "0"
recovery_lag_months = "0"

[[rules]]
id = "credit_pool_level_pay_prepay"
contract_name = "credit.pool_level_pay"
stream_name = "credit.pool.prepay{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
# prepayment = (performing - scheduled principal) * smm
#            = performing * (1 - c(t)) * smm
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.term_months}}, ({{contract.balance}} * ((pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}}) - pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{time.elapsed_periods}})) / (pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}}) - 1)) * pow(((1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) - cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}})), {{time.elapsed_periods}})) * (1 - ({{contract.rate}} / {{model.accrual_divisor}}) / (pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}} - {{time.elapsed_periods}}) - 1)) * cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}}), 0)"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
severity = "0"
recovery_lag_months = "0"

[[rules]]
id = "credit_pool_level_pay_recoveries"
contract_name = "credit.pool_level_pay"
stream_name = "credit.pool.recoveries{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
# recovery(p) = default(p - lag) * (1 - severity)
#             = B_beg(p - lag) * mdr * (1 - severity)
# Set the contract term to cover term_months + recovery_lag_months so the
# recovery tail has schedule periods.
amount_expr = "if({{time.elapsed_periods}} >= {{whole_periods.recovery_lag_months}} and {{time.elapsed_periods}} < {{whole_periods.term_months}} + {{whole_periods.recovery_lag_months}}, ({{contract.balance}} * ((pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}}) - pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{time.elapsed_periods}} - {{whole_periods.recovery_lag_months}})) / (pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}}) - 1)) * pow(((1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) - cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}})), {{time.elapsed_periods}} - {{whole_periods.recovery_lag_months}})) * cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}}) * max(0, ((pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}}) - pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{time.elapsed_periods}})) / (pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}}) - pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{time.elapsed_periods}} - {{whole_periods.recovery_lag_months}}))) - {{contract.severity}}), 0)"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
severity = "0"
recovery_lag_months = "0"

[[rules]]
id = "credit_pool_level_pay_servicing"
contract_name = "credit.pool_level_pay"
stream_name = "credit.pool.servicing{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "outflow"
# Servicing fee accrues on the performing balance (a NOMINAL annual rate, so
# rate / ppy).
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.term_months}}, ({{contract.balance}} * ((pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}}) - pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{time.elapsed_periods}})) / (pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}}) - 1)) * pow(((1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) - cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}})), {{time.elapsed_periods}})) * (1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) * ({{contract.servicing_fee}} / {{model.accrual_divisor}}), 0)"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
severity = "0"
recovery_lag_months = "0"
servicing_fee = "0"

[[rules]]
id = "credit_pool_level_pay_penalty"
contract_name = "credit.pool_level_pay"
stream_name = "credit.pool.penalty{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
# Prepayment penalty: flat rate on voluntary prepayments (simplified yield
# maintenance; full make-whole needs a discounting engine primitive).
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.term_months}}, ({{contract.balance}} * ((pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}}) - pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{time.elapsed_periods}})) / (pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}}) - 1)) * pow(((1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) - cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}})), {{time.elapsed_periods}})) * (1 - ({{contract.rate}} / {{model.accrual_divisor}}) / (pow(1 + {{contract.rate}} / {{model.amortization_divisor}}, {{whole_periods.term_months}} - {{time.elapsed_periods}}) - 1)) * cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}}) * {{contract.prepay_penalty_rate}}, 0)"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
severity = "0"
recovery_lag_months = "0"
prepay_penalty_rate = "0"

# ---------------------------------------------------------------------------
# credit.pool_io_bullet — interest-only pool, principal bullet at maturity.
# Balance declines only through prepayment and default: B_beg(p) = balance * k^p.
# Final period (p = n-1): no SMM prepayment; the whole performing balance
# pays as the bullet.
# ---------------------------------------------------------------------------

[[rules]]
id = "credit_pool_io_bullet_interest"
contract_name = "credit.pool_io_bullet"
stream_name = "credit.pool.interest{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.term_months}}, {{contract.balance}} * pow(((1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) - cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}})), {{time.elapsed_periods}}) * (1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) * ({{contract.rate}} / {{model.accrual_divisor}}), 0)"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
severity = "0"
recovery_lag_months = "0"

[[rules]]
id = "credit_pool_io_bullet_prepay"
contract_name = "credit.pool_io_bullet"
stream_name = "credit.pool.prepay{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.term_months}} - 1, {{contract.balance}} * pow(((1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) - cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}})), {{time.elapsed_periods}}) * cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}}), 0)"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
severity = "0"
recovery_lag_months = "0"

[[rules]]
id = "credit_pool_io_bullet_bullet"
contract_name = "credit.pool_io_bullet"
stream_name = "credit.pool.bullet{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
amount_expr = "if({{time.elapsed_periods}} == {{whole_periods.term_months}} - 1, {{contract.balance}} * pow(((1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) - cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}})), {{time.elapsed_periods}}) * (1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})), 0)"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
severity = "0"
recovery_lag_months = "0"

[[rules]]
id = "credit_pool_io_bullet_recoveries"
contract_name = "credit.pool_io_bullet"
stream_name = "credit.pool.recoveries{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
amount_expr = "if({{time.elapsed_periods}} >= {{whole_periods.recovery_lag_months}} and {{time.elapsed_periods}} < {{whole_periods.term_months}} + {{whole_periods.recovery_lag_months}}, {{contract.balance}} * pow(((1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) - cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}})), {{time.elapsed_periods}} - {{whole_periods.recovery_lag_months}}) * cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}}) * (1 - {{contract.severity}}), 0)"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
severity = "0"
recovery_lag_months = "0"

[[rules]]
id = "credit_pool_io_bullet_servicing"
contract_name = "credit.pool_io_bullet"
stream_name = "credit.pool.servicing{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "outflow"
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.term_months}}, {{contract.balance}} * pow(((1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) - cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}})), {{time.elapsed_periods}}) * (1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) * ({{contract.servicing_fee}} / {{model.accrual_divisor}}), 0)"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
severity = "0"
recovery_lag_months = "0"
servicing_fee = "0"

[[rules]]
id = "credit_pool_io_bullet_penalty"
contract_name = "credit.pool_io_bullet"
stream_name = "credit.pool.penalty{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.term_months}} - 1, {{contract.balance}} * pow(((1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) - cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}})), {{time.elapsed_periods}}) * cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}}) * {{contract.prepay_penalty_rate}}, 0)"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
severity = "0"
recovery_lag_months = "0"
prepay_penalty_rate = "0"

# ---------------------------------------------------------------------------
# credit.pool_float_io_bullet — floating-rate interest-only pool, bullet at
# maturity. The coupon indexes off a model-declared `curve` statement:
#   coupon(p) = clamp(curve_value(index_curve, date) + margin, rate_floor, rate_cap)
# Balance dynamics (prepay/default/bullet/recoveries) are rate-independent
# and identical to pool_io_bullet. Floating LEVEL-PAY pools have no closed
# form (the balance path depends on the rate path) and are not in v0.1.
# ---------------------------------------------------------------------------

[[rules]]
id = "credit_pool_float_io_bullet_interest"
contract_name = "credit.pool_float_io_bullet"
stream_name = "credit.pool.interest{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.term_months}}, {{contract.balance}} * pow(((1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) - cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}})), {{time.elapsed_periods}}) * (1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) * clamp(curve_value(\"{{contract.index_curve}}\", time.date) + {{contract.margin}}, {{contract.rate_floor}}, {{contract.rate_cap}}) / {{model.accrual_divisor}}, 0)"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
severity = "0"
recovery_lag_months = "0"
margin = "0"
rate_floor = "0"
rate_cap = "1"

[[rules]]
id = "credit_pool_float_io_bullet_prepay"
contract_name = "credit.pool_float_io_bullet"
stream_name = "credit.pool.prepay{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.term_months}} - 1, {{contract.balance}} * pow(((1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) - cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}})), {{time.elapsed_periods}}) * cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}}), 0)"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
severity = "0"
recovery_lag_months = "0"

[[rules]]
id = "credit_pool_float_io_bullet_bullet"
contract_name = "credit.pool_float_io_bullet"
stream_name = "credit.pool.bullet{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
amount_expr = "if({{time.elapsed_periods}} == {{whole_periods.term_months}} - 1, {{contract.balance}} * pow(((1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) - cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}})), {{time.elapsed_periods}}) * (1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})), 0)"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
severity = "0"
recovery_lag_months = "0"

[[rules]]
id = "credit_pool_float_io_bullet_recoveries"
contract_name = "credit.pool_float_io_bullet"
stream_name = "credit.pool.recoveries{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
amount_expr = "if({{time.elapsed_periods}} >= {{whole_periods.recovery_lag_months}} and {{time.elapsed_periods}} < {{whole_periods.term_months}} + {{whole_periods.recovery_lag_months}}, {{contract.balance}} * pow(((1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) - cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}})), {{time.elapsed_periods}} - {{whole_periods.recovery_lag_months}}) * cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}}) * (1 - {{contract.severity}}), 0)"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
severity = "0"
recovery_lag_months = "0"

[[rules]]
id = "credit_pool_float_io_bullet_servicing"
contract_name = "credit.pool_float_io_bullet"
stream_name = "credit.pool.servicing{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "outflow"
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.term_months}}, {{contract.balance}} * pow(((1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) - cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}})), {{time.elapsed_periods}}) * (1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) * ({{contract.servicing_fee}} / {{model.accrual_divisor}}), 0)"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
severity = "0"
recovery_lag_months = "0"
servicing_fee = "0"

[[rules]]
id = "credit_pool_float_io_bullet_penalty"
contract_name = "credit.pool_float_io_bullet"
stream_name = "credit.pool.penalty{{contract.dot_suffix}}"
owner_entity = "${subject}"
direction = "inflow"
amount_expr = "if({{time.elapsed_periods}} < {{whole_periods.term_months}} - 1, {{contract.balance}} * pow(((1 - cpr_to_periodic({{contract.cdr}}, {{model.periods_per_year}})) - cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}})), {{time.elapsed_periods}}) * cpr_to_periodic({{contract.cpr}}, {{model.periods_per_year}}) * {{contract.prepay_penalty_rate}}, 0)"
schedule_kind = "every"
schedule_every = "{{contract.payment_frequency}}"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
payment_frequency = ""
cpr = "0"
cdr = "0"
severity = "0"
recovery_lag_months = "0"
prepay_penalty_rate = "0"

