name = "credit"
version = "0.1.0"
description = "Credit / lending pack v0.1: fixed-rate loan pools (level-pay, IO/bullet) with CPR prepayments, CDR defaults, severity and recovery lag."

# Closed vocabulary for a stream's `category`. Aggregation reads this rather
# than pattern-matching a stream's name. Shaped by how pool collections are
# reported; see README.md for why prepayment and recovery stand apart.
categories = [
  "operating.collection.interest",
  "operating.collection.principal",
  "operating.collection.prepayment",
  "operating.collection.recovery",
  "operating.expense.servicing",
  "operating.collection.penalty",
  "investing.purchase",
]


[entrypoints]
aliases = "aliases.toml"
lowering = "lowering/rules.toml"
metrics = "metrics.toml"
statements = "statements.toml"
validations = "validations.toml"
