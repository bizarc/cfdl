# Credit domain metrics, evaluated in order (ratios may reference earlier ids).

[[metrics]]
id = "domain.credit.interest"
kind = "money"
op = "sum"
numerator_streams = ["credit.pool.interest", "credit.pool.interest.*"]
formula = "sum(numerator_streams)"

[[metrics]]
id = "domain.credit.principal"
kind = "money"
op = "sum"
numerator_streams = [
  "credit.pool.sched_principal",
  "credit.pool.sched_principal.*",
  "credit.pool.prepay",
  "credit.pool.prepay.*",
  "credit.pool.bullet",
  "credit.pool.bullet.*",
]
formula = "sum(numerator_streams)"

[[metrics]]
id = "domain.credit.recoveries"
kind = "money"
op = "sum"
numerator_streams = ["credit.pool.recoveries", "credit.pool.recoveries.*"]
formula = "sum(numerator_streams)"

[[metrics]]
id = "domain.credit.collections"
kind = "money"
op = "sum"
numerator_streams = [
  "credit.pool.interest",
  "credit.pool.interest.*",
  "credit.pool.sched_principal",
  "credit.pool.sched_principal.*",
  "credit.pool.prepay",
  "credit.pool.prepay.*",
  "credit.pool.bullet",
  "credit.pool.bullet.*",
  "credit.pool.recoveries",
  "credit.pool.recoveries.*",
]
formula = "sum(numerator_streams)"

[[metrics]]
id = "domain.credit.purchase"
kind = "money"
op = "negated_sum"
numerator_streams = ["credit.purchase.price", "credit.purchase.price.*"]
formula = "-sum(numerator_streams)"
require_positive = true

[[metrics]]
id = "domain.credit.collections_multiple"
kind = "number"
op = "ratio"
numerator_metric = "domain.credit.collections"
denominator_metric = "domain.credit.purchase"
formula = "domain.credit.collections / domain.credit.purchase"
