# Credit domain metrics, evaluated in order (ratios may reference earlier ids).

[[metrics]]
id = "domain.credit.interest"
kind = "money"
op = "sum"
numerator_streams = ["credit.loan.interest.*"]
formula = "sum(numerator_streams)"

[[metrics]]
id = "domain.credit.principal"
kind = "money"
op = "sum"
numerator_streams = [
  "credit.loan.sched_principal.*",
  "credit.loan.prepay.*",
  "credit.loan.bullet.*",
]
formula = "sum(numerator_streams)"

[[metrics]]
id = "domain.credit.recoveries"
kind = "money"
op = "sum"
numerator_streams = ["credit.loan.recoveries.*"]
formula = "sum(numerator_streams)"

[[metrics]]
id = "domain.credit.penalties"
kind = "money"
op = "sum"
numerator_streams = ["credit.loan.penalty.*"]
formula = "sum(numerator_streams)"

[[metrics]]
id = "domain.credit.servicing"
kind = "money"
op = "negated_sum"
numerator_streams = ["credit.loan.servicing.*"]
formula = "-sum(numerator_streams)"
require_positive = true

# Principal-weighted average life in years over principal returned to the
# investor (scheduled + prepayments + bullet + recoveries; interest and
# penalties excluded).
[[metrics]]
id = "domain.credit.wal_years"
kind = "number"
op = "wal_years"
numerator_streams = [
  "credit.loan.sched_principal.*",
  "credit.loan.prepay.*",
  "credit.loan.bullet.*",
  "credit.loan.recoveries.*",
]
formula = "wal_years(numerator_streams)"

[[metrics]]
id = "domain.credit.collections"
kind = "money"
op = "sum"
numerator_streams = [
  "credit.loan.interest.*",
  "credit.loan.sched_principal.*",
  "credit.loan.prepay.*",
  "credit.loan.bullet.*",
  "credit.loan.recoveries.*",
  "credit.loan.penalty.*",
]
formula = "sum(numerator_streams)"

[[metrics]]
id = "domain.credit.purchase"
kind = "money"
op = "negated_sum"
numerator_streams = ["credit.purchase.price.*"]
formula = "-sum(numerator_streams)"
require_positive = true

[[metrics]]
id = "domain.credit.collections_multiple"
kind = "number"
op = "ratio"
numerator_metric = "domain.credit.collections"
denominator_metric = "domain.credit.purchase"
formula = "domain.credit.collections / domain.credit.purchase"
