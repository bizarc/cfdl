# Credit contract templates — the conventional starting set, offered by the
# editor as snippets and assembled into starting models by the MCP `skeleton`
# tool. Defaults are the values the benchmark suite validates
# (benchmarks/credit/level_pay_pool, io_bullet_loan), not measurements — a
# real deal states its own.
#
# `${key}` placeholders resolve from the request, then from [templates.defaults].

[[templates]]
id = "credit.pool_level_pay"
label = "Amortizing pool — level pay with CPR/CDR/severity"
kind = "contract"
body = """
contract credit.pool_level_pay {
  term ${term_start}..${term_end}
  terms {
    balance = ${balance}
    rate = ${rate}
    term_months = ${term_months}
    cpr = ${cpr}
    cdr = ${cdr}
    severity = ${severity}
    recovery_lag_months = ${recovery_lag_months}
    servicing_fee = ${servicing_fee}
  }
}
"""
[templates.defaults]
term_start = "2026-01"
term_end = "2036-06"
balance = "25000000"
rate = "0.065"
term_months = "120"
cpr = "0.08"
cdr = "0.02"
severity = "0.35"
recovery_lag_months = "6"
servicing_fee = "0.005"

[[templates]]
id = "credit.pool_io_bullet"
label = "Interest-only pool — bullet maturity"
kind = "contract"
body = """
contract credit.pool_io_bullet {
  term ${term_start}..${term_end}
  terms {
    balance = ${balance}
    rate = ${rate}
