# Credit contract templates — the conventional starting set, offered by the
# editor as snippets (the LSP reads these for completion and `applyTemplate`).
#
# Each template carries the terms its rule REQUIRES, with a conventional value
# where a convention exists and zero where only the deal knows. A term may hold
# an expression, so a varying rate is written directly —
# `growth_rate = curve_value("cpi", time.date)` — and no template offers a
# curve-selector twin.
#
# `${key}` placeholders resolve from the request, then from
# [templates.defaults].

[[templates]]
id = "credit.pool_level_pay"
label = "Level-pay pool (six collection streams)"
kind = "contract"
body = """
contract credit.pool_level_pay.pool_a {
  term ${term_start}..${term_end}
  terms {
    principal = ${principal}
    interest_rate = ${interest_rate}
    term_months = ${term_months}
    severity = ${severity}
    servicing_fee = ${servicing_fee}
  }
}
"""
[templates.defaults]
term_start = "2026-01"
term_end = "2031-12"
principal = "10000000"
interest_rate = "0.06"
term_months = "72"
severity = "0"
servicing_fee = "0"

[[templates]]
id = "credit.pool_io_bullet"
label = "Interest-only pool, bullet at maturity"
kind = "contract"
body = """
contract credit.pool_io_bullet.pool_a {
  term ${term_start}..${term_end}
  terms {
    principal = ${principal}
    interest_rate = ${interest_rate}
    term_months = ${term_months}
  }
}
"""
[templates.defaults]
term_start = "2026-01"
term_end = "2031-12"
principal = "10000000"
interest_rate = "0.06"
term_months = "72"

[[templates]]
id = "credit.pool_float_io_bullet"
label = "Floating-rate IO pool, bullet at maturity"
kind = "contract"
body = """
contract credit.pool_float_io_bullet.pool_a {
  term ${term_start}..${term_end}
  terms {
    principal = ${principal}
    index_curve = "${index_curve}"
    margin = ${margin}
    term_months = ${term_months}
  }
}
"""
[templates.defaults]
term_start = "2026-01"
term_end = "2031-12"
principal = "10000000"
index_curve = "sofr"
margin = "0.025"
term_months = "72"

[[templates]]
id = "credit.purchase"
label = "Pool purchase price"
kind = "contract"
body = """
contract credit.purchase.pool_a {
  term ${term_start}..${term_start}
  terms {
    price = ${price}
  }
}
"""
[templates.defaults]
term_start = "2026-01"
price = "0"

