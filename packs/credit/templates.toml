[[templates]]
id = "credit.purchase"
label = "Purchase — price paid at close"
kind = "contract"
body = """
contract credit.purchase {
  term ${term_start}..${term_start}
  terms {
    price = ${price}
  }
}
"""
[templates.defaults]
term_start = "2026-01"
price = "24750000"
