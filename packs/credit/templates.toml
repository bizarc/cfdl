# Credit contract templates — the conventional starting set, offered by the
# editor as snippets (the LSP reads these for completion and `applyTemplate`).
#
# Each template carries the terms its rule REQUIRES, with a conventional value
# where a convention exists and zero where only the deal knows. A term may hold
# an expression, so a varying rate is written directly —
# `growth_rate = curve_value("cpi", time.date)` — and no template offers a
# curve-selector twin.
#
# `${key}` placeholders resolve from the request, then from
# [templates.defaults].

[[templates]]
id = "credit.loan"
label = "Loan, or a representative loan for a pool (six collection streams)"
kind = "contract"
body = """
contract credit.loan.loan_a {
  term ${term_start}..${term_end}
  terms {
    principal = ${principal}
    interest_rate = ${interest_rate}
    term_months = ${term_months}
    amortization = "${amortization}"
    severity = ${severity}
    servicing_fee = ${servicing_fee}
  }
}
"""
[templates.defaults]
term_start = "2026-01"
term_end = "2031-12"
principal = "10000000"
interest_rate = "0.06"
term_months = "72"
amortization = "level_pay"
severity = "0"
servicing_fee = "0"

[[templates]]
id = "credit.purchase"
label = "Purchase price of a loan or a pool of loans"
kind = "contract"
body = """
contract credit.purchase.loan_a {
  term ${term_start}..${term_start}
  terms {
    price = ${price}
  }
}
"""
[templates.defaults]
term_start = "2026-01"
price = "0"

[[templates]]
id = "credit.participation"
label = "Participation (pass-through of the collateral's cash)"
kind = "contract"
body = """
contract credit.participation.loan_a {
  term ${term_start}..${term_end}
  terms {
    face = ${face}
    share = ${share}
  }
}
"""
[templates.defaults]
term_start = "2026-01"
term_end = "2031-12"
face = "10000000"
share = "1.0"

[[templates]]
id = "credit.note"
label = "Structured note (a class paid by the priority of payments)"
kind = "contract"
body = """
entity container trust : Container.SPV
entity party class_a_holders : Credit.Party.Investor { name = "Class A noteholders" }
account class_a_principal { owner party.class_a_holders }

contract credit.note class_a on entity container.trust {
  term ${term_start}..${term_end}
  terms {
    face = ${face}
    coupon = ${coupon}
    principal_account = class_a_principal
  }
  parties {
    holder = party.class_a_holders
  }
}
"""
[templates.defaults]
term_start = "2026-01"
term_end = "2031-12"
face = "10000000"
coupon = "0.05"
