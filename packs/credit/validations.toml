# Credit pack domain validations.
#
# Codes are stable and are never renamed or reused (docs/08_diagnostics.md).
#
# Presence of required terms is enforced generically by
# E5006_MISSING_CONTRACT_TERM, derived from the lowering templates. These are
# the domain constraints on top. Pool math uses a closed-form factor
# decomposition, so an out-of-range rate does not fail loudly — it silently
# produces a plausible but wrong balance path. These bounds are what make that
# impossible.
schema_version = 1
code_prefix = "E9"

# Every pool type shares the loss vocabulary.
# (contracts are named `credit.<type>.<instance>`, so these match on instance.)

# --- pool economics ---------------------------------------------------------

[[validations]]
contract = "credit.loan"
code = "E9001_CREDIT_INVALID_BALANCE"
message = "Credit loan 'principal' must be greater than 0."
check = "term_number"
term = "principal"
when = "present"
on_invalid = "report"
exclusive_min = 0.0

[[validations]]
contract = "credit.loan"
code = "E9002_CREDIT_INVALID_RATE"
message = "Credit loan 'interest_rate' must be a non-negative annual rate."
check = "term_number"
term = "interest_rate"
when = "present"
on_invalid = "report"
min = 0.0

[[validations]]
contract = "credit.loan"
code = "E9003_CREDIT_INVALID_TERM_MONTHS"
message = "Credit loan 'term_months' must be a whole number greater than 0."
check = "term_number"
term = "term_months"
number = "integer"
when = "present"
on_invalid = "report"
exclusive_min = 0.0

# --- prepayment, default, and loss ------------------------------------------

[[validations]]
contract = "credit.loan"
code = "E9010_CREDIT_INVALID_CPR"
message = "Credit 'cpr' must be an annual rate between 0 and 1."
check = "term_number"
term = "cpr"
when = "present"
on_invalid = "report"
min = 0.0
max = 1.0

[[validations]]
contract = "credit.loan"
code = "E9011_CREDIT_INVALID_CDR"
message = "Credit 'cdr' must be an annual rate between 0 and 1."
check = "term_number"
term = "cdr"
when = "present"
on_invalid = "report"
min = 0.0
max = 1.0

[[validations]]
contract = "credit.loan"
code = "E9012_CREDIT_INVALID_SEVERITY"
message = "Credit 'severity' must be a fraction between 0 and 1."
check = "term_number"
term = "severity"
when = "present"
on_invalid = "report"
min = 0.0
max = 1.0

[[validations]]
contract = "credit.loan"
code = "E9013_CREDIT_INVALID_RECOVERY_LAG"
message = "Credit 'recovery_lag_months' must be a whole number of months, 0 or more."
check = "term_number"
term = "recovery_lag_months"
number = "integer"
when = "present"
on_invalid = "report"
min = 0.0

# --- servicing and penalties ------------------------------------------------

[[validations]]
contract = "credit.loan"
code = "E9014_CREDIT_INVALID_SERVICING_FEE"
message = "Credit 'servicing_fee' must be an annual rate between 0 and 1."
check = "term_number"
term = "servicing_fee"
when = "present"
on_invalid = "report"
min = 0.0
max = 1.0

[[validations]]
contract = "credit.loan"
code = "E9015_CREDIT_INVALID_PREPAY_PENALTY"
message = "Credit 'prepay_penalty_rate' must be a rate between 0 and 1."
check = "term_number"
term = "prepay_penalty_rate"
when = "present"
on_invalid = "report"
min = 0.0
max = 1.0

# --- floating-rate pools ----------------------------------------------------

# A floor above the cap would clamp every coupon to the floor, silently
# producing a fixed-rate pool.
[[validations]]
contract = "credit.loan"
code = "E9020_CREDIT_RATE_FLOOR_ABOVE_CAP"
message = "Credit 'rate_floor' must be less than or equal to 'rate_cap'."
check = "term_compare"
left = "rate_floor"
op = "le"
right = "rate_cap"

# --- ramped hazard speeds ----------------------------------------------------
#
# Each names a published convention and is a MULTIPLE, not a percent:
# psa_speed = 1.5 is 150% PSA. Zero selects the flat cpr/cdr path, which is why
# these default to "0" and every model written before them is unchanged.
#
# Upper bounds are deliberately generous rather than tight — 500% PSA is a real
# quote — but not unbounded: the survival factor is additive,
# k = (1 - mdr) - smm, so a large enough speed drives k negative and the pool
# factor flips sign at a specific month with nothing to notice it.

# THE FLOOR IS A DEFINITION AND THE CEILING IS A CONVENTION (docs/13 §7.56).
# A negative multiple of a prepayment curve means nothing, so 0 is an error.
# 1000% PSA is the highest speed a published table prints, so above it the
# model is almost certainly not what was meant — but a stress case may mean
# exactly that, and the language does not take the choice away: the ceiling
# warns, under a W code, and a model that means it allowlists the warning.
[[validations]]
contract = "credit.loan"
code = "E9016_CREDIT_INVALID_PSA_SPEED"
message = "Credit 'psa_speed' is a multiple of the standard prepayment curve, so 1.5 means 150% PSA. It must be 0 or more."
check = "term_number"
term = "psa_speed"
when = "present"
on_invalid = "report"
min = 0.0

[[validations]]
contract = "credit.loan"
code = "W9001_CREDIT_PSA_SPEED_ABOVE_TEN"
message = "Credit 'psa_speed' is above 10 (1000% PSA), the highest speed a published table prints. State it if the stress is meant."
severity = "warning"
check = "term_number"
term = "psa_speed"
when = "present"
on_invalid = "skip"
max = 10.0

[[validations]]
contract = "credit.loan"
code = "E9017_CREDIT_INVALID_SDA_SPEED"
message = "Credit 'sda_speed' is a multiple of the standard default assumption, so 1.0 means 100% SDA. It must be 0 or more."
check = "term_number"
term = "sda_speed"
when = "present"
on_invalid = "report"
min = 0.0

[[validations]]
contract = "credit.loan"
code = "W9002_CREDIT_SDA_SPEED_ABOVE_TEN"
message = "Credit 'sda_speed' is above 10 (1000% SDA), the highest speed a published table prints. State it if the stress is meant."
severity = "warning"
check = "term_number"
term = "sda_speed"
when = "present"
on_invalid = "skip"
max = 10.0

[[validations]]
contract = "credit.loan"
code = "E9018_CREDIT_INVALID_ABS_SPEED"
message = "Credit 'abs_speed' is the Absolute Prepayment Model speed: the fraction of ORIGINAL balance prepaying each month, already monthly. It must be between 0 and 1."
check = "term_number"
term = "abs_speed"
when = "present"
on_invalid = "report"
min = 0.0
max = 1.0

[[validations]]
contract = "credit.loan"
code = "E9019_CREDIT_INVALID_AGE_MONTHS"
message = "Credit 'age_months' is the age at the model's start (a representative loan's weighted average), in months. It must be a non-negative integer."
check = "term_number"
term = "age_months"
number = "integer"
when = "present"
on_invalid = "report"
min = 0.0

# A share is a fraction of the pool's cash: above 1 pays out more than the pool
# produced, and 0 is a participation in nothing.
[[validations]]
contract = "credit.participation"
code = "E9021_CREDIT_INVALID_SHARE"
message = "Participation 'share' must be greater than 0 and at most 1."
check = "term_number"
term = "share"
when = "present"
on_invalid = "report"
exclusive_min = 0.0
max = 1.0

[[validations]]
contract = "credit.note"
code = "E9022_CREDIT_INVALID_COUPON"
message = "Note 'coupon' must be zero or more."
check = "term_number"
term = "coupon"
when = "present"
on_invalid = "report"
min = 0.0
