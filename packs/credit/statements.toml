# ---------------------------------------------------------------------------
# SUB-INDUSTRY VIEWS.
#
# One asset class, several conventions. The categories do not change — the same
# cash is the same cash — but what a reader groups, names and puts first does.
# A remittance report splits principal scheduled/unscheduled because that is
# what CPR and SMM act on, and reports available funds. A BDC's statement of
# operations reports total investment income and net investment income, because
# that is what NII per share is struck from. Forcing both through one layout
# serves neither, and the completeness gate makes each view provably total.

[[subtotals]]
id = "domain.credit.total_investment_income"
kind = "money"
op = "sum"
categories = ["operating.collection.interest", "operating.collection.penalty"]
formula = "sum(interest income, fee income)"

# Agency / structured MBS. Principal first and split, because a pool factor and
# a CPR are statements about principal, not about total cash.
[[statements]]
id = "mbs"
label = "Remittance report"

[[statements.rows]]
kind = "line"
label = "Scheduled principal"
depth = 1
categories = ["operating.collection.principal"]

[[statements.rows]]
kind = "line"
label = "Unscheduled principal"
depth = 1
categories = ["operating.collection.prepayment"]

[[statements.rows]]
kind = "line"
label = "Income taxes"
depth = 2
categories = ["operating.income_tax.paid"]
display = "positive"

[[statements.rows]]
kind = "subtotal"
label = "Total principal distribution"
depth = 0
subtotal = "domain.credit.principal_collections"

[[statements.rows]]
kind = "line"
label = "Gross interest"
depth = 1
categories = ["operating.collection.interest"]

[[statements.rows]]
kind = "line"
label = "Liquidation proceeds and recoveries"
depth = 1
