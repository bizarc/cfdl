# Credit per-period subtotals and the collections statement.
#
# Shaped like a SERVICER REMITTANCE REPORT, which is the artifact this domain
# actually publishes: what the pool collected this period, split by what the
# money was, less the servicing fee, leaving what is available to distribute.
# An ABS exhibit and a monthly investor report both have this shape.
#
# These fold CATEGORIES, not stream names, which is what keeps them correct as
# the pack grows. `packs/credit/metrics.toml` names streams by hand and has to
# be edited whenever a rule is added.
#
# Order is dependency order — a subtotal may reference only ones above it.

# Everything the pool collected, before the servicer is paid. Interest,
# scheduled principal, prepayments, recoveries and fees are separate categories
# precisely so this can be one fold over them rather than a list that has to be
# maintained.
[[subtotals]]
id = "domain.credit.gross_collections"
kind = "money"
op = "sum"
categories = ["operating.collection.*"]
formula = "sum(operating.collection.*)"

# Principal returned, scheduled and unscheduled together.
#
# This is the series backlog 7.12 is about. Percent-of-pool-outstanding is
# derived from CUMULATIVE principal, and until now there was no per-period
# series carrying it — so `benchmarks/credit/auto_abs_speed_050` reconciles its
# published percent-outstanding column in prose. It is not the whole of 7.12
# (that needs the original balance to divide by), but it is the input that was
# missing.
[[subtotals]]
id = "domain.credit.principal_collections"
kind = "money"
op = "sum"
categories = ["operating.collection.principal", "operating.collection.prepayment"]
formula = "sum(scheduled principal, prepayments)"

# The servicing fee, signed positive as an amount paid.
[[subtotals]]
id = "domain.credit.servicing_fee"
kind = "money"
op = "negated_sum"
categories = ["operating.expense.servicing"]
formula = "-sum(operating.expense.servicing)"

# What is left to distribute. `operating.*` rather than
# `gross_collections - servicing_fee`: the two are equal by construction, and
# folding the section means a new operating category lands here without this
# file changing.
[[subtotals]]
id = "domain.credit.net_collections"
kind = "money"
op = "sum"
categories = ["operating.*"]
formula = "sum(operating.*)"

# --- Pool factor -----------------------------------------------------------
#
# Percent of the pool still outstanding is what an ABS exhibit publishes, and
# it is a STOCK derived from a FLOW: cumulative principal against the original
# balance. Every other subtotal here answers "what happened this period"; these
# answer "how much so far", which is why they need the `cumulative` op.
#
# Until they existed, `benchmarks/credit/auto_abs_speed_050` reconciled its
# published percent-outstanding column in prose, because there was no per-period
# series to assert against.

# Principal returned to date, scheduled and unscheduled together.
[[subtotals]]
id = "domain.credit.principal_paid_to_date"
kind = "money"
op = "cumulative"
subtotals = ["domain.credit.principal_collections"]
formula = "running total of principal collections"

# What was advanced to acquire the pool. `negated_cumulative` because a purchase
# is an outflow and stored negative; the original balance is a positive number.
# Cumulative rather than per-period so it stays available in every later period,
# not only the one the pool was bought in.
[[subtotals]]
id = "domain.credit.original_balance"
kind = "money"
op = "negated_cumulative"
categories = ["investing.acquisition.purchase"]
formula = "-cumulative(investing.acquisition.purchase)"

# Principal paid to date, negated, so the subtraction below is a sum. `sum`
# adds its referenced subtotals; there is no subtracting op, and adding a
# negative is the same arithmetic with one fewer concept in the language.
[[subtotals]]
id = "domain.credit.principal_paid_negated"
kind = "money"
op = "negated_cumulative"
subtotals = ["domain.credit.principal_collections"]
formula = "-cumulative(principal collections)"

# Still outstanding: what was advanced, less what has come back.
[[subtotals]]
id = "domain.credit.balance_outstanding"
kind = "money"
op = "sum"
subtotals = [
  "domain.credit.original_balance",
  "domain.credit.principal_paid_negated",
]
formula = "original balance less principal paid to date"

# The published figure. Undefined before the pool is bought, which is a zero
# denominator and so a null rather than a misleading 1.0.
[[subtotals]]
id = "domain.credit.pool_factor"
kind = "number"
op = "ratio"
numerator = "domain.credit.balance_outstanding"
denominator = "domain.credit.original_balance"
formula = "domain.credit.balance_outstanding / domain.credit.original_balance"

