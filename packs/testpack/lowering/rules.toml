[[rules]]
id = "emit_testpack_stream"
contract_name = "test.lease_contract"
stream_name = "testpack.lowered"
owner_entity = "legal.borrower"
direction = "inflow"
amount_expr = "1234"
schedule_kind = "every"
schedule_from = "2026-01"
schedule_to = "2026-12"

[[rules]]
id = "emit_parameterized_fee"
contract_name = "test.fee_contract"
stream_name = "testpack.fee"
owner_entity = "legal.borrower"
direction = "inflow"
amount_expr = "{{contract.rate}} * {{contract.units}}"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
units = "10"

[[rules]]
# A rule that pays on its own rhythm rather than the model's calendar cadence:
# a quarterly coupon on a monthly model. Covers schedule_every end to end.
id = "emit_quarterly_coupon"
contract_name = "test.coupon_contract"
stream_name = "testpack.coupon"
owner_entity = "legal.borrower"
direction = "inflow"
amount_expr = "2500"
schedule_kind = "every"
schedule_every = "quarter"
schedule_from = "2026-01"
schedule_to = "2027-12"

[[rules]]
# A rule that narrows the pack's cadence support. testpack itself declares no
# `cadences`, so it is unconstrained; this rule is month-locked on its own.
# Covers E5014 — the per-rule gate that lets a pack carry neutral and
# month-locked rules side by side while it is being migrated.
id = "emit_monthly_only_fee"
contract_name = "test.monthly_only_contract"
stream_name = "testpack.monthly_only"
owner_entity = "legal.borrower"
direction = "inflow"
amount_expr = "{{contract.amount_year}} / 12"
cadences = ["monthly"]
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"
