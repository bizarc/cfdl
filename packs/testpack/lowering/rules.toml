[[rules]]
id = "emit_testpack_stream"
contract_name = "test.lease_contract"
stream_name = "testpack.lowered"
owner_entity = "legal.borrower"
direction = "inflow"
amount_expr = "1234"
schedule_kind = "every"
schedule_from = "2026-01"
schedule_to = "2026-12"

[[rules]]
id = "emit_parameterized_fee"
contract_name = "test.fee_contract"
stream_name = "testpack.fee"
owner_entity = "legal.borrower"
direction = "inflow"
amount_expr = "{{contract.rate}} * {{contract.units}}"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
units = "10"

[[rules]]
# A rule that pays on its own rhythm rather than the model's calendar cadence:
# a quarterly coupon on a monthly model. Covers schedule_every end to end.
id = "emit_quarterly_coupon"
contract_name = "test.coupon_contract"
stream_name = "testpack.coupon"
owner_entity = "legal.borrower"
direction = "inflow"
amount_expr = "2500"
schedule_kind = "every"
schedule_every = "quarter"
schedule_from = "2026-01"
schedule_to = "2027-12"

[[rules]]
# A rule that narrows the pack's cadence support. testpack itself declares no
# `cadences`, so it is unconstrained; this rule is month-locked on its own.
# Covers E5014 — the per-rule gate that lets a pack carry neutral and
# month-locked rules side by side while it is being migrated.
id = "emit_monthly_only_fee"
contract_name = "test.monthly_only_contract"
stream_name = "testpack.monthly_only"
owner_entity = "legal.borrower"
direction = "inflow"
amount_expr = "{{contract.amount_year}} / 12"
cadences = ["monthly"]
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[[rules]]
# Exercises every cadence primitive at once, so a fixture can prove they
# resolve correctly on each calendar rather than only compiling.
#   {{model.periods_per_year}}  annual figure -> per-period figure
#   {{time.elapsed_periods}}    whole periods since term_start
#   {{time.elapsed_years}}      whole years since term_start (anniversary step)
#   {{periods.<term>}}          months -> possibly-fractional periods
#   {{whole_periods.<term>}}    months -> integral periods, or E5015
id = "emit_cadence_probe"
contract_name = "test.cadence_probe"
stream_name = "testpack.cadence_probe"
owner_entity = "legal.borrower"
direction = "inflow"
amount_expr = "({{contract.amount_year}} / {{model.periods_per_year}}) * clamp({{time.elapsed_periods}} + 1 - {{periods.free_months}}, 0, 1) * pow(1 + {{contract.escalation}}, {{time.elapsed_years}}) * if({{time.elapsed_periods}} < {{whole_periods.term_months}}, 1, 0)"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"

[rules.defaults]
escalation = "0"
free_months = "0"

[[rules]]
# A RULE READS BOTH ENDS OF ITS OWN FIELD — the average-balance accessor.
#
# `field.<name>` is the rule's placeholder for a field it declares, and
# lowering rewrites it through the ENTITY ROOT (`entity.<subject>.<field>`)
# because the bare family alias covers the four declared families only and a
# rule may sit on any entity. `prev` had no matching binding for that spelling,
# so this expression resolved to nothing and the stream evaluated to a SILENT
# ZERO with a warning rather than an error — the one failure mode the language
# is supposed not to have. No shipped pack exercised it: the credit pack
# reaches the same value by declaring a second, lagged field.
#
# Interest on the average of opening and closing balance is the shape that
# forced it — a construction facility, and every commercial draw schedule.
id = "emit_average_balance_interest"
contract_name = "test.avg_balance_contract"
stream_name = "testpack.avg_balance_interest"
owner_entity = "${subject}"
direction = "outflow"
amount_expr = "(prev.field.testpack_balance + field.testpack_balance) / 2 * {{contract.rate}}"
field_name = "testpack_balance"
field_init = "{{contract.draw}}"
field_next = "prev + {{contract.draw}}"
schedule_kind = "every"
schedule_from = "{{contract.term_start}}"
schedule_to = "{{contract.term_end}}"
