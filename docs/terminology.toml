[[not_approved]]
# This entry BUILDS rule W6. The terms below are the gate, not a copy of it:
# tools/check-site-voice.py compiles them at run time, so adding one here is the
# whole change. Until 2026-09-16 the list lived twice, hardcoded in the tool and
# restated here under a comment claiming the two could not drift, while nothing
# read this copy at all.
id = "W6"
why = "reads as marketing rather than documentation"
mode = "gate"
terms = [
  "blazing", "blazingly", "lightning-fast", "lightning fast", "world-class",
  "world class", "cutting-edge", "cutting edge", "best in class",
  "state-of-the-art", "state of the art", "revolutionary", "seamless",
  "seamlessly", "effortless", "effortlessly", "game-changer", "game changer",
  "game-changing", "game changing", "best-in-class",
  "unparalleled", "robust and", "powerful and", "simply put", "crown jewel",
  # Added 2026-09-16. Intensifiers and self-praise the original list missed.
  "incredibly", "extremely", "remarkably", "dramatically", "vastly", "hugely",
  "massively", "elegantly", "beautifully", "trivially", "effortless",
  "just works", "magical", "magically", "turnkey", "bulletproof", "rock-solid",
  "battle-tested", "enterprise-grade", "supercharge", "supercharged",
]
reason = "Marketing ornament. Each is a claim the reader should be left to make."
use_instead = "State what the software does."
enforced_by = "tools/check-site-voice.py"
occurrences = 0

[[not_approved]]
terms = ["mm"]
reason = "Reads as millimetres. Not a standard abbreviation for millions outside a trading desk."
use_instead = "m — write $33.6m, not $33.6mm"
context = "currency"

[[not_approved]]
terms = ["×"]
reason = "U+00D7 multiplication sign. Present in the generated benchmark pages."
use_instead = "x — write 8.0x"
# Contextual, like `mm`: banned as a valuation multiple (a digit, then the sign),
# correct in spaced arithmetic and in grid dimensions. X1 carries that context.
context = "multiple"

[[not_approved]]
terms = ["‑"]
reason = "U+2011 non-breaking hyphen. Invisible in review and breaks search. Present in docs/01_language_spec.md."
use_instead = "- (U+002D)"

# ---------------------------------------------------------------------------
# Rules carried as data.
#
# Each entry builds one rule in tools/check-site-voice.py. `mode` decides what a
# finding costs:
#
#   gate    — fails the build. For rules that are mechanical and measure zero,
#             where a hit is a defect and never a judgment call.
#   review  — reported, never fails. For rules that are worth seeing and cannot
#             be made precise enough to block on. The gate's founding rule is
#             that a gate flagging judgment gets disabled, so judgment is
#             surfaced here instead of being either enforced or dropped.
#
# A review rule is promoted to a gate once its findings have been worked through
# and its list calibrated. That is the intended direction of travel.
# ---------------------------------------------------------------------------

[[rule]]
id = "N5"
mode = "gate"
why = "names a competitor product"
terms = ["Argus", "Intex", "PySAM", "System Advisor Model", "NREL's SAM"]
reason = """
Comparison against these is internal work. The parity documents discuss them at
length and none of that reaches a reader. Naming one on a published page turns a
measurement into a competitive claim, which is not what the documentation is for.
"""
use_instead = "Say what CFDL does. Let the reader make the comparison."
waivable = false
occurrences = 0

# Deliberately NOT in the list above: Excel. It is named across the published
# pages as an interchange format and as a technique — the rounding it produces,
# the compatibility mode that reproduces it, the circularity its users recognise.
# Those are facts a reader needs. A claim of superiority over it is caught by N8.

[[rule]]
id = "N8"
mode = "review"
why = "claims superiority rather than stating what the software does"
terms = [
  "better than", "faster than", "simpler than", "cleaner than", "safer than",
  "more accurate than", "more powerful than", "superior to", "outperforms",
  "outperform", "beats", "no other", "the only tool", "the only language",
  "unlike most", "unlike other", "replaces the need for", "industry-leading",
]
reason = "A comparison the reader did not ask for, and usually cannot check."
use_instead = "State the behaviour and let it stand on its own."

[[rule]]
id = "N9"
mode = "review"
why = "discloses that the product is unfinished"
terms = [
  "not yet implemented", "not yet supported", "not yet built", "not yet shipped",
  "cannot yet", "does not yet", "no support for", "currently lacks",
  "for now", "in a future release", "future work", "planned for",
  "a known limitation", "this limitation", "work around this",
]
reason = """
docs/16 §2.2 settles this: the repository records why, the site publishes the
conclusions. A sentence about what the software cannot do yet tells a reader the
tool is a work in progress, which is a statement about the project rather than
about the product.

The word `cannot` alone is deliberately absent. A specification legitimately says
what is not permitted, and the temporal markers are what distinguish a rule from
an apology.
"""
use_instead = "State what the software does. Leave the roadmap in the repository."

[[rule]]
id = "N7"
mode = "review"
why = "gives software a mind"
subjects = [
  "model", "engine", "language", "compiler", "parser", "pack", "gate", "checker",
  "stream", "contract", "waterfall", "schedule", "account", "scenario", "run",
]
verbs = [
  "wants", "want", "knows", "know", "thinks", "think", "believes", "believe",
  "hopes", "hope", "cares", "care", "likes", "like", "prefers", "prefer",
  "tries", "try", "struggles", "struggle", "remembers", "remember", "forgets",
  "forget", "understands", "understand", "learns", "learn", "feels", "feel",
  "decides", "decide", "expects", "expect", "worries", "worry",
  "happily", "patiently", "eagerly", "politely", "cheerfully",
]
reason = """
A model that wants something is a metaphor standing in for the mechanism, and the
mechanism is what the reader came for.

`refuses` and `rejects` are deliberately absent. A compiler that refuses a program
is the precise word for what it does, not a personification.
"""
use_instead = "Name what the software does: accepts, rejects, evaluates, reports."
