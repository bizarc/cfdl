# Benchmark case: a closed-end fund's distribution waterfall — return of
# capital, a preferred return, and three IRR-hurdle tiers between a limited
# partner and a general partner, monthly over 30 periods.
#
# NO PACK. Written from the bare language: none of energy/cre/credit/opco
# describes a fund's distribution waterfall, and there is no fund pack. The
# benchmark exists before the pack does, which is the order docs/20 section 5.5
# argues for.
#
# Reference: EXTERNAL, private. A fund model in the research corpus; the
# workbook is not redistributable and is not committed. See reference/
# PROVENANCE.md. The frozen inputs carry no party, property or fund name.
#
# Two conventions were RECOVERED, not stated, and each is measurable:
#   * the preferred accrues on capital outstanding at the OPEN of the period.
#     At the close it misses by 199,454 over the fund's life and mismatches
#     one period in thirty; at the open it ties to the cent in all thirty.
#   * each hurdle tier pays a partner only up to that partner's OWN shortfall,
#     capped by its share of the tier. The realised splits therefore look like
#     90/10 rather than the stated 50/50 and 45/55, because neither pool was
#     ever exhausted and each partner simply took what it was short.
#
# Residual: the model agrees with every asserted tier to within $1.36 on $37m
# allocated, which is why period_tolerance is 2.0 rather than a cent. The
# reference rounds the cash-flow vectors it runs its IRR test against to whole
# dollars; this model does not. Tested: rounding here does not close the gap
# and is not worth the fidelity loss.
summary = "A closed-end fund distributing 39,973,982.80 over twenty-nine months against 31,000,000 committed, split by return of capital, an 8% preferred return and three IRR-hurdle tiers, with each partner's return from its own account."
period_tolerance = 2.0

