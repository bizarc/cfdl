# Benchmark case: the Buenavista del Cobre copper mine, Sonora, Mexico,
# 2025-2065.
#
# The case derives the mine's production plan from its reserve statement and
# then values it. Four depleting stocks draw at capacity until they are gone,
# so mine life is a result rather than an input, and grade falls out of mass
# balance rather than being declared.
#
# NO PACK. Written from the bare language, after ppiaf_toll_highway.
#
# TWO COMPARISONS, NEITHER ASSERTED. The operator's production schedule and its
# discounted cash flow are both transcribed here and both are printed by
# reference_gen.py. Asserting either would turn a finding into a target, and
# both move whenever the recovery assumptions move.
#
# FIRST MONTE CARLO CASE IN THE SUITE. The strip ratio is stochastic, because
# the report pins its life-of-mine value and says nothing about its year-to-
# year path. `expected_monte_carlo.json` asserts the aggregates; the seed is
# declared, so what is checked is this engine on this seed rather than a
# statistical claim. The harness gained monte carlo support for this case.
#
# TRIAL COUNT. 500 trials runs in about 15 seconds on a release build and
# about 70 on a debug build, which is what the suite uses. That is the cost of
# asserting a distribution and it is deliberate.
#
# Status: verified. 41 periods x 15 columns, 2 metrics and 5 Monte Carlo
# aggregates reproduce at 1e-5.
summary = "A 41-year open-pit copper mine whose production plan is derived from its reserve statement, with the pit's strip ratio drawn from a distribution and the valuation reported as a range."
period_tolerance = 0.00001
