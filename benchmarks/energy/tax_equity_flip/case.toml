# Benchmark case: a tax-equity partnership flip, with the flip date derived.
#
# Reconciled against the national laboratory's open-source project-finance
# model in its leveraged-partnership-flip configuration (BSD-3, run once
# outside this repo — see NOTES.md for the version, the inputs and the
# command). Nothing about that tool persists here: no vendored package, no CI
# dependency, no reference_gen.py. The figures below are its outputs, carried
# as anchor values.
#
# Anchors are every operating period on both partners' columns. Period 0 is
# excluded: the reference books a sponsor development fee at close that this
# case does not model, and the flip has nothing to do with it.
#
# period_tolerance = 0.01 — a cent. The reconciliation is far tighter: the
# worst disagreement across all 25 periods and both columns is 1.0e-6 dollars.
summary = "A tax-equity partnership whose flip date is derived from the investor's return rather than stated, reconciled against an external model."
pack = "energy"
period_tolerance = 0.01
