# One Rosslyn — 1901 & 1911 N Fort Myer Drive, Arlington VA
# Penzance with The Baupost Group. Arlington County site plan SP #419,
# amendment SPLA24-00040, approved 2025-07-19.
#
# THE POINT OF THIS CASE is the labelling. Its companion, penzance_highlands,
# reconstructs a COMPLETED deal: land basis, both tower sale prices and 102
# condominium closings are recorded, and the assumptions are bounded by them.
# One Rosslyn has not been built. Its entitlement is fact and its economics are
# forecast, so the ratio is inverted, and every line below says which it is.
#
#   FACT       — in the public record, cited to the document
#   REPORTED   — stated in trade press, NOT verified against an instrument
#   PROJECTION — our forecast. Nothing in the record fixes it.
#   ANCHORED   — a projection calibrated to a recorded Highlands figure,
#                escalated. Named separately because it is not free: the
#                completed deal constrains it.

[meta]
