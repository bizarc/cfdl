# than Pierce's, and no Rosslyn condominium of this size has traded recently.
[condo]
pierce_gross            = 190_186_220     # FACT — 102 recorded closings
pierce_per_unit         = 1_864_571       # FACT
selling_cost            = 0.05            # PROJECTION
