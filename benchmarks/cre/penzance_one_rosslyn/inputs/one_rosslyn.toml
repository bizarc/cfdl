# ------------------------------------------- Rosslyn operating base (2026)
# Arlington County, "2026 Guidebook: Commercial Market Analysis & Guidelines",
# Department of Real Estate Assessments, April 2026 revision, MARKET Apartment
# Guidelines, High-Rise 9+ stories (PCC 313), effective age 2010+, Metro.
# Retrieved 2026-08-25.
#
# NOTE: the Guidebook carries a second, similar set of tables for COMMITTED
# AFFORDABLE units (6.2% cap, $8,100 expenses, 3% vacancy). Those are not these.
# The market tables govern a market-rate tower.
[operating]
cap_rate_metro_highrise = 0.0545          # FACT — 2010+, Metro
expenses_per_unit       = 9_466           # FACT — $/unit/year, 2010+
vacancy_collection      = 0.05            # FACT — includes rent loss and concessions
parking_garage_low      = 50              # FACT — $/space/month
parking_garage_high     = 150             # FACT — $/space/month
land_value_per_unit     = 78_000          # FACT — mid/high-rise within a half-mile
                                          # walk of Metro. One Rosslyn's 772 rental
                                          # units imply $60,216,000 against a
                                          # $52,000,000 recorded basis: the site was
                                          # bought 13.6% BELOW County guideline.

# Rent is DERIVED, not assumed, by the County's own method — the same method the
# companion case uses. A comparable's assessed value times the guideline loaded
# cap gives the assessor's NOI; adding back guideline expenses and grossing up
# for vacancy gives rent. Applied to Central Place (below) on the 2026 roll:
rent_per_unit_month     = 3_789           # DERIVED — $233,287,300 x 5.45% = NOI
                                          # $33,725/unit; + $9,466 expenses; / 0.95.
                                          # +7.6% on Highlands' Aubrey (2022, $3,522)
                                          # and +15.8% on Evo ($3,273).

# -------------------------------------------------- comparable transactions
# All FACT, Arlington County sales records and the 2026 Guidebook's own sales
# tables. A four-point series across two submarkets, not a single observation.
[comps]
# Rosslyn, pure multifamily. Both parcels class 313, one economic unit, no
# office or retail absorbing the per-unit figure.
central_place_price     = 206_250_000     # FACT — deed 20260100010398, 2026-07-21
central_place_units     = 377             # FACT — 74 (RPC 16-038-014) + 303 (-019)
central_place_per_unit  = 547_082         # FACT
central_place_assessed  = 233_287_300     # FACT — 2026 roll; the trade is 88.4%
                                          # of assessed, and assessed implies
                                          # $618,799/unit.
washington_blvd_price   = 158_300_000     # FACT — 3275 Washington Blvd, 2024-12-18
washington_blvd_units   = 267             # FACT
washington_blvd_per_unit = 592_884        # FACT
# The companion case's own exits, confirmed independently in the 2026 Guidebook
# sales table ("Cortland Rosslyn East/West", both 2022-05-17).
evo_per_unit            = 735_385         # FACT — Guidebook; 455 units
aubrey_per_unit         = 805_000         # FACT — Guidebook; 331 units
#
# 805,000 -> 735,385 -> 592,884 -> 547,082 from May 2022 to July 2026.
# EXCLUDED, with reason: N Herndon St 2025-08-28 at $150,580,000 prices to
# $7,170,476/unit because the 21 units on that parcel are part of a multi-parcel
# trade; 1200 N Courthouse Rd 2026-06-16 at $194,444/unit is inconsistent with
# every market observation and is likely affordable or a partial interest.
# Neither is evidence; both are named so the exclusion is visible.

# ------------------------------------------------------ construction basis
# Anchored to the companion case's ACTUAL spend, escalated by published index.
# Parking is priced per SPACE, not folded into a blended $/sf rate: Highlands
# built 1,037 spaces for 890 units (1.17/unit) against One Rosslyn's 429 for
# 845 (0.51/unit), and a blended rate charges this project for parking it does
# not build.
[construction]
highlands_buildings_psf = 255.00          # FACT — $301,693,050 / 1,183,110 sf GFA
highlands_parking_space = 32_000          # FACT — $33,184,000 / 1,037 spaces
soft_ratio              = 0.180893        # FACT — ratio to hard, companion case
contingency_ratio       = 0.053203        # FACT
developer_fee_ratio     = 0.053736        # FACT
# BLS producer price index, new multifamily/other nonresidential building
# construction OUTPUT prices (series WPUIP2312001, via FRED, retrieved
# 2026-08-25). An OUTPUT index, deliberately: the inputs index (WPUSI012011)
# measures materials and assumes contractor margin and productivity move with
# them, which overstates. Cross-checked against warehouse output (WPUIP2311101)
# at 49.6% over the same window, so 53.4% is not an artefact of one series.
escalation_realized     = 1.5340          # FACT — 2019-11 (Highlands construction
                                          # midpoint) to 2026-07, published
escalation_forward_rate = 0.0343          # PROJECTION — 36-month trailing CAGR on
                                          # the same index, applied 2026-07 to the
                                          # projected 2028-09 midpoint. Trailing
                                          # 12-month is 7.20%, which would raise
                                          # cost materially; 24-month is 4.87%.

# ------------------------------------------------------------------ finance
[finance]
sofr                    = 0.0365          # FACT — 2026-08-24, FRED series SOFR
ust10                   = 0.0470          # FACT — 2026-08-24, FRED series DGS10
construction_spread     = 0.0275          # PROJECTION — no instrument is recorded
loan_rate               = 0.0640          # PROJECTION — SOFR + spread. The
                                          # companion case's facility priced at
                                          # 6.50%, which is a sanity check rather
                                          # than a source.
ltc                     = 0.60            # PROJECTION

