site_plan   = "SP #419 (amendment SPLA24-00040; rezoning REZN25-00001)"
address     = "1901 and 1911 N Fort Myer Drive, Arlington, VA"
rpcs        = ["16-020-001", "16-020-002", "16-020-006"]
approved    = 2025-07-19
sponsor     = "Penzance"
equity      = "The Baupost Group"

