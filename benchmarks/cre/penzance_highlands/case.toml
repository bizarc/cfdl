# Benchmark case: The Highlands, Rosslyn VA — Penzance / The Baupost Group.
# Ground-up mixed-use development on a public-private site: two towers over one
# shared podium, carrying both for-sale and rental product on a single basis,
# a $380M construction facility, and a phased exit.
#
# Reference: an independent Excel implementation (reference_gen.py generates
# this model from the same frozen input set the workbook reads, so the two tie
# by construction rather than by transcription).
# Status: pending practitioner review.
#
# The JV split allocates from `account deal_cash` and both partners hold
# party-owned accounts, so `irr`/`moic` per party are model output rather than
# hand arithmetic (docs/31 W4 phase 3). The seven tier columns in expected.csv
# and the two party totals are the MODEL's own numbers, not the workbook's --
# the Penzance/Baupost terms are private and the tier percentages are stated
# placeholders, so nothing external asserts them. They are pinned as regression
# cover for the tier arithmetic, which is what the accounts conversion touched.
# The workbook-referenced figures are the facility and cash series, and none of
# them moved: see NOTES.md.
summary = "A 160-month ground-up CRE development: land in 2011, a 39-month build on a parabolic draw curve, a $380M facility that funds equity first and capitalizes interest, two rental towers sold in lease-up, and a 34-month condominium sellout."
pack = "cre"
period_tolerance = 0.01

# `model.npv` is deliberately not asserted. The model carries financing
# streams, so its NPV is a LEVERED one, and no source document for this deal
# states a discount rate — the rate in run.json is a stated placeholder. The
# other CRE cases carrying financing (one_lincoln_street, hud_home_multifamily)
# assert no model.npv for the same reason.
[tolerance]
"domain.cre.noi" = 0.01
"domain.cre.egi" = 0.01
"domain.cre.opex_total" = 0.01
"domain.cre.debt_service" = 0.01
"domain.cre.dscr" = 1.0e-6
