# Benchmark case: HUD HOME Multifamily Underwriting Template, populated Sample.
#
# THE ONE SOURCE WE CAN SHIP. A US federal work dedicated to the public domain,
# so the reference workbook itself is committed under reference/ — the first and
# only external case in this repo where a reader can open the source and check
# us, rather than take the reconciliation on trust.
#
# Every figure in expected.csv and expected_metrics.json is read out of that
# workbook's Operating Pro Forma. There is deliberately no reference_gen.py.
#
# Anchors: years 1-3 and 5 pin the trends, 10 pins the compounding, and
# 14/15/16/17 bracket BOTH the first mortgage maturing and the affordability
# cliff, where restricted rents revert to market and gross rent steps 46% in one
# year. Those four are the point of the case — a model with the right trend and
# the wrong switch looks correct for thirteen years.
#
# period_tolerance = 0.5 — the theoretical floor, and every line now sits under
# it. The workbook publishes whole dollars, so half a dollar is the most an
# exact figure can differ from its rounded print; nothing here needs more.
#
#   cre.unit.base_rent.home       worst 0.45   whole-dollar rounding
#   cre.vacancy.loss              worst 0.48   whole-dollar rounding
#   cre.ops.revenue               worst 0.42   whole-dollar rounding
#   cre.property.opex             worst 0.00   exact
#   cre.ops.expense               worst 0.00   exact
#   loan.permanent_debt_service   worst 0.00   exact
#
# THE TWO EXPENSE LINES WERE THE REASON THIS CASE CARRIED A TOLERANCE OF 13.
# The workbook escalates them as a RECURRENCE — each year is last year's
# already-rounded figure times the trend — and `pow(1 + trend, t)` compounds
# exact decimals from the base instead, so the paths separated a little more
# every year and reached 12.26 on 204,655 at year 29.
#
# Declared states express the recurrence directly, and both lines now reproduce
# the published figures EXACTLY over 29 years. Note the total expense line needs
# FOUR states, one per published sub-line: the workbook rounds each sub-line
# before summing, and rounding the sum is different arithmetic. Modelling the
# total as one rounded line still left 11.00.
#
# This is one half of the acceptance test for docs/14_state_and_recurrence.md.
# The other is benchmarks/opco/damodaran_fcff, an unrelated source in an
# unrelated pack. Two independent published sources confirming one mechanism.
pack = "cre"
period_tolerance = 0.5

# One tolerance cannot serve this case, which is why the published subtotals
# went unasserted until now.
#
# The workbook rounds every pro forma line to whole dollars and CFDL carries
# full precision, so the money lines agree to within a dollar and no closer.
# The DSCR is quoted to sixteen significant figures and agrees to five decimals
# — but it is computed from the ROUNDED NOI over the ROUNDED debt service, so
# the residual is that rounding rather than a modelling difference. NOTES.md
# records all four values and the differences.
#
# A single 1.0 would assert nothing about the ratio; a single 1e-4 would fail
# every money line.
[tolerance]
"domain.cre.egi" = 1.0
"domain.cre.noi" = 1.0
"domain.cre.dscr" = 1.0e-4
