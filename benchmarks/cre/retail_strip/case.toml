# Benchmark case: retail strip — base-year stop with 95% gross-up,
# percentage rent above breakpoint, net-lease inline shops, forward-NOI exit.
# Reference: reference_gen.py (independent implementation).
# Status: pending practitioner review against institutional-grade references.
summary = "A retail strip centre with base-year expense gross-ups, percentage rent over a breakpoint, and staggered tenant rollover across a ten-year hold."
pack = "cre"
period_tolerance = 0.01

# Per-period EGI and NOI. This case asserted a LIFETIME NOI of 4,012,080.73 and
# nothing about the 120 periods that produce it — so percentage rent, the
# base-year gross-up and the recovery stop could each be wrong in offsetting
# ways and the total would still land.
[tolerance]
"domain.cre.egi" = 0.01
"domain.cre.noi" = 0.01
