# Benchmark case: a 30-year agency-MBS pool at market-standard prepayment,
# default and recovery conventions.
#
# Validated for parity against the published industry reference schedule for
# MBS cash flows. That source is external and not redistributable, so it is not
# vendored and its tables are not reproduced — the figures below are anchor
# values carried for regression, cited as facts.
#
# Every number asserted here is external, not ours. There is deliberately no
