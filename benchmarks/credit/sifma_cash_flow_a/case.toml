# Benchmark case: SIFMA Cash Flow A — the industry's definitional MBS schedule.
#
# Source: SIFMA, Standard Formulas for the Analysis of Mortgage-Backed
# Securities (Uniform Practices Manual, Chapter SF), "Sample Cash Flows".
# EXTERNAL and NOT REDISTRIBUTABLE — the document states "reproduction in any
# form is strictly forbidden". Only the derived expected.csv is committed; the
# PDF is not vendored and its tables are not reproduced wholesale.
#
# Every number asserted here is SIFMA's, not ours. There is deliberately no
# reference_gen.py and no expected_metrics.json: a second implementation of our
# own is exactly what this case exists to replace. See NOTES.md.
#
# period_tolerance = 0.51 — the published table is rounded to whole dollars, so
# half a dollar is the tightest bound the source can support. Not loosened
# beyond that: at 0.51 the engine matches 1044 of 1044 published figures.
pack = "credit"
period_tolerance = 0.51
