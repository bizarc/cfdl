# Benchmark case: SECURITY GROUP 3 of Fannie Mae REMIC Trust 2019-2 at
# 0% PSA — one of the six non-pricing columns of the decrement table on
# page S-14. `fnma_remic_2019_2_g3` ships the 198% pricing speed and carries
# the deal's full description; this case moves only the prepayment assumption.
#
# The 0% column runs on the supplement's ALTERNATIVE collateral — 360-month
# original and remaining terms at 7.50% — stated on page S-12, not on the
# Pricing Assumptions the other six columns share.

# Reference: EXTERNAL. Prospectus Supplement dated 24 January 2019 — see the
# base case's SOURCE.md.
#
# The published percentages are whole numbers, so half a percent of each
# class's original balance is the tightest bound a reader can hold a balance
# to. Cells the table marks '*' (above zero, below half a percent) are not
# asserted.
#
# domain.credit.wal_years carries 0.07: 0.05 is the print floor of a WAL
# published to one decimal, and ~0.015 is the axis — the engine measures on
# its month-end ordinary-annuity axis, while the deal distributes on the 25th
# measured from late-January settlement. The bias is uniform across all seven
# published speeds and the seven reconcile to the printed tenth once it is
# accounted for.
summary = "Group 3 of a Fannie Mae REMIC with the mortgage loans never prepaying — the supplement's own alternative collateral of new 7.50% thirty-year loans, amortising on schedule for thirty years."
pack = "credit"
period_tolerance = 0.01

