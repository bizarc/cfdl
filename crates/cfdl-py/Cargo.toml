[package]
name = "cfdl-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Python bindings for the CFDL SDK"
publish = false

[lib]
name = "cfdl_sdk_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
serde_json = { workspace = true }
cfdl-compile = { path = "../cfdl-compile" }
cfdl-engine = { path = "../cfdl-engine" }
cfdl-metrics = { path = "../cfdl-metrics" }
cfdl-run = { path = "../cfdl-run" }
cfdl-statement = { path = "../cfdl-statement" }
cfdl-pack = { path = "../cfdl-pack" }
