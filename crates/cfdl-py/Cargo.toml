[package]
name = "cfdl-py"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "cfdl_sdk_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde_json = { workspace = true }
cfdl-compile = { path = "../cfdl-compile" }
cfdl-engine = { path = "../cfdl-engine" }
cfdl-pack = { path = "../cfdl-pack" }
