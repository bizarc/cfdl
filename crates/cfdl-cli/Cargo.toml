[package]
name = "cfdl-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CFDL command-line interface"
publish = false

[[bin]]
name = "cfdl"
path = "src/main.rs"

[dependencies]
cfdl-parser = { path = "../cfdl-parser" }
cfdl-lexer = { path = "../cfdl-lexer" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

# Internal crates (to be implemented)
# Bundle the standard packs so `cfdl compile` resolves `use pack` with no
# flag and no download. Without this the installed CLI could not compile a
# model the browser playground compiles fine, since only wasm and the
# server enabled the feature.
cfdl-compile = { path = "../cfdl-compile", features = ["embedded-packs"] }
cfdl-engine = { path = "../cfdl-engine" }
cfdl-metrics = { path = "../cfdl-metrics" }
cfdl-statement = { path = "../cfdl-statement" }
cfdl-pack = { path = "../cfdl-pack", features = ["embedded-packs"] }