[package]
name = "cfdl-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "WASM bindings for CFDL (compile + run) over embedded packs, for the browser playground"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The playground bundle is downloaded by every visitor, so optimize the final
# binary for size. The workspace release profile already sets lto + a single
# codegen unit; wasm-opt does the rest on the emitted module.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[dependencies]
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
cfdl-compile = { path = "../cfdl-compile", features = ["embedded-packs"] }
cfdl-engine = { path = "../cfdl-engine" }
cfdl-metrics = { path = "../cfdl-metrics" }
cfdl-pack = { path = "../cfdl-pack", features = ["embedded-packs"] }
