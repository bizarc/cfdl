[package]
name = "cfdl-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CFDL HTTP API server (axum): compile / validate / run over embedded packs"
publish = false

[[bin]]
name = "cfdl-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["timeout", "limit", "trace"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { version = "4", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }
cfdl-compile = { path = "../cfdl-compile", features = ["embedded-packs"] }
cfdl-engine = { path = "../cfdl-engine" }
cfdl-run = { path = "../cfdl-run" }
cfdl-pack = { path = "../cfdl-pack", features = ["embedded-packs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
