[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "cfdl-sdk"
version = "0.1.0"
description = "Python bindings for the CFDL SDK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "CFDL SDK Team" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
]

[tool.maturin]
manifest-path = "../crates/cfdl-py/Cargo.toml"
module-name = "cfdl_sdk._native"
python-source = "."
