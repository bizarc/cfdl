[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "cfdl-sdk"
version = "0.9.0"
description = "Python bindings for the CFDL SDK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BUSL-1.1" }
authors = [{ name = "Matthew McCrea" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
]
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
dev = ["pytest>=8", "maturin>=1.7,<2.0"]
notebooks = ["jupyter", "matplotlib>=3.8", "nbconvert", "papermill"]

[project.urls]
Homepage = "https://cfdl.dev"
Repository = "https://github.com/bizarc/cfdl"

[tool.maturin]
manifest-path = "../crates/cfdl-py/Cargo.toml"
module-name = "cfdl_sdk._native"
python-source = "."
